<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>數學特工隊｜分配律 50 題</title>

<style>
:root {
  --text-scale: 1;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden; 
}

body {
  background: #f4f2ed;
  color: #20242b;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif;
}

.wrap {
  width: min(1500px, 100%);
  height: 100dvh;
  max-height: 100dvh;
  margin: auto;
  padding: 1.5vh 1.5vw;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.hero {
  flex: 1;
  min-height: 0;
  background: #20242b;
  color: #fff;
  border-radius: 24px;
  padding: 2vh 2vw;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tag {
  font-size: 13px;
  letter-spacing: 3px;
  opacity: .62;
  line-height: 1;
  flex-shrink: 0;
}

h1 {
  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.05;
  margin: 1vh 0 1.5vh;
  font-weight: 950;
  flex-shrink: 0;
}

/* 成績區 */
.scoreboard {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin: 0 0 1.2vh;
  flex-shrink: 0;
}

.score-card {
  background: #fff;
  color: #20242b;
  border-radius: 12px;
  padding: 6px 4px;
  text-align: center;
  border: 3px solid transparent;
}

.score-card.active {
  border-color: #20242b;
  box-shadow: inset 0 0 0 3px #fff;
}

.score-card.total {
  background: #e8e2d8;
}

.score-card .label {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
  opacity: .7;
}

.score-card .value {
  font-size: clamp(18px, 2vw, 24px);
  font-weight: 950;
  line-height: 1.1;
  margin-top: 2px;
}

.score-card .value span {
  font-size: 11px;
  font-weight: 800;
  opacity: .65;
}

/* 遊戲主區 */
.game {
  flex: 1;
  min-height: 0;
  background: #fff;
  color: #20242b;
  border-radius: 20px;
  padding: 1.5vh 2vw;
  border: 3px solid #20242b;
  box-shadow: 0 5px 20px #0000000b;
  display: flex;
  flex-direction: column;
  overflow: hidden; 
}

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  margin-bottom: 1vh;
}

.game-title {
  font-size: clamp(18px, 2vw, 22px);
  font-weight: 950;
  margin: 0;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.font-controls {
  display: flex;
  background: #e8e2d8;
  border-radius: 10px;
  overflow: hidden;
}

.font-btn {
  border: 0;
  background: transparent;
  color: #20242b;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  padding: 6px 12px;
  transition: .15s;
}

.font-btn:hover {
  background: #d4cec4;
}

.restart-btn {
  border: 0;
  background: transparent;
  color: #20242b;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 10px;
}

.restart-btn:hover {
  background: #e8e2d8;
}

/* 學生資訊與繳交按鈕 */
.info-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 1vh;
  flex-shrink: 0;
}

.info-input {
  height: clamp(40px, 5vh, 48px);
  border: 4px solid #e3ded4;
  border-radius: 12px;
  padding: 0 10px;
  font-size: 16px;
  font-weight: 800;
  color: #20242b;
  outline: none;
  background: #fff;
}

.info-input:focus {
  border-color: #20242b;
}

.info-input::placeholder {
  color: #aaa;
}

.info-input:disabled {
  background: #f0f0f0;
  color: #888;
  border-color: #eee;
  cursor: not-allowed;
}

.class-select {
  width: 100px;
  cursor: pointer;
}

.seat-input {
  width: 80px;
  text-align: center;
}

.name-input {
  flex: 1;
  min-width: 100px;
}

.share-btn {
  white-space: nowrap;
  background: #20242b;
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 0 16px;
  height: clamp(40px, 5vh, 48px);
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  transition: 0.15s;
}

.share-btn:hover {
  background: #363c48;
}

.share-btn:active {
  transform: scale(0.95);
}

.share-btn:disabled {
  background: #999;
  color: #fff;
  cursor: not-allowed;
  transform: none;
}

/* 完成解鎖時的呼吸燈 */
@keyframes pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(46, 160, 67, 0.7);
  }
  70% {
    box-shadow: 0 0 0 12px rgba(46, 160, 67, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(46, 160, 67, 0);
  }
}

.ready-to-submit {
  background: #2ea043 !important;
  animation: pulse 1.5s infinite;
}

.ready-to-submit:hover {
  background: #238636 !important;
}

/* 內部動態切換容器 */
.normal-game-area {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

/* LEVEL 選擇 */
.level-select {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin: 0 0 1vh;
  flex-shrink: 0;
}

.level-select button {
  background: #e8e2d8;
  border: 3px solid transparent;
  border-radius: 12px;
  padding: 6px 4px;
  height: clamp(50px, 7vh, 64px);
  font-size: clamp(14px, 1.5vw, 17px);
  font-weight: 950;
  cursor: pointer;
  line-height: 1.15;
  transition: .15s;
  color: #20242b;
}

.level-select button.active {
  background: #20242b;
  color: #fff;
  border-color: #20242b;
}

.level-select button:hover {
  transform: translateY(-2px);
}

.level-select small {
  font-size: 11px;
  font-weight: 800;
  opacity: .78;
}

.level-select button.completed {
  background: #f0f0f0;
  color: #a0a0a0;
  opacity: 0.7;
  cursor: not-allowed;
  border-color: transparent;
}

.level-select button.completed:hover {
  transform: none;
}

/* 題目資訊 */
.top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
}

.badge {
  background: #e9e3d8;
  padding: 4px 12px;
  border-radius: 999px;
  font-weight: 900;
  font-size: 13px;
}

.progress {
  height: 6px;
  background: #e3ded4;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 6px;
  flex-shrink: 0;
}

#bar {
  height: 100%;
  width: 0;
  background: #20242b;
  transition: .3s;
}

/* 題目 */
.question {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(clamp(32px, 4.5vw, 56px) * var(--text-scale));
  font-weight: 950;
  text-align: center;
  margin: 0;
  padding: 0 10px;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

/* 選項 */
.choices {
  flex: 1.3;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 1vh;
  width: 100%;
  flex-shrink: 0;
}

.choices button {
  position: relative;
  border: 0;
  border-radius: 14px;
  background: #e8e2d8;
  color: #20242b;
  font-weight: 900;
  height: 100%;
  min-height: 0;
  padding: 6px 10px 6px 54px;
  cursor: pointer;
  transition: .15s;
  line-height: 1.2;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.choices button .choice-text {
  font-size: calc(clamp(16px, 1.8vw, 24px) * var(--text-scale));
}

.choices button:hover {
  transform: translateY(-2px);
}

.choices button:active {
  transform: translateY(0);
}

.choice-label {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #20242b;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 950;
  flex-shrink: 0;
}

.correct {
  background: #cfe8d5!important;
}

.wrong {
  background: #f0c8c8!important;
}

.correct .choice-label,
.wrong .choice-label {
  background: #20242b;
}

/* 狀態 / 分數 */
.status {
  text-align: center;
  min-height: 24px;
  line-height: 1.3;
  font-weight: 800;
  font-size: 14px;
  margin: 1vh 4px 0;
  flex-shrink: 0;
}

.score {
  text-align: center;
  font-size: 15px;
  font-weight: 900;
  min-height: 22px;
  flex-shrink: 0;
  margin-bottom: 0.5vh;
}

.finish-message {
  font-size: calc(clamp(24px, 3vw, 40px) * var(--text-scale));
  font-weight: 950;
}

/* 錯題本總結區 */
.error-summary {
  display: none;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-right: 5px;
  margin-top: 5px;
}

.error-summary::-webkit-scrollbar {
  width: 6px;
}

.error-summary::-webkit-scrollbar-thumb {
  background: #ccc;
  border-radius: 4px;
}

.error-item {
  background: #f9f8f6;
  border: 2px solid #e3ded4;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}

.error-q {
  font-size: clamp(18px, 2vw, 24px);
  font-weight: 950;
  margin-bottom: 12px;
  line-height: 1.3;
}

.error-badge {
  background: #20242b;
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
  margin-right: 8px;
  vertical-align: middle;
}

.error-choices {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.error-choice {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-radius: 10px;
  font-weight: 900;
  font-size: clamp(14px, 1.5vw, 18px);
}

.error-choice-default {
  background: #e8e2d8;
  color: #20242b;
  opacity: 0.6;
}

.error-choice-correct {
  background: #cfe8d5;
  color: #155724;
  border: 2px solid #2ea043;
}

.error-choice-wrong {
  background: #f0c8c8;
  color: #721c24;
  border: 2px solid #da3633;
}

.error-choice-label {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #20242b;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 14px;
  margin-right: 10px;
  flex-shrink: 0;
}

.error-note {
  font-size: 14px;
  font-weight: 800;
  color: #444;
  background: #e3ded4;
  padding: 10px 12px;
  border-radius: 8px;
  line-height: 1.4;
}

/* 平板 */
@media(max-width: 900px){
  .wrap {
    padding: 1vh;
  }

  .hero {
    padding: 1.5vh;
    border-radius: 18px;
  }

  h1 {
    font-size: 26px;
    margin: 0.5vh 0 1vh;
  }

  .scoreboard {
    gap: 4px;
  }

  .score-card {
    padding: 4px 2px;
    border-radius: 10px;
  }

  .score-card .value {
    font-size: 18px;
  }

  .game {
    padding: 1vh 1.5vw;
    border-radius: 16px;
  }

  .info-input,
  .share-btn {
    height: clamp(36px, 4vh, 44px);
    font-size: 15px;
  }

  .class-select {
    width: 90px;
  }

  .seat-input {
    width: 70px;
  }

  .level-select {
    gap: 4px;
  }

  .level-select button {
    height: clamp(44px, 6vh, 56px);
    font-size: 13px;
    padding: 4px;
  }

  .level-select small {
    font-size: 10px;
  }

  .choices button {
    padding-left: 46px;
  }

  .choice-label {
    width: 28px;
    height: 28px;
    left: 8px;
    font-size: 14px;
  }
}

/* 手機 */
@media(max-width: 600px){
  .wrap {
    padding: 6px;
  }

  .hero {
    padding: 10px;
    border-radius: 14px;
  }

  h1 {
    font-size: 22px;
    margin: 4px 0 8px;
  }

  .score-card {
    padding: 4px 1px;
  }

  .score-card .label {
    font-size: 9px;
  }

  .score-card .value {
    font-size: 15px;
  }

  .score-card .value span {
    font-size: 9px;
  }

  .game {
    padding: 8px;
    border-radius: 12px;
    margin-top: 6px;
  }

  .game-title {
    font-size: 15px;
  }

  .restart-btn,
  .font-btn {
    font-size: 13px;
    padding: 4px 8px;
  }

  .info-row {
    gap: 6px;
  }

  .class-select {
    flex: 1;
    padding: 0 4px;
    font-size: 14px;
    width: auto;
  }

  .seat-input {
    flex: 1;
    padding: 0 4px;
    font-size: 14px;
    width: auto;
  }

  .name-input {
    flex: 1.5;
    padding: 0 8px;
    font-size: 14px;
    width: auto;
  }

  .share-btn {
    flex-basis: 100%;
    margin-top: 2px;
  }

  .info-input,
  .share-btn {
    height: 38px;
    border-width: 3px;
    border-radius: 10px;
  }

  .level-select button {
    height: 42px;
    font-size: 11px;
    border-radius: 8px;
  }

  .level-select small {
    display: none;
  }

  .choices {
    gap: 6px;
  }

  .choices button {
    padding: 4px 6px 4px 40px;
    border-radius: 10px;
  }

  .choice-label {
    width: 26px;
    height: 26px;
    left: 6px;
    font-size: 13px;
  }

  .error-choices {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">
<section class="hero">

  <div class="tag">GRADE 8 · FORMATIVE ASSESSMENT</div>
  <h1>數學特工隊 🕵️‍♂️</h1>

  <div class="scoreboard">

    <div class="score-card" id="scoreCard1">
      <div class="label">LEVEL 1</div>
      <div class="value" id="score1">0<span> / 20</span></div>
    </div>

    <div class="score-card" id="scoreCard2">
      <div class="label">LEVEL 2</div>
      <div class="value" id="score2">0<span> / 20</span></div>
    </div>

    <div class="score-card" id="scoreCard3">
      <div class="label">LEVEL 3</div>
      <div class="value" id="score3">0<span> / 20</span></div>
    </div>

    <div class="score-card" id="scoreCard4">
      <div class="label">LEVEL 4</div>
      <div class="value" id="score4">0<span> / 20</span></div>
    </div>

    <div class="score-card" id="scoreCard5">
      <div class="label">LEVEL 5</div>
      <div class="value" id="score5">0<span> / 20</span></div>
    </div>

    <div class="score-card total">
      <div class="label">🏆 總分</div>
      <div class="value" id="totalScore">0<span> / 100</span></div>
    </div>

  </div>

  <section class="game">

    <div class="game-header">
      <div class="game-title">🎮 選擇關卡</div>

      <div class="header-controls">

        <div class="font-controls">
          <button class="font-btn"
                  onclick="changeFontSize(-0.1)"
                  title="縮小字體">
            A-
          </button>

          <button class="font-btn"
                  onclick="changeFontSize(0.1)"
                  title="放大字體">
            A+
          </button>
        </div>

        <button class="restart-btn"
                onclick="restartGame()">
          ↻ 重新開始
        </button>

      </div>
    </div>

    <!-- 學生資訊 -->
    <div class="info-row">

      <select id="studentClass"
              class="info-input class-select">

        <option value=""
                disabled
                selected>
          班級
        </option>

        <option value="801">801</option>
        <option value="802">802</option>
        <option value="803">803</option>
        <option value="804">804</option>
        <option value="805">805</option>

      </select>

      <input
        id="studentSeat"
        class="info-input seat-input"
        type="number"
        placeholder="座號"
        min="1"
        max="50"
      >

      <input
        id="studentName"
        class="info-input name-input"
        type="text"
        placeholder="輸入姓名"
        autocomplete="off"
      >

      <button
        class="share-btn"
        id="submitBtn"
        onclick="submitScore()"
        disabled>
        🔒 需完成 5 關
      </button>

    </div>

    <!-- 正常遊戲區 -->
    <div id="normalGameArea"
         class="normal-game-area">

      <div class="level-select"
           id="levelSelect">

        <button onclick="chooseLevel(1)">
          LEVEL 1<br>
          <small>10 題 · 20 分</small>
        </button>

        <button onclick="chooseLevel(2)">
          LEVEL 2<br>
          <small>10 題 · 20 分</small>
        </button>

        <button onclick="chooseLevel(3)">
          LEVEL 3<br>
          <small>10 題 · 20 分</small>
        </button>

        <button onclick="chooseLevel(4)">
          LEVEL 4<br>
          <small>10 題 · 20 分</small>
        </button>

        <button onclick="chooseLevel(5)">
          LEVEL 5<br>
          <small>10 題 · 20 分</small>
        </button>

      </div>

      <div class="top">

        <span class="badge"
              id="lv">
          尚未選擇
        </span>

        <span class="badge"
              id="num">
          請選擇 Level
        </span>

      </div>

      <div class="progress">
        <div id="bar"></div>
      </div>

      <div class="question"
           id="q">
        請先填寫上方身分資料，再選擇 LEVEL 任務
      </div>

      <div class="choices"
           id="c">
      </div>

      <div class="status"
           id="s">
      </div>

      <div class="score"
           id="sc">
      </div>

    </div>

    <!-- 錯題本 -->
    <div id="errorSummaryArea"
         class="error-summary">
    </div>

  </section>

</section>
</div>

<script>

/* =====================================================
   老師專用設定區
   ===================================================== */

const GAS_URL =
"https://script.google.com/macros/s/AKfycbysXvGXBFEZ4-j_P2CVRNqiMHpUupIWs3fgpX0I7GS4kGt76XltzYt-KOuTCW239GnZ/exec";

let wrongRecords = [];


/* =====================================================
   LocalStorage
   ===================================================== */

window.addEventListener('DOMContentLoaded', () => {

  if (localStorage.getItem('mathAgentSubmitted') === 'true') {

    lockFormAndSubmitBtn();

    const savedRecords =
      localStorage.getItem('mathAgentWrongRecords');

    if (savedRecords) {

      wrongRecords = JSON.parse(savedRecords);

      showErrorSummary();

    }

  }

});


/* =====================================================
   鎖定表單
   ===================================================== */

function lockFormAndSubmitBtn() {

  document.getElementById("studentClass").disabled = true;
  document.getElementById("studentSeat").disabled = true;
  document.getElementById("studentName").disabled = true;

  const btn =
    document.getElementById("submitBtn");

  btn.innerHTML = "✅ 成績已繳交";
  btn.disabled = true;

  btn.classList.remove("ready-to-submit");

}


function lockInputsOnly() {

  document.getElementById("studentClass").disabled = true;
  document.getElementById("studentSeat").disabled = true;
  document.getElementById("studentName").disabled = true;

}


/* =====================================================
   繳交成績
   ===================================================== */

function submitScore() {

  const allDone =
    Object.values(levelCompleted)
      .every(v => v === true);

  if (!allDone) {

    alert(
      "⚠️ 必須完成 LEVEL 1 到 LEVEL 5 的所有關卡，才能繳交成績唷！"
    );

    return;
  }


  if (
    !GAS_URL ||
    GAS_URL === "請將這裡替換成您的_Web_App_網址"
  ) {

    alert("⚠️ 老師尚未設定雲端資料庫網址！");

    return;

  }


  const classInput =
    document.getElementById("studentClass").value;

  const seatInput =
    document.getElementById("studentSeat").value.trim();

  const nameInput =
    document.getElementById("studentName").value.trim();


  if (!classInput || !seatInput || !nameInput) {

    alert(
      "❌ 繳交失敗：請確認「班級」、「座號」與「姓名」都已經填寫完成！"
    );

    return;

  }


  const total =
    Object.values(levelScores)
      .reduce((a, b) => a + b, 0);


  const details =
    `L1:${levelScores[1]}, L2:${levelScores[2]}, L3:${levelScores[3]}, L4:${levelScores[4]}, L5:${levelScores[5]}`;


  const wrongDetailsStr =
    wrongRecords
      .map(r => `L${r.level}-第${r.qNum}題`)
      .join(", ");


  const submitBtn =
    document.getElementById('submitBtn');

  submitBtn.innerHTML = "⏳ 上傳中...";
  submitBtn.classList.remove("ready-to-submit");
  submitBtn.disabled = true;


  const formData =
    new URLSearchParams();

  formData.append("class", classInput);
  formData.append("seat", seatInput);
  formData.append("name", nameInput);
  formData.append("score", total);
  formData.append("details", details);
  formData.append("wrongDetails", wrongDetailsStr);


  fetch(GAS_URL, {

    method: 'POST',
    body: formData,
    mode: 'no-cors'

  })

  .then(() => {

    alert(
      "🎉 繳交成功！\n\n點擊確認後，將為您統整本次測驗的錯誤題目。"
    );

    localStorage.setItem(
      'mathAgentSubmitted',
      'true'
    );

    localStorage.setItem(
      'mathAgentWrongRecords',
      JSON.stringify(wrongRecords)
    );

    lockFormAndSubmitBtn();

    showErrorSummary();

  })

  .catch((err) => {

    alert(
      "❌ 上傳失敗，請檢查網路連線。"
    );

    submitBtn.innerHTML =
      "📤 再次繳交";

    submitBtn.classList.add(
      "ready-to-submit"
    );

    submitBtn.disabled = false;

  });

}

  summaryArea.style.display = 'flex';

        ">

        </div>

        <h2 style="
          font-size:clamp(24px,3vw,36px);
          margin:0;
        ">
          太神啦！全對完美通關！
        </h2>

        <p style="
          font-size:18px;
          font-weight:bold;
          color:#555;
        ">
          本次測驗沒有任何錯誤紀錄。
        </p>

      </div>

    `;

    return;

  }


  let html = `

    <h2 style="
      text-align:center;
      margin:0 0 16px 0;
      font-size:clamp(20px,2.5vw,26px);
      font-weight:950;
    ">
      📋 測驗結果分析：錯誤題目統整
      （共 ${wrongRecords.length} 題）
    </h2>

  `;


  wrongRecords.forEach((item) => {

    html += `

      <div class="error-item">

        <div class="error-q">

          <span class="error-badge">
            LEVEL ${item.level}
          </span>

          ${item.q}

        </div>

        <div class="error-choices">

    `;


    const labels =
      ["A", "B", "C", "D"];


    item.choices.forEach(
      (choiceText, cIdx) => {

        let cls =
          "error-choice-default";

        let icon = "";


        if (
          cIdx === item.correctChoice
        ) {

          cls =
            "error-choice-correct";

          icon = "✅ ";

        }

        else if (
          cIdx === item.studentChoice
        ) {

          cls =
            "error-choice-wrong";

          icon = "❌ ";

        }


        html += `

          <div class="
            error-choice ${cls}
          ">

            <div class="
              error-choice-label
            ">
              ${labels[cIdx]}
            </div>

            <div>
              ${icon}${choiceText}
            </div>

          </div>

        `;

      }
    );


    html += `

        </div>

        <div class="error-note">

          💡 <strong>解析：</strong>
          ${item.n}

        </div>

      </div>

    `;

  });


  summaryArea.innerHTML = html;

}

    currentTextScale = 0.6;

  if (currentTextScale > 2.2) {
    currentTextScale = 2.2;

  document.documentElement
    .style
    .setProperty(
      '--text-scale',

    );

}

function shuffleQuestion(question) {

    question.c.map(

    let x = options.length - 1;

    x--
  ) {

    const y =
      Math.floor(
        Math.random() * (x + 1)
      );

    [
      options[x],
      options[y]
    ] =
    [
      options[y],
      options[x]
    ];

  }


  return {
    ...question,
    shuffledChoices:options,
    shuffledAnswer:
      options.findIndex(
        item => item.correct
      )
  };

}


/* =====================================================
   準備 Level
   ===================================================== */

function prepareLevel() {

  const original =
    data.slice(startQ, endQ);

  currentQuestions =
    original.map(
      q => shuffleQuestion(q)
    );

}


/* =====================================================
   更新成績
   ===================================================== */

function updateScoreboard() {

  let total = 0;

  for (
    let lv = 1;
    lv <= 5;
    lv++
  ) {

    document.getElementById(
      "score" + lv
    ).innerHTML =
      `${levelScores[lv]}<span> / 20</span>`;

    total += levelScores[lv];

  }


  document.getElementById(
    "totalScore"
  ).innerHTML =
    `${total}<span> / 100</span>`;

}


/* =====================================================
   選擇 Level
   ===================================================== */

function chooseLevel(level) {

  const classInput =
    document.getElementById(
      "studentClass"
    ).value;

  const seatInput =
    document.getElementById(
      "studentSeat"
    ).value.trim();

  const nameInput =
    document.getElementById(
      "studentName"
    ).value.trim();


  if (
    !classInput ||
    !seatInput ||
    !nameInput
  ) {

    alert(
      "⚠️ 請先填寫完整的「班級」、「座號」與「姓名」才能開始測驗！"
    );


    if (!classInput) {

      document.getElementById(
        "studentClass"
      ).focus();

    }

    else if (!seatInput) {

      document.getElementById(
        "studentSeat"
      ).focus();

    }

    else {

      document.getElementById(
        "studentName"
      ).focus();

    }

    return;

  }


  if (levelCompleted[level]) {

    alert(
      "⚠️ 此 LEVEL 已經挑戰過了唷！\n每個關卡只能挑戰一次，請選擇其他尚未挑戰的 LEVEL。"
    );

    return;

  }


  lockInputsOnly();


  currentLevel = level;

  [startQ, endQ] =
    ranges[level];

  i = 0;

  prepareLevel();


  document
    .querySelectorAll(
      "#levelSelect button"
    )
    .forEach(
      (b, n) => {

        b.classList.toggle(
          "active",
          n === level - 1
        );

      }
    );


  document
    .querySelectorAll(
      ".score-card"
    )
    .forEach(
      card => {
        card.classList.remove("active");
      }
    );


  document.getElementById(
    "scoreCard" + level
  ).classList.add("active");


  document.getElementById(
    "lv"
  ).textContent =
    "LEVEL " + level;


  document.getElementById(
    "num"
  ).textContent =
    "第 1 / 10 題";


  document.getElementById(
    "bar"
  ).style.width =
    "0%";


  document.getElementById(
    "s"
  ).textContent = "";


  document.getElementById(
    "sc"
  ).textContent =
    `本 Level 目前成績：${levelScores[level]} / 20`;


  document.getElementById(
    "q"
  ).textContent =
    `準備挑戰 LEVEL ${level}`;


  document.getElementById(
    "c"
  ).innerHTML = `

    <button
      onclick="startLevel()"
      style="
        grid-column:1 / -1;
        height:100%;
        border:0;
        border-radius:14px;
        background:#e8e2d8;
        color:#20242b;
        font-size:20px;
        font-weight:900;
        cursor:pointer;
      "
    >
      開始 LEVEL ${level} 🚀
    </button>

  `;

}


/* =====================================================
   開始 Level
   ===================================================== */

function startLevel() {

  i = 0;
  lock = false;

  prepareLevel();

  show();

}


/* =====================================================
   顯示題目
   ===================================================== */

function show() {

  lock = false;

  const x =
    currentQuestions[i];


  document.getElementById(
    "lv"
  ).textContent =
    "LEVEL " + currentLevel;


  document.getElementById(
    "num"
  ).textContent =
    `第 ${i + 1} / 10 題`;


  document.getElementById(
    "bar"
  ).style.width =
    ((i) / 10 * 100) + "%";


  document.getElementById(
    "q"
  ).textContent =
    x.q;


  const labels =
    ["A","B","C","D"];


  document.getElementById(
    "c"
  ).innerHTML =

    x.shuffledChoices
      .map(
        (item,k) => `

          <button
            onclick="ans(${k})"
          >

            <span class="choice-label">
              ${labels[k]}
            </span>

            <span class="choice-text">
              ${item.text}
            </span>

          </button>

        `
      )
      .join("");


  document.getElementById(
    "s"
  ).textContent = "";


  document.getElementById(
    "sc"
  ).textContent =
    `本 Level 暫得：${levelScores[currentLevel]} / 20`;

}


/* =====================================================
   作答
   ===================================================== */

function ans(k) {

  if (lock) return;

  lock = true;


  const x =
    currentQuestions[i];


  const buttons =
    document.querySelectorAll(
      ".choices button"
    );


  const labels =
    ["A","B","C","D"];


  buttons[k]
    .classList.add(
      k === x.shuffledAnswer
        ? "correct"
        : "wrong"
    );


  if (
    k === x.shuffledAnswer
  ) {

    levelScores[currentLevel] += 2;


    document.getElementById(
      "s"
    ).innerHTML =
      `✅ 答對！ ${x.n}<br>本題 2 分。`;

  }

  else {

    buttons[
      x.shuffledAnswer
    ].classList.add(
      "correct"
    );


    document.getElementById(
      "s"
    ).innerHTML =
      `❌ 答案揭曉：${labels[x.shuffledAnswer]} ${x.n}`;


    wrongRecords.push({

      level:currentLevel,

      qNum:i + 1,

      q:x.q,

      choices:
        x.shuffledChoices
          .map(c => c.text),

      studentChoice:k,

      correctChoice:
        x.shuffledAnswer,

      n:x.n

    });

  }


  updateScoreboard();


  document.getElementById(
    "sc"
  ).textContent =
    `本 Level 暫得：${levelScores[currentLevel]} / 20`;


  setTimeout(
    () => {

      i++;

      if (i < 10) {

        show();

      }

      else {

        finishLevel();

      }

    },
    1700
  );

}


/* =====================================================
   Level 完成
   ===================================================== */

function finishLevel() {

  document.getElementById(
    "bar"
  ).style.width =
    "100%";


  document.getElementById(
    "lv"
  ).textContent =
    `LEVEL ${currentLevel} 完成`;


  document.getElementById(
    "num"
  ).textContent =
    "10 題完成";


  document.getElementById(
    "q"
  ).innerHTML = `

    <span class="finish-message">
      🎉 LEVEL ${currentLevel} 挑戰完成！
    </span>

  `;


  const total =
    Object.values(levelScores)
      .reduce(
        (a,b) => a + b,
        0
      );


  levelCompleted[
    currentLevel
  ] = true;


  document
    .querySelectorAll(
      "#levelSelect button"
    )[currentLevel - 1]
    .classList.add(
      "completed"
    );


  document
    .querySelectorAll(
      "#levelSelect button"
    )[currentLevel - 1]
    .classList.remove(
      "active"
    );


  const allDone =
    Object.values(
      levelCompleted
    ).every(
      v => v === true
    );


  if (allDone) {

    document.getElementById(
      "c"
    ).innerHTML = `

      <div
        style="
          grid-column:1 / -1;
          height:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          text-align:center;
          background:#d4edda;
          color:#155724;
          border-radius:14px;
          font-size:clamp(16px,2vw,20px);
          font-weight:900;
        "
      >

        🌟 所有關卡皆已完成，
        請務必點擊上方「📤 繳交成績」！

      </div>

    `;


    const submitBtn =
      document.getElementById(
        "submitBtn"
      );


    submitBtn.disabled = false;

    submitBtn.innerHTML =
      "📤 繳交成績";

    submitBtn.classList.add(
      "ready-to-submit"
    );

  }

  else {

    document.getElementById(
      "c"
    ).innerHTML = `

      <button
        onclick="nextLevel()"
        style="
          grid-column:1 / -1;
          height:100%;
          font-size:clamp(16px,2vw,20px);
          font-weight:900;
          background:#e8e2d8;
          border:0;
          border-radius:14px;
          cursor:pointer;
        "
      >

        ➡️ 選擇下一未挑戰 LEVEL

      </button>

    `;

  }


  document.getElementById(
    "s"
  ).innerHTML =

    `本 Level 得分：
     <strong>
       ${levelScores[currentLevel]} / 20
     </strong>
     <br>
     目前總分：
     <strong>
       ${total} / 100
     </strong>`;


  document.getElementById(
    "sc"
  ).textContent =
    "若全部過關，記得在上方點擊「📤 繳交成績」唷！";

}


/* =====================================================
   下一關
   ===================================================== */

function nextLevel() {

  let next =
    currentLevel;


  for (
    let j = 0;
    j < 5;
    j++
  ) {

    next =
      next < 5
        ? next + 1
        : 1;


    if (
      !levelCompleted[next]
    ) {

      chooseLevel(next);

      return;

    }

  }

}


/* =====================================================
   重新開始
   ===================================================== */

function restartGame() {

  for (
    let lv = 1;
    lv <= 5;
    lv++
  ) {

    levelScores[lv] = 0;

    levelCompleted[lv] =
      false;

  }


  currentLevel = 0;
  i = -1;
  wrongRecords = [];


  document.getElementById(
    'normalGameArea'
  ).style.display = 'flex';


  document.getElementById(
    'errorSummaryArea'
  ).style.display = 'none';


  document
    .querySelectorAll(
      "#levelSelect button"
    )
    .forEach(
      b => {

        b.classList.remove(
          "active",
          "completed"
        );

      }
    );


  document
    .querySelectorAll(
      ".score-card"
    )
    .forEach(
      card =>
        card.classList.remove(
          "active"
        )
    );


  updateScoreboard();


  document.getElementById(
    "lv"
  ).textContent =
    "尚未選擇";


  document.getElementById(
    "num"
  ).textContent =
    "請選擇 Level";


  document.getElementById(
    "bar"
  ).style.width =
    "0%";


  document.getElementById(
    "q"
  ).textContent =
    "請先填寫上方身分資料，再選擇 LEVEL 任務";


  document.getElementById(
    "c"
  ).innerHTML = "";


  document.getElementById(
    "s"
  ).textContent = "";


  document.getElementById(
    "sc"
  ).textContent = "";


  localStorage.removeItem(
    'mathAgentSubmitted'
  );

  localStorage.removeItem(
    'mathAgentWrongRecords'
  );


  document.getElementById(
    "studentClass"
  ).disabled = false;


  document.getElementById(
    "studentSeat"
  ).disabled = false;


  document.getElementById(
    "studentName"
  ).disabled = false;


  const btn =
    document.getElementById(
      "submitBtn"
    );


  btn.innerHTML =
    "🔒 需完成 5 關";


  btn.disabled = true;

  btn.classList.remove(
    "ready-to-submit"
  );

}


/* =====================================================
   初始化
   ===================================================== */

updateScoreboard();

</script>

</body>
</html>
