<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>【 神戸聖誕之旅 】</title>
<meta name="theme-color" content="#EFF6FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="神戸聖誕">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Noto+Serif+TC:wght@600;700;900&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* 2026-10-21 改版第 1 段：舊版淡藍底＋白卡（設計稿 1C） */
:root {
  --bg: #EFF6FF;
  --card: #FFFFFF;
  --card-bd: #DBEAFE;
  --ink: #1E3A8A;
  --ink-2: #334155;
  --muted: #64748B;
  --line: #DBEAFE;
  --blue: #3B82F6;
  --blue-2: #60A5FA;
  --blue-soft: #E3EEFF;
  --blue-fill: #3B82F6;
  --field: #FFFFFF;
  --chip: #E9EEF6;
  --navy: #1E3A8A;
  --red: #E5484D;
  --red-soft: #FDECEC;
  --gold: #C99A3B;
  --gold-soft: #FBF3E2;
  --green: #2BA39B;
  --radius: 18px;
  --shadow: 0 4px 20px -2px rgba(37, 99, 235, .10);
  --serif: "Shippori Mincho", "Noto Serif TC", "Songti TC", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Hiragino Sans", "Noto Sans TC", "Noto Sans JP", "Segoe UI", sans-serif;
  --num: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  /* 舊版四色：交通紅、餐飲藍、景點橘、住宿黃 */
  --t-FLIGHT: #EF4444;
  --t-TRANSPORT: #EF4444;
  --t-LODGING: #EAB308;
  --t-FOOD: #2563EB;
  --t-CAFE: #2563EB;
  --t-SIGHT: #F97316;
  --t-SHOP: #F97316;
  --t-RAMEN: #2563EB;
  --t-WORK: #94A3B8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.5; font-size: 15px; min-height: 100vh; }
body.locked { overflow: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); }
.serif { font-family: var(--serif); }
.ja { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", var(--sans); }
svg.i { width: 1em; height: 1em; fill: currentColor; flex: none; vertical-align: -.125em; }

/* ---------- header ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30; text-align: center;
  padding: calc(var(--safe-t) + 12px) 16px 10px;
  background: rgba(239, 246, 255, .94);
  -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px);
}
.kicker { font-family: var(--num); font-size: 10.5px; font-weight: 700; letter-spacing: .2em; color: var(--blue); }
.kicker b { font-weight: 900; }
.title { font-family: var(--serif); font-weight: 700; font-size: 21px; color: var(--navy); letter-spacing: .06em; margin-top: 3px; }

main { max-width: 640px; margin: 0 auto; padding: 4px 16px calc(var(--safe-b) + 108px); }
.view { display: none; }
.view.active { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- floating pill nav ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: calc(var(--safe-b) + 14px); z-index: 40; display: flex; justify-content: center; pointer-events: none; }
.tabbar-inner { pointer-events: auto; display: grid; grid-template-columns: repeat(5, 1fr); width: min(460px, calc(100% - 28px)); background: rgba(255, 255, 255, .95); -webkit-backdrop-filter: blur(15px); backdrop-filter: blur(15px); border-radius: 999px; box-shadow: 0 10px 30px -6px rgba(37, 99, 235, .25); padding: 6px; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 0 5px; border-radius: 999px; color: #94A3B8; font-size: 10.5px; font-weight: 700; }
.tab svg { width: 24px; height: 24px; fill: currentColor; }
.tab.active { color: var(--blue); }
/* 資訊分頁小紅點：14 天內到期（或已過期）的待辦還沒打勾 */
.tab.dot::after { content: ""; position: absolute; top: 5px; left: calc(50% + 7px); width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }

/* ---------- generic ---------- */
.card { background: var(--card); border: 1px solid var(--card-bd); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card-title { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--navy); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.card-title .sp { flex: 1; }
.sec-title { font-size: 11.5px; font-weight: 800; letter-spacing: .22em; color: var(--blue); margin: 24px 4px 10px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; vertical-align: 1px; white-space: nowrap; letter-spacing: .03em; }
.tag-est { background: var(--gold-soft); color: #93681A; }
.tag-off { background: var(--blue-soft); color: var(--blue); }
.tag-draft { background: #EEF1F6; color: var(--ink-2); }
.warn { background: var(--red-soft); color: #A8282C; border-radius: 12px; padding: 8px 11px; font-size: 13.5px; margin-top: 8px; }
.note { background: var(--blue-soft); color: #2A4F8F; border-radius: 12px; padding: 9px 11px; font-size: 13.5px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: 14.5px;
  background: var(--blue-soft); color: var(--blue); text-decoration: none; white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-red { background: var(--red); color: #fff; }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn-ghost { background: #fff; color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn-row .btn { flex: 1 1 auto; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .ttl { font-weight: 700; }
.chk { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; border: 2px solid #D4DDEA; background: #fff; font-size: 15px; color: #fff; font-weight: 800; }
.chk.on { background: var(--blue); border-color: var(--blue); }
.done .ttl { text-decoration: line-through; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
.x-btn { width: 32px; height: 32px; border-radius: 50%; color: var(--muted); font-size: 15px; flex: none; }

/* ---------- form ---------- */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; min-height: 44px;
  -webkit-appearance: none; appearance: none;
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--blue-2); box-shadow: 0 0 0 3px var(--blue-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; background: #DBEAFE; border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--muted); min-height: 36px; }
.seg button.on { background: #fff; color: var(--blue); box-shadow: 0 1px 3px rgba(31, 71, 140, .15); }
.check-line { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 12px; }
.check-line input { width: 20px; height: 20px; accent-color: var(--blue); }

/* ---------- trip ---------- */
.date-tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 6px 16px 4px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.date-tabs::-webkit-scrollbar { display: none; }
.date-tab { flex: none; min-width: 58px; padding: 4px 6px 14px; text-align: center; position: relative; color: #94A3B8; }
.date-tab:first-child { margin-left: auto; }
.date-tab .w { font-family: var(--num); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; }
.date-tab .d { font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.2; }
.date-tab.active { color: var(--blue); }
.date-tab.active::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--blue); }
.date-tab.today:not(.active) .d { color: var(--ink-2); }
.date-tab.add { color: var(--blue); font-size: 24px; font-weight: 400; display: grid; place-items: center; min-width: 46px; margin-right: auto; }
/* 舊版主圖：左邊直排「第N天」 */
.day-wrap { display: grid; grid-template-columns: 26px 1fr; gap: 0 12px; margin-top: 14px; align-items: center; }
.day-vert { font-family: var(--serif); font-weight: 700; font-size: 21px; color: var(--navy); writing-mode: vertical-rl; text-orientation: upright; letter-spacing: .12em; justify-self: center; }
.hero { position: relative; border-radius: 16px; overflow: hidden; min-height: 172px; color: #fff; box-shadow: var(--shadow); background: #3B82F6; }
.hero-art, .hero-art svg, .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-img { object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(30, 58, 138, .85) 0%, rgba(30, 58, 138, 0) 62%); pointer-events: none; }
.hero-text { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 1; }
.hero-meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; }
.hero-badge { border: 1px solid rgba(255, 255, 255, .65); border-radius: 4px; padding: 0 7px; font-family: var(--num); font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.hero-title { font-family: var(--serif); font-weight: 700; font-size: 22px; line-height: 1.3; margin-top: 5px; letter-spacing: .03em; }
.wx-head { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.wx-loc { display: inline-flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--navy); }
.wx-loc svg { color: var(--blue); width: 22px; height: 22px; }
.vbar { width: 1px; height: 22px; background: var(--line); }
.ic-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--blue); }
.ic-btn svg { width: 21px; height: 21px; fill: currentColor; }
.ic-btn.red { color: var(--red); }
.ic-btn.on { background: var(--blue); color: #fff; }
.wx-head .sp { flex: 1; }
.wx-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.wx-hours { display: flex; gap: 2px; overflow-x: auto; margin: 6px -16px 0; padding: 4px 16px 2px; scrollbar-width: none; }
.wx-hours::-webkit-scrollbar { display: none; }
.wx-h { flex: none; width: 52px; text-align: center; font-family: var(--num); font-size: 11.5px; color: #94A3B8; line-height: 1.3; }
.wx-h svg { width: 24px; height: 24px; color: var(--blue); margin: 5px auto 3px; display: block; }
.wx-h .t { font-weight: 700; font-size: 14.5px; color: var(--ink-2); }
.wx-h .p { color: #2563EB; font-weight: 700; font-size: 10.5px; min-height: 14px; }
/* 設計稿 3B：一行摘要 */
.wx-day { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.wx-day b { font-size: 18px; color: var(--ink); font-family: var(--serif); white-space: nowrap; }
.wx-day small { margin-left: auto; font-size: 11px; color: #94A3B8; white-space: nowrap; }
.pill-line { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; margin-top: 8px; background: var(--card); border: 1px solid var(--card-bd); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; color: var(--ink-2); }
.pill-line b { font-family: var(--num); color: var(--ink); }
.pill-line .chev { margin-left: auto; font-size: 18px; }
.hotel-line { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; margin-top: 8px; background: var(--card); border: 1px solid var(--card-bd); border-radius: 12px; padding: 8px 12px; }
.hotel-line .hl-bar { width: 4px; align-self: stretch; min-height: 34px; border-radius: 4px; background: var(--t-LODGING); flex: none; }
.hotel-line .grow { flex: 1; min-width: 0; }
.hotel-line .lbl { display: block; font-size: 10.5px; color: #94A3B8; }
.hotel-line .nm { display: block; font-family: var(--serif); font-size: 15.5px; font-weight: 700; color: var(--navy); line-height: 1.35; }
.hotel-line .sub { display: block; font-size: 12px; color: var(--muted); }
.branch-toggle { display: flex; gap: 4px; margin-top: 10px; background: #DBEAFE; padding: 4px; border-radius: 12px; }
.branch-toggle button { flex: 1; padding: 8px 6px; border-radius: 9px; font-size: 13.5px; font-weight: 500; color: var(--muted); min-height: 38px; }
.branch-toggle button.on { background: #fff; color: var(--blue); font-weight: 700; box-shadow: 0 2px 4px rgba(59, 130, 246, .12); }
.info-strip { background: var(--card); border: 1px solid var(--card-bd); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 14px; padding: 12px 14px; }
.strip-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
.strip-head b { font-family: var(--serif); font-size: 15px; color: var(--navy); }
.sun-row { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; margin-top: 6px; color: var(--ink-2); }
.sun-row b { font-variant-numeric: tabular-nums; color: var(--ink); }
.light-chip { display: block; width: 100%; text-align: left; margin-top: 8px; background: var(--blue-soft); border-radius: 12px; padding: 8px 10px; font-size: 13px; }
.light-chip .n { font-weight: 700; color: var(--navy); }
.hotel-bar { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.hotel-bar .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }
.hotel-bar .ico svg { width: 22px; height: 22px; }
.hotel-bar .grow { flex: 1; min-width: 0; }
.hotel-bar .nm { font-weight: 800; font-size: 14.5px; color: var(--navy); }
.chev { color: var(--muted); font-size: 20px; }

/* ---------- timeline（舊版樣式＋白卡，設計稿 1C／4B） ---------- */
.timeline { margin-top: 10px; }
.ev { display: grid; grid-template-columns: 50px 20px 1fr; position: relative; width: 100%; text-align: left; cursor: pointer; }
.ev-time { text-align: right; padding: 12px 2px 0 0; font-family: var(--num); font-weight: 700; font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1.2; }
.ev-time small { display: block; font-family: var(--sans); font-weight: 500; font-size: 11px; color: #94A3B8; margin-top: 2px; }
.ev-rail { position: relative; }
.ev-rail::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 2px; background: #BFDBFE; }
.ev:first-child .ev-rail::before { top: 20px; }
.ev:last-child .ev-rail::before { bottom: calc(100% - 20px); }
.ev-dot { position: absolute; left: 4px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid #CBD5E1; }
.ev.now .ev-dot { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 0 4px #DBEAFE; }
.ev-body { position: relative; margin: 4px 0 10px 4px; padding: 9px 12px 10px 17px; background: var(--card); border: 1px solid var(--card-bd); border-radius: 12px; }
.ev-body::before { content: ""; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 3.5px; border-radius: 4px; background: var(--tc, var(--blue)); }
.ev-title { font-weight: 700; font-size: 16px; line-height: 1.38; color: var(--ink); }
.ev-type { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font-family: var(--num); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: #94A3B8; margin-top: 3px; }
.ev-type svg { width: 13px; height: 13px; color: #94A3B8; }
.ev-type .ok { font-family: var(--sans); letter-spacing: 0; color: #16A34A; }
.ev-type .wn { font-family: var(--sans); letter-spacing: 0; color: var(--red); }
.ev-sub { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ev-tools { display: none; gap: 6px; margin-top: 8px; }
.editing .ev-tools { display: flex; }
.ev.past .ev-body, .ev.past .ev-time { opacity: .55; }
.ev.now .ev-body { box-shadow: 0 0 0 2px var(--blue); }
.ev.now .ev-time { color: var(--blue); }
.now-badge { display: inline-block; background: var(--blue); color: #fff; font-family: var(--num); font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; letter-spacing: .08em; }
.add-ev { margin: 0 0 0 74px; }
.day-note { margin-top: 14px; }
.day-map .map-frame { height: 240px; margin-top: 0; }
/* 舊版「現在」浮動按鈕 */
.now-fab { position: fixed; right: 16px; bottom: calc(var(--safe-b) + 92px); z-index: 35; display: none; align-items: center; gap: 6px; background: var(--blue); color: #fff; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 700; box-shadow: 0 6px 18px rgba(59, 130, 246, .45); }
.now-fab svg { width: 17px; height: 17px; fill: currentColor; }
.now-fab.show { display: inline-flex; }
.type-FLIGHT { --tc: var(--t-FLIGHT); } .type-TRANSPORT { --tc: var(--t-TRANSPORT); } .type-LODGING { --tc: var(--t-LODGING); }
.type-FOOD { --tc: var(--t-FOOD); } .type-CAFE { --tc: var(--t-CAFE); } .type-SIGHT { --tc: var(--t-SIGHT); }
.type-SHOP { --tc: var(--t-SHOP); } .type-RAMEN { --tc: var(--t-RAMEN); } .type-WORK { --tc: var(--t-WORK); }

/* ---------- wallet（設計稿 5C：舊版匯率卡＋一行快記＋分類；8-1 預算；8-2 收據 AI） ---------- */
.rate-head { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 10px; }
.rate-t { font-weight: 700; font-size: 15px; color: var(--blue); padding: 4px 8px; border-radius: 8px; }
.rate-t b { font-family: var(--num); }
.lock-btn { width: 34px; height: 34px; border-radius: 50%; font-size: 15px; background: var(--blue-soft); }
.lock-btn.on { background: var(--red-soft); }
.calc { display: grid; }
.calc-row { display: flex; align-items: center; gap: 10px; background: var(--field); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.calc-row .cur { width: 40px; font-family: var(--num); font-weight: 800; font-size: 14px; color: var(--ink-2); }
.calc-row input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; text-align: right; font-family: var(--num); font-size: 24px; font-weight: 700; color: var(--ink); outline: none; min-height: 44px; }
.calc-swap { justify-self: center; position: relative; z-index: 1; width: 34px; height: 34px; margin: -7px 0; border-radius: 50%; background: var(--card); border: 1.5px solid var(--line); color: var(--blue); font-size: 16px; }
.quick-amt { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
.quick-amt button { background: var(--bg); border: 1px solid var(--card-bd); color: var(--ink); border-radius: 10px; min-height: 36px; font-family: var(--num); font-weight: 700; font-size: 13px; }
.tot-lbl { text-align: center; font-size: 12.5px; font-weight: 700; color: var(--muted); }

/* 儀式完成度等小總計 */

/* ---------- tools ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.tile { background: var(--card); border: 1px solid var(--card-bd); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; text-align: left; min-height: 108px; display: flex; flex-direction: column; gap: 4px; }

.progress { height: 8px; border-radius: 99px; background: #E9EEF6; overflow: hidden; margin-top: 8px; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue-2), var(--blue)); border-radius: 99px; }

/* ---------- info ---------- */

/* ---------- sheets ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(14, 30, 60, .38); z-index: 60; opacity: 0; transition: opacity .2s; }
.backdrop.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; margin: 0 auto; max-width: 640px;
  background: var(--bg); border-radius: 22px 22px 0 0; max-height: 90vh; max-height: 90dvh;
  display: flex; flex-direction: column; transform: translateY(100%); transition: transform .24s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 0 -10px 40px rgba(14, 30, 60, .18);
}
.sheet.show { transform: none; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px 8px; position: relative; }

const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ox26', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('files', mode);
      const req = fn(t.objectStore('files'));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => run('readonly', s => s.get(k)),
    set: (k, v) => run('readwrite', s => s.put(v, k)),
    del: k => run('readwrite', s => s.delete(k)),
    clear: () => run('readwrite', s => s.clear()),
    async all() {
      const db = await open();
      return new Promise((res, rej) => {
        const out = [];
        const t = db.transaction('files');
        t.objectStore('files').openCursor().onsuccess = e => {
          const c = e.target.result;
          if (c) { out.push([c.key, c.value]); c.continue(); }
        };
        t.oncomplete = () => res(out);
        t.onerror = () => rej(t.error);
      });
    }
  };
})();

function readImage(file, max = 1600, type = 'image/jpeg', q = 0.82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc);
        c.height = Math.round(img.height * sc);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(type, q));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

function download(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* 日出日落（天文公式，誤差約 ±1 分） */
function sunTimes(date, lat, lon, alt = -0.833) {
  const rad = Math.PI / 180;
  const J = Date.parse(date + 'T12:00:00Z') / 864e5 + 2440587.5;
  const n = Math.ceil(J - 2451545.0 + 0.0008);
  const Js = n - lon / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
  const cosw = (Math.sin(alt * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec));
  const w = Math.acos(Math.max(-1, Math.min(1, cosw))) / rad;
  const f = j => new Date((j - 2440587.5) * 864e5 + 9 * 3600e3).toISOString().slice(11, 16);
  return { rise: f(Jt - w / 360), set: f(Jt + w / 360) };
}

const sheets = [];
function openSheet(title, html, onMount) {
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  const sh = document.createElement('div');
  sh.className = 'sheet';
  sh.innerHTML = `<div class="sheet-head"><div class="sheet-title">${esc(title)}</div><button class="sheet-close" aria-label="關閉">✕</button></div><div class="sheet-body">${html}</div>`;

  if ($('.fullcard')) { bd.style.zIndex = 85; sh.style.zIndex = 86; }
  document.body.append(bd, sh);
  document.body.classList.add('locked');
  requestAnimationFrame(() => { bd.classList.add('show'); sh.classList.add('show'); });
  const entry = { bd, sh };
  sheets.push(entry);
  bd.onclick = () => closeSheet(entry);
  $('.sheet-close', sh).onclick = () => closeSheet(entry);
  if (onMount) onMount($('.sheet-body', sh), entry);
  return entry;
}
function closeSheet(entry = sheets[sheets.length - 1]) {
  if (!entry) return;
  const i = sheets.indexOf(entry);
  if (i >= 0) sheets.splice(i, 1);
  entry.bd.classList.remove('show');
  entry.sh.classList.remove('show');
  setTimeout(() => { entry.bd.remove(); entry.sh.remove(); }, 250);
  if (!sheets.length && !$('.fullcard')) document.body.classList.remove('locked');
}
function closeAllSheets() { while (sheets.length) closeSheet(); }

    const entry = openSheet('確認', `<p style="font-size:15.5px;white-space:pre-wrap">${esc(msg)}</p>
      <div class="btn-row"><button class="btn btn-ghost" data-a="no">取消</button><button class="btn ${danger ? 'btn-red' : 'btn-primary'}" data-a="yes">${esc(okText)}</button></div>`, body => {
      body.onclick = e => {
        const a = e.target.closest('[data-a]');
        if (!a) return;
        done = true;
        closeSheet(entry);
        res(a.dataset.a === 'yes');
      };
    });
    const origClose = entry.bd.onclick;
    entry.bd.onclick = () => { if (!done) res(false); origClose(); };
    $('.sheet-close', entry.sh).onclick = entry.bd.onclick;
  });
}

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* 不支援就算了 */ }
}
function openFullCard(render, tabs) {
  const fc = document.createElement('div');
  fc.className = 'fullcard';
  let cur = tabs ? tabs[0][0] : null;
  const draw = () => {
    fc.innerHTML = `<div class="fc-top">${tabs ? `<div class="seg">${tabs.map(([k, l]) => `<button data-k="${esc(k)}" class="${k === cur ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>` : ''}
      <button class="fc-close" aria-label="關閉">✕</button></div><div class="fc-body">${render(cur)}</div>`;
    $('.fc-close', fc).onclick = close;
    $$('.seg button', fc).forEach(b => { b.onclick = () => { cur = b.dataset.k; draw(); }; });
  };
  const close = () => {
    fc.remove();
    keepAwake(false);
    if (!sheets.length) document.body.classList.remove('locked');
  };
  draw();
  document.body.appendChild(fc);
  document.body.classList.add('locked');
  keepAwake(true);
  return { el: fc, redraw: draw, close };
}

/* =========================================================
   可編輯清單：預設內容寫在程式裡；改過就整份存進手機（ox26.list.名稱）
   編輯模式下每一項有 ↑ ↓ ✎ ✕，新增和修改都用小視窗
   ========================================================= */
const LIST_KEY = 'ox26.list.';
const LIST_DEFAULTS = {
  todo: () => TODOS,
  rit: () => Object.entries(RITUALS).map(([id, r]) => ({ id, ...r })),

  taxi: () => TAXI.map((t, i) => ({ id: 'tx' + i, ...t })),
  pay: () => PAY_PHRASES.map(([ja, zh], i) => ({ id: 'pp' + i, ja, zh })),
  phrase: () => Object.entries(PHRASES).flatMap(([cat, arr]) => arr.map(([zh, ja], i) => ({ id: `ph-${cat}-${i}`, cat, zh, ja }))),
  light: () => LIGHTS.map((l, i) => ({ id: 'lt' + i, ...l })),
  transit: () => TRANSIT.map(([k, v], i) => ({ id: 'tr' + i, k, v })),
  pack: () => PACK_ITEMS.map((text, i) => ({ id: 'pk' + i, text })),
  souv: () => SOUV_ITEMS.map((text, i) => ({ id: 'sv' + i, text }))
};
const RES_ICONS = [['flight', '✈️ 航班'], ['boat', '⛴️ 船'], ['taxi', '🚕 車'], ['train', '🚃 電車'], ['hotel', '🏨 住宿'], ['food', '🍴 餐廳'], ['cafe', '☕ 咖啡'], ['ticket', '🎟️ 票券'], ['place', '📍 地點']];
const F = (k, label, type = 'text', req = false, opts = []) => ({ k, label, type, req, opts });
const LIST_FIELDS = {
  todo: [F('text', '待辦內容', 'textarea', true), F('due', '建議期限', 'date', true)],
  rit: [F('label', '名稱（例：一蘭 12/24）', 'text', true), F('sub', '說明'), F('who', '誰的儀式', 'select', true, [['Aaron', 'Aaron 的拉麵'], ['Yvonne', 'Yvonne 的下午茶']]), F('icon', '圖示（一個 emoji，可空）')],
  usjHl: [F('name', '亮點名稱', 'text', true), F('desc', '說明', 'textarea')],
  res: [F('name', '名稱', 'text', true), F('when', '時間'), F('how', '怎麼訂（公開資訊）', 'textarea'), F('icon', '圖示', 'select', true, RES_ICONS), F('status', '預設狀態', 'select', true, RES_STATUSES.map(s => [s, s])), F('phone', '電話', 'tel'), F('url', '預約網址', 'url')],
  emg: [F('name', '名稱', 'text', true), F('sub', '說明'), F('num', '電話', 'tel', true), F('icon', '圖示（一個 emoji，可空）')],
  taxi: [F('zh', '中文（自己看）', 'text', true), F('ja', '日文（給司機看）', 'textarea', true), F('sub', '地址或補充（可空）')],
  pay: [F('zh', '中文', 'text', true), F('ja', '日文（給對方看）', 'textarea', true)],
  phrase: [F('cat', '分類（選既有的或打新的）', 'cat', true), F('zh', '中文', 'textarea', true), F('ja', '日文（給對方看）', 'textarea', true)],
  light: [F('name', '名稱', 'text', true), F('place', '地點'), F('time', '時間'), F('status', '狀態／備註', 'textarea'), F('dates', '顯示在哪幾天的行程頁', 'days'), F('url', '來源網址', 'url')],
  transit: [F('k', '項目', 'text', true), F('v', '內容', 'textarea', true)],
  pack: [F('text', '要帶的東西', 'text', true), F('sub', '補充（可空）')],
  souv: [F('text', '要買的東西', 'text', true), F('sub', '在哪買、幫誰買（可空）')]
};
const LIST_GROUP = { rit: 'who', phrase: 'cat' };
let listEdit = null;

function getList(name) {
  const v = store.get(LIST_KEY + name, null);
  return Array.isArray(v) ? v : structuredClone(LIST_DEFAULTS[name]());
}
function saveList(name, arr) { store.set(LIST_KEY + name, arr); }
const itemTitle = it => it.label || it.name || it.text || it.zh || it.k || '這一項';

function leToggle(name) {
  return `<button class="btn btn-sm ${listEdit === name ? 'btn-primary' : 'btn-ghost'}" data-le-toggle="${name}">${listEdit === name ? '✓ 完成' : ic('edit') + ' 編輯'}</button>`;
}
function leTools(name, id) {
  const b = (act, label, txt, cls = '') => `<button class="${cls}" data-le="${act}" data-name="${name}" data-id="${esc(id)}" aria-label="${label}">${txt}</button>`;
  return `<span class="le-tools">${b('up', '上移', '↑')}${b('down', '下移', '↓')}${b('edit', '編輯', '✎')}${b('del', '刪除', '✕', 'red')}</span>`;
}
function leAdd(name, preset = {}) {
  return `<button class="btn btn-ghost btn-block le-add" data-le="add" data-name="${name}" data-preset="${esc(JSON.stringify(preset))}">＋ 新增</button>`;
}
/* 上下移；分組的清單（儀式、會話）只在同一組裡移動 */
function moveItem(list, i, dir, gk) {
  let j = i + dir;
  while (gk && j >= 0 && j < list.length && list[j][gk] !== list[i][gk]) j += dir;
  if (j < 0 || j >= list.length) return false;
  [list[i], list[j]] = [list[j], list[i]];
  return true;
}

/* 清單編輯的點擊；處理了就回傳 true */
async function listClick(e, redraw) {
  const tg = e.target.closest('[data-le-toggle]');
  if (tg) { listEdit = listEdit === tg.dataset.leToggle ? null : tg.dataset.leToggle; redraw(); return true; }
  const b = e.target.closest('[data-le]');
  if (!b) return false;
  const name = b.dataset.name;
  const list = getList(name);
  const i = list.findIndex(x => x.id === b.dataset.id);
  const act = b.dataset.le;
  const done = () => { saveList(name, list); redraw(); refreshBehind(); };
  if (act === 'add') {
    openItemForm(name, JSON.parse(b.dataset.preset || '{}'), true, item => {
      /* 待辦依期限插進去，其他放最後 */
      const at = name === 'todo' ? list.findIndex(t => t.due > item.due) : -1;
      list.splice(at < 0 ? list.length : at, 0, item);
      done();
    });
  } else if (i < 0) {
    return true;
  } else if (act === 'edit') {
    openItemForm(name, list[i], false, item => { list[i] = item; done(); });
  } else if (act === 'del') {
    if (await askConfirm(`刪除「${itemTitle(list[i])}」？`, '刪除')) { list.splice(i, 1); done(); }
  } else if (moveItem(list, i, act === 'up' ? -1 : 1, LIST_GROUP[name])) done();
  return true;
}

/* 新增／編輯的小視窗 */
function openItemForm(name, item, isNew, onSave) {
  const fields = LIST_FIELDS[name];
  const days = sortedDays();
  const input = f => {
    const v = item[f.k] ?? '';
    const req = f.req ? 'required' : '';
    if (f.type === 'textarea') return `<textarea name="${f.k}" ${req}>${esc(v)}</textarea>`;
    if (f.type === 'select') return `<select name="${f.k}">${f.opts.map(([val, lab]) => `<option value="${esc(val)}" ${val === v ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
    if (f.type === 'days') return `<div class="days-pick">${days.map(d => `<label><input type="checkbox" name="${f.k}" value="${esc(d.date)}" ${(Array.isArray(v) ? v : []).includes(d.date) ? 'checked' : ''}>${md(d.date)}（${wd(d.date)}）</label>`).join('')}</div>`;
    if (f.type === 'cat') return `<input name="${f.k}" list="leCats" value="${esc(v)}" ${req}><datalist id="leCats">${[...new Set(getList('phrase').map(p => p.cat))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
    const type = { tel: 'tel', url: 'url', date: 'date' }[f.type] || 'text';
    return `<input name="${f.k}" type="${type}" value="${esc(v)}" ${req}>`;
  };
  openSheet(isNew ? '新增' : '編輯', `<form id="leForm">${fields.map(f => f.type === 'days'
      ? `<div class="field"><span>${esc(f.label)}</span>${input(f)}</div>`
      : `<label class="field"><span>${esc(f.label)}</span>${input(f)}</label>`).join('')}
    <div class="btn-row"><button type="button" class="btn btn-ghost" data-a="cancel">取消</button><button class="btn btn-primary">儲存</button></div></form>`, (body, entry) => {
    const form = $('#leForm', body);
    $('[data-a=cancel]', body).onclick = () => closeSheet(entry);
    form.onsubmit = ev => {
      ev.preventDefault();
      const fd = new FormData(form);
      const out = Object.assign({}, item, { id: item.id || uid(name) });
      for (const f of fields) {
        if (f.type === 'days') { out[f.k] = fd.getAll(f.k); continue; }
        const val = String(fd.get(f.k) ?? '').trim();
        if (f.type === 'url' && val && !safeUrl(val)) return toast('網址要用 http:// 或 https:// 開頭');
        if (val) out[f.k] = val; else delete out[f.k];
      }
      closeSheet(entry);
      onSave(out);
    };
  });
}

const RENDER = { trip: renderTrip, wallet: renderWallet, tools: renderTools, todo: renderTodo, info: renderInfo };
/* 置頂標題列的高度：資訊頁跳轉時不要被標題蓋住 */
const setTopH = () => document.documentElement.style.setProperty('--top-h', $('.topbar').offsetHeight + 'px');

function renderCountdown() {
  const today = nowAt(8).date;
  const el = $('#countdown');
  const toStart = daysBetween(today, TRIP_START);
  const toEnd = daysBetween(today, TRIP_END);
  if (toStart > 0) el.innerHTML = `KOBE CHRISTMAS 2026 ・ 倒數 <b>${toStart}</b> 天`;
  else if (toEnd >= 0) el.innerHTML = `KOBE CHRISTMAS 2026 ・ 第 <b>${1 - toStart}</b> 天 🎄`;

}

/* 「待辦」分頁上的小紅點：14 天內到期或已過期、還沒打勾 */
function updateTabDots() {
  const today = nowAt(8).date;
  const soon = new Date(Date.parse(today + 'T00:00:00Z') + 14 * 864e5).toISOString().slice(0, 10);
  const done = store.get(K.todo, {});
  const due = today <= TRIP_END && getList('todo').some(t => !done[t.id] && t.due <= soon);
  const tab = $('.tab[data-view="todo"]');
  tab.classList.toggle('dot', due);
  tab.setAttribute('aria-label', due ? '待辦（有快到期的項目）' : '待辦');
}

/* =========================================================
   待辦（行前 TO-DO）
   ========================================================= */
function renderTodo() {
  const v = $('#view-todo');
  const done = store.get(K.todo, {});
  const today = nowAt(8).date;
  const list = getList('todo');
  const ed = listEdit === 'todo';
  v.innerHTML = `<div class="sec-row"><div class="sec-title">TO-DO ${list.filter(t => done[t.id]).length}/${list.length}</div>${leToggle('todo')}</div>
    <div class="card">${list.map(t => {
      const ok = !!done[t.id];
      const late = !ok && t.due < today;
      const due = `<div class="small ${late ? '' : 'muted'}" ${late ? 'style="color:var(--red);font-weight:700"' : ''}>${late ? '⚠️ 已過建議日 ' : '建議 '}${md(t.due)} 前</div>`;
      return ed ? `<div class="le-row"><span class="grow"><div class="ttl">${esc(t.text)}</div>${due}</span>${leTools('todo', t.id)}</div>`
        : `<button class="list-row ${ok ? 'done' : ''}" data-todo="${esc(t.id)}" style="width:100%;text-align:left"><span class="chk ${ok ? 'on' : ''}">${ok ? '✓' : ''}</span><span class="grow"><div class="ttl">${esc(t.text)}</div>${due}</span></button>`;
    }).join('') || '<div class="empty">沒有待辦</div>'}
    ${ed ? leAdd('todo', { due: today }) : ''}</div>
    ${checkSec('pack', 'PACKING 打包')}
    ${checkSec('souv', 'SOUVENIRS 伴手禮')}`;
  updateTabDots();
  v.onclick = async e => {
    if (await listClick(e, renderTodo)) return;
    const td = e.target.closest('[data-todo]');
    const ck = e.target.closest('[data-chk]');
    if (!td && !ck) return;
    const key = td ? K.todo : K.check;
    const id = td ? td.dataset.todo : ck.dataset.chk;
    const all = store.get(key, {});
    if (all[id]) delete all[id]; else all[id] = Date.now();
    store.set(key, all);
    renderTodo();
  };
}

/* 打包、伴手禮：可以打勾、可以編輯（8-4） */
function checkSec(name, title) {
  const done = store.get(K.check, {});
  const list = getList(name);
  const ed = listEdit === name;
  const txt = t => `<span class="grow"><div class="ttl">${esc(t.text)}</div>${t.sub ? `<div class="small muted">${esc(t.sub)}</div>` : ''}</span>`;

    ${ed ? leAdd(name) : ''}</div>`;
}

function renderTrip() {

  const tripNow = jstTripNow();
  v.innerHTML = `
    <div class="date-tabs" id="dateTabs">
      ${days.map(d => `<button class="date-tab ${d.id === day?.id ? 'active' : ''} ${d.date === tripNow.date ? 'today' : ''}" data-day="${esc(d.id)}">
        <div class="w">${wdEn(d.date)}</div><div class="d">${md(d.date)}</div></button>`).join('')}
      <button class="date-tab add" data-act="add-day" aria-label="新增一天">＋</button>
    </div>
    <div id="dayView"></div>`;
  $('#dateTabs', v).onclick = e => {
    const b = e.target.closest('button');

    ui.day = b.dataset.day;
    saveUi();
    renderTrip();

  else $('#dayView').innerHTML = '<div class="empty">還沒有任何一天，按 ＋ 新增</div>';

function renderDay(day) {
  const idx = sortedDays().findIndex(d => d.id === day.id);
  const loc = LOCS[day.loc] || LOCS.kobe;
  const br = day.branches ? (ui.branch[day.id] || 'A') : null;
  const isFirst = day.date === TRIP_START;
  const isLast = day.date === TRIP_END;
  const hotelLine = isFirst ? HOTEL.firstNight : isLast ? HOTEL.lastDay : HOTEL.midStay;
  const sun = sunTimes(day.date, loc.lat, loc.lon);
  const nLights = getList('light').filter(l => (l.dates || []).includes(day.date)).length;
  const dv = $('#dayView');
  dv.innerHTML = `
    <div class="day-wrap">
      <div class="day-vert">第${idx + 1}天</div>
      <div class="hero" id="hero">
        <div class="hero-art">${day.bg ? '' : HERO_ART[day.theme] || HERO_ART.kobe}</div>
        <div class="hero-text">
          <div class="hero-meta"><span class="hero-badge">DAY ${idx + 1}</span><span>${ic('place')} ${esc(day.city || loc.name)}</span></div>
          <div class="hero-title">${esc(day.title)}</div>
        </div>
      </div>
    </div>
    <div class="wx-head">
      <button class="wx-loc" data-act="wx-retry" aria-label="重新整理天氣">${ic('refresh')}<span>${esc(loc.en)}</span></button>
      <span class="vbar"></span>
      <button class="ic-btn" data-act="edit-day" aria-label="編輯這天">${ic('edit')}</button>
      <button class="ic-btn red" data-act="del-day" aria-label="刪除這天">${ic('trash')}</button>
      <span class="sp"></span>
      <button class="ic-btn ${ui.editing ? 'on' : ''}" data-act="toggle-edit" aria-label="編輯模式">${ic('gear')}</button>
    </div>
    <div id="wx"><div class="wx-meta">天氣載入中…</div></div>
    <button class="pill-line" data-act="lights">🌇 日落 <b>${sun.set}</b>${nLights ? `・🎄 點燈 ${nLights} 處` : `・🌃 天黑 <b>${sunTimes(day.date, loc.lat, loc.lon, -6).set}</b>`}<span class="chev">›</span></button>
    <button class="hotel-line" data-act="hotel"><span class="hl-bar"></span><span class="grow"><span class="lbl">住宿資訊</span><span class="nm">${esc(HOTEL.name)}</span><span class="sub">${esc(hotelLine)}</span></span><span class="chev">›</span></button>
    ${day.branches ? `<div class="branch-toggle" id="branchSeg">
      <button data-b="A" class="${br === 'A' ? 'on' : ''}">A ${esc(day.branches.A)}</button>
      <button data-b="B" class="${br === 'B' ? 'on' : ''}">B ${esc(day.branches.B)}</button></div>` : ''}
    <div class="timeline ${ui.editing ? 'editing' : ''}" id="timeline">${renderTimelineHtml(day, br)}</div>
    <div class="add-ev"><button class="btn btn-ghost btn-sm" data-act="add-ev">＋ 新增行程</button></div>
    ${dayMapHtml(day)}
    ${day.note ? `<div class="card day-note"><div class="card-title">備註</div>${noteHtml(day.note)}</div>` : ''}`;
  applyHeroImage(day);
  dv.onclick = async e => {
    const a = e.target.closest('[data-act],[data-ev],[data-b]');
    if (!a) return;
    if (a.dataset.act === 'ev-edit') { e.stopPropagation(); return openEventEditor(day, findEvent(day, a.dataset.id)); }
    if (a.dataset.act === 'ev-del') { e.stopPropagation(); return deleteEvent(day, a.dataset.id); }
    if (a.dataset.ev) return openEventDetail(day, a.dataset.ev);
    if (a.dataset.b) { ui.branch[day.id] = a.dataset.b; saveUi(); return renderDay(day); }
    const act = a.dataset.act;
    if (act === 'edit-day') openDayEditor(day);

    else if (act === 'toggle-edit') { ui.editing = !ui.editing; saveUi(); renderDay(day); toast(ui.editing ? '編輯模式：每個行程下方可直接編輯／刪除' : '已關閉編輯模式'); }
    else if (act === 'hotel') openHotel();
    else if (act === 'lights') openDayLights(day, loc);
    else if (act === 'add-ev') openEventEditor(day, null);
    else if (act === 'wx-retry') renderWeather(day, true);
  };
  renderWeather(day);
}

/* 備註：每段一個區塊，句號「。」後換行 */
function noteHtml(text) {
  return String(text).split('\n').filter(l => l.trim())

/* 舊版「現在」按鈕：旅程中跳到今天正在進行的行程 */
function scrollToNow() {
  const n = jstTripNow();
  const d = trip.days.find(x => x.date === n.date);
  if (!d) {
    toast(`旅程 ${md(TRIP_START)} 開始，到時按這裡會跳到正在進行的行程`);

async function applyHeroImage(day) {
  const hero = $('#hero');
  if (!hero || !day.bg) return;
  let src = day.bg;
  if (src.startsWith('idb:')) {
    const f = await idb.get(src.slice(4)).catch(() => null);
    src = f && f.dataUrl;
  }
  const art = $('.hero-art', hero);
  if (!art || curDay().id !== day.id) return;

  art.innerHTML = '';

function eventsFor(day, br) {
  return day.events
    .filter(e => !e.branch || !day.branches || e.branch === br)
    .sort((a, b) => toMin(a.time) - toMin(b.time));
}

function renderTimelineHtml(day, br) {
  const evs = eventsFor(day, br);
  if (!evs.length) return '<div class="empty">這天還沒有行程</div>';
  const n = jstTripNow();
  let nowIdx = -1;
  if (n.date === day.date) evs.forEach((e, i) => { if (toMin(e.time) <= n.min) nowIdx = i; });
  return evs.map((e, i) => {
    const t = TYPES[e.type] || TYPES.SIGHT;
    const cls = nowIdx < 0 ? '' : i < nowIdx ? 'past' : i === nowIdx ? 'now' : '';
    return `<div class="ev type-${esc(e.type)} ${cls}" role="button" tabindex="0" data-ev="${esc(e.id)}">
      <div class="ev-time">${esc(e.label || e.time)}${e.end ? `<small>–${esc(e.end)}</small>` : ''}${e.est ? '<small>約</small>' : ''}</div>
      <div class="ev-rail"><span class="ev-dot"></span></div>
      <div class="ev-body">
        <div class="ev-title">${esc(e.title)}</div>
        <div class="ev-type">${ic(e.icon || t.icon)} ${esc(t.en)}${e.booked ? ' <span class="ok">✓ 已訂</span>' : ''}${e.warn ? ` <span class="wn">⚠ ${esc(shortWarn(e.warn))}</span>` : ''}${cls === 'now' ? ' <span class="now-badge">NOW</span>' : ''}</div>
        ${e.sub ? `<div class="ev-sub">${esc(e.sub)}</div>` : ''}
        <div class="ev-tools"><button class="btn btn-sm btn-ghost" data-act="ev-edit" data-id="${esc(e.id)}">${ic('edit')} 編輯</button><button class="btn btn-sm btn-danger" data-act="ev-del" data-id="${esc(e.id)}">${ic('trash')} 刪除</button></div>

/* 時間軸上只放注意事項的開頭（8 字內），全文在點開的詳情裡 */
function shortWarn(w) {
  const head = String(w).split(/[：:，,；;。→（(｜|]/)[0].trim();

function renderSunStrip(day, loc) {

/* 天氣：16 天內顯示當天逐時預報；更早則顯示目前起 24 小時 */
function wxRequest(day) {
  const loc = LOCS[day.loc] || LOCS.kobe;
  const today = nowAt(9).date;
  const ahead = daysBetween(today, day.date);
  const inRange = ahead >= 0 && ahead <= 15;
  const base = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&timezone=Asia%2FTokyo&hourly=temperature_2m,precipitation_probability,weather_code`;
  const url = inRange
    ? `${base}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&start_date=${day.date}&end_date=${day.date}`
    : `${base}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=2`;
  return { loc, inRange, ahead, key: inRange ? `${day.loc}|${day.date}` : `${day.loc}|now`, url };
}

let wxToken = 0;
async function renderWeather(day, force = false) {
  const token = ++wxToken;
  const { loc, inRange, key, url } = wxRequest(day);
  const cache = store.get(K.wx, {});
  let data = null;
  let offline = false;
  const fresh = cache[key] && Date.now() - cache[key].ts < 30 * 60e3;
  if (fresh && !force) data = cache[key];
  else {
    try {
      data = { ts: Date.now(), json: await fetchJson(url) };
      cache[key] = data;
      store.set(K.wx, cache);
      if (force) toast('天氣已更新');
    } catch (e) {
      data = cache[key] || null;
      offline = true;
      if (force) toast('連不上天氣服務，顯示快取');
    }
  }
  if (token !== wxToken) return;
  const el = $('#wx');
  if (!el) return;
  if (!data) {
    el.innerHTML = `<div class="wx-meta">無法取得天氣（離線且沒有快取）。${esc(loc.normal)}</div>`;
    return;
  }
  const j = data.json;
  const stamp = `${offline ? '離線・' : ''}更新 ${fmtTs(data.ts)}`;
  let hours = (j.hourly.time || []).map((t, i) => ({ t, h: t.slice(11, 16), temp: j.hourly.temperature_2m[i], p: j.hourly.precipitation_probability[i], c: j.hourly.weather_code[i] }));
  let summary;
  if (inRange) {
    hours = hours.filter(x => +x.h.slice(0, 2) >= 6);
    const d = j.daily;
    summary = `<div class="wx-day"><b>${Math.round(d.temperature_2m_max[0])}° / ${Math.round(d.temperature_2m_min[0])}°</b><span>${WX_TEXT(d.weather_code[0])}・降雨 ${d.precipitation_probability_max[0] ?? '—'}%</span><small>${stamp}</small></div>`;
  } else {
    /* 還沒進 16 天預報範圍（或日期已過）：顯示目前起 24 小時 */
    const nowKey = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 13);
    const start = Math.max(0, hours.findIndex(x => x.t.slice(0, 13) === nowKey));
    hours = hours.slice(start, start + 24);
    const c = j.current || {};
    summary = `<div class="wx-day"><b>${Math.round(c.temperature_2m)}°</b><span>現在${WX_TEXT(c.weather_code)}・今天 ${Math.round(j.daily.temperature_2m_max[0])}°/${Math.round(j.daily.temperature_2m_min[0])}°</span><small>目前天氣・${stamp}</small></div>`;
  }
  el.innerHTML = `<div class="wx-hours">${hours.map(x => `<div class="wx-h"><div>${x.h}</div>${wxSvg(x.c)}<div class="t">${Math.round(x.temp)}°</div><div class="p">${x.p >= 30 ? x.p + '%' : ''}</div></div>`).join('')}</div>${summary}`;
}

/* ---------- 行程詳情與編輯 ---------- */
function findEvent(day, id) { return day.events.find(e => e.id === id); }

async function deleteEvent(day, id) {
  const e = findEvent(day, id);
  if (!e || !(await askConfirm(`刪除「${e.title}」？`, '刪除'))) return false;
  day.events = day.events.filter(x => x.id !== id);
  saveTrip();
  renderDay(day);
  toast('已刪除');
  return true;
}

async function deleteDay(day) {
  if (trip.days.length <= 1) return toast('至少保留一天');
  if (!(await askConfirm(`刪除 ${md(day.date)} 整天（含所有行程）？`, '刪除'))) return false;
  trip.days = trip.days.filter(d => d.id !== day.id);
  idb.del('hero:' + day.id).catch(() => {});
  saveTrip();
  ui.day = sortedDays()[0].id;
  saveUi();
  renderTrip();
  return true;
}

      ev.preventDefault();

      out.date = fd.get('date');
      out.title = fd.get('title').trim();
      out.city = fd.get('city').trim();
      out.loc = fd.get('loc');
      out.theme = fd.get('theme');
      out.note = fd.get('note').trim();
      out.branches = fd.get('hasBranch') ? { A: fd.get('brA').trim() || 'A 案', B: fd.get('brB').trim() || 'B 案' } : null;
      const mapEmbed = fd.get('mapEmbed').trim();
      const mapLink = safeUrl(fd.get('mapLink').trim());
      if (mapEmbed) out.mapEmbed = mapEmbed; else delete out.mapEmbed;
      if (mapLink) out.mapLink = mapLink; else delete out.mapLink;
      const urlBg = fd.get('bg').trim();
      if (pendingBg) {
        await idb.set('hero:' + out.id, { dataUrl: pendingBg, name: 'hero', ts: Date.now() });
        out.bg = 'idb:hero:' + out.id;
      } else if (pendingBg === '') {

        idb.del('hero:' + out.id).catch(() => {});
      } else if (urlBg) out.bg = urlBg;
      else if (!out.bg?.startsWith('idb:')) out.bg = '';
      if (isNew) trip.days.push(out);
      saveTrip();
      ui.day = out.id;
      saveUi();
      closeSheet(entry);
      renderTrip();
      toast('已儲存');
    };
  });
}

/* =========================================================
   錢包：匯率（自動抓＋手動鎖定）＋記帳
   ========================================================= */
const RATE_FALLBACK = 0.21;
let convDir = 'JPY';

function getRate() { return store.get(K.rate, { rate: RATE_FALLBACK, src: '預設值', ts: 0, locked: false }); }

async function refreshRate(force = false) {
  const r = getRate();
  if (r.locked && !force) return r;
  if (!force && r.ts && Date.now() - r.ts < 6 * 3600e3) return r;
  const tries = [
    ['open.er-api.com', 'https://open.er-api.com/v6/latest/JPY', j => j.rates && j.rates.TWD],
    ['fawazahmed0', 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json', j => j.jpy && j.jpy.twd]
  ];
  for (const [src, url, pick] of tries) {
    try {
      const val = pick(await fetchJson(url));
      if (val > 0) {
        const nr = { rate: +val.toFixed(5), src, ts: Date.now(), locked: false };
        store.set(K.rate, nr);
        return nr;
      }
    } catch (e) { /* 換下一個來源 */ }
  }
  if (force) toast('抓不到匯率，沿用目前數值');
  return r;
}

/* 記帳分類（設計稿 5C：多了「住宿」）；顏色跟行程類型一致 */
const EXP_CATS = ['餐飲', '交通', '購物', '門票', '住宿', '其他'];
const CAT_COLORS = { 餐飲: '#2563EB', 交通: '#EF4444', 購物: '#F97316', 門票: '#14B8A6', 住宿: '#EAB308', 其他: '#94A3B8' };
const PAYERS = ['Aaron', 'Yvonne', '共同'];
let expDate = '';   /* 這次開 APP 選的記帳日期；沒選過就是今天 */

/* 付款人、幣別、分類記住上一次的選擇 */
const expPref = () => Object.assign({ payer: 'Aaron', cur: 'JPY', cat: '餐飲' }, ui.exp);
const setExpPref = patch => { ui.exp = Object.assign(expPref(), patch); saveUi(); };
const expCat = e => EXP_CATS.includes(e.cat) ? e.cat : '其他';
const dateLabel = d => `${md(d)}（${wd(d)}）`;
const expDates = (...extra) => [...new Set([...sortedDays().map(d => d.date), nowAt(9).date, ...extra.filter(Boolean)])].sort();

function renderWallet() {
  const v = $('#view-wallet');
  const r = getRate();
  const exps = store.get(K.exp, []);
  const pf = expPref();
  const dates = expDates();
  if (!dates.includes(expDate)) expDate = nowAt(9).date;
  const toJpy = e => e.cur === 'TWD' ? e.amt / r.rate : e.amt;
  const sumBy = f => exps.reduce((o, e) => { const k = f(e); o[k] = (o[k] || 0) + toJpy(e); return o; }, {});
  const totalJ = exps.reduce((s, e) => s + toJpy(e), 0);
  const byPayer = sumBy(e => e.payer || '共同');
  const byCat = sumBy(expCat);
  const byDate = {};
  exps.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  const budget = +store.get(K.budget, 0) || 0;
  const pct = budget ? Math.round(totalJ / budget * 100) : 0;
  /* 分類長條：有預算時整條＝預算，沒預算時整條＝總支出 */
  const scale = Math.max(budget, totalJ) || 1;
  const pend = exps.filter(e => e.pending).length;
  const expRow = e => `<div class="exp-row ${e.pending ? 'pending' : ''}" data-exp="${esc(e.id)}" role="button" tabindex="0">
      <div class="grow"><div class="nm">${esc(e.name)}${e.pending ? '<span class="pend-tag">待確認</span>' : ''}</div>
        <div class="small muted">${esc([e.payer || '共同', expCat(e), e.pay, e.note].filter(Boolean).join('・'))}</div>
        ${e.items ? `<div class="its">${esc(e.items)}</div>` : ''}</div>
      <div class="amt">${e.cur === 'TWD' ? twd(e.amt) : yen(e.amt)}<small>${e.cur === 'TWD' ? '≈ ' + yen(e.amt / r.rate) : '≈ ' + twd(e.amt * r.rate)}</small></div>
      <button class="x-btn" data-del="${esc(e.id)}" aria-label="刪除">✕</button></div>`;
  v.innerHTML = `
    <div class="sec-title">WALLET</div>
    <div class="card">
      <div class="rate-head"><button class="rate-t" id="rateEdit">匯率換算 [ <b>${(+r.rate).toFixed(3)}</b> ]</button>
        <button class="lock-btn ${r.locked ? 'on' : ''}" id="lockBtn" aria-label="${r.locked ? '解除鎖定匯率' : '鎖定匯率'}">${r.locked ? '🔒' : '🔓'}</button></div>
      <div class="calc">
        <div class="calc-row"><span class="cur" id="curTop">${convDir}</span><input id="convTop" inputmode="decimal" placeholder="0" aria-label="換算金額"></div>
        <button class="calc-swap" id="swapBtn" aria-label="交換幣別">⇅</button>
        <div class="calc-row"><span class="cur" id="curBot">${convDir === 'JPY' ? 'TWD' : 'JPY'}</span><input id="convBot" inputmode="decimal" placeholder="0" aria-label="換算結果"></div>
      </div>
      <div class="quick-amt">${[500, 1000, 3000, 5000, 10000].map(n => `<button data-q="${n}">${n === 10000 ? '¥1萬' : '¥' + n}</button>`).join('')}</div>
    </div>

    <div class="card">
      <div class="tot-lbl">總支出</div>
      <div class="tot-big">${yen(totalJ)}</div>
      <div class="tot-sub"><span>≈ ${twd(totalJ * r.rate)}</span>${PAYERS.filter(p => byPayer[p]).map(p => `・<span>${p} ${yen(byPayer[p])}</span>`).join('')}</div>
      <button class="budget" data-w="budget">
        <div class="budget-txt">${budget
          ? `<span>預算 ${yen(budget)}</span>${pct > 100 ? `<span class="over">超支 ${yen(totalJ - budget)}</span>` : `<span>已花 ${pct}%・剩 ${yen(budget - totalJ)}</span>`}`
          : '<span>總預算</span><span class="go">設定 ›</span>'}</div>
        <div class="cat-bar ${budget && pct > 100 ? 'over' : ''}">${EXP_CATS.filter(c => byCat[c] > 0).map(c => `<i style="width:${byCat[c] / scale * 100}%;background:${CAT_COLORS[c]}"></i>`).join('')}</div>
        ${totalJ ? `<div class="cat-legend">${EXP_CATS.filter(c => byCat[c] > 0).map(c => `<span><i class="cat-dot" style="background:${CAT_COLORS[c]}"></i>${c} <b>${yen(byCat[c])}</b></span>`).join('')}</div>` : ''}
      </button>
      <form class="exp-form" id="expForm" autocomplete="off">
        <div class="chip-row">
          <label class="sel-chip">📅<select id="expDateSel" aria-label="日期">${dates.map(d => `<option value="${esc(d)}" ${d === expDate ? 'selected' : ''}>${dateLabel(d)}</option>`).join('')}</select></label>
          <label class="sel-chip"><select id="expCatSel" aria-label="分類">${EXP_CATS.map(c => `<option ${c === pf.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
        </div>
        <div class="chip-row">
          ${PAYERS.map(p => `<button type="button" class="chip ${p === pf.payer ? 'on' : ''}" data-payer="${p}">${p}</button>`).join('')}
          <span class="gap"></span>
          <button type="button" class="chip ${pf.cur === 'JPY' ? 'on' : ''}" data-cur="JPY">¥</button><button type="button" class="chip ${pf.cur === 'TWD' ? 'on' : ''}" data-cur="TWD">NT$</button>
        </div>
        <div class="in-row"><input name="name" placeholder="項目" required aria-label="項目"><input name="amt" class="amt-in" inputmode="decimal" placeholder="${pf.cur === 'TWD' ? '台幣' : '日幣'}" required aria-label="金額"><button class="add-btn" aria-label="加入">＋</button></div>
      </form>
    </div>

    <div class="card">
      <div class="card-title">明細<span class="sp"></span>${pend ? `<span class="pend-tag">${pend} 筆待確認</span>` : ''}</div>
      ${exps.length ? Object.keys(byDate).sort().reverse().map(d => {
        const sum = byDate[d].reduce((s, e) => s + toJpy(e), 0);
        return `<div class="exp-day"><span>${dateLabel(d)}</span><span>${yen(sum)}</span></div>` + byDate[d].map(expRow).join('');
      }).join('') : '<div class="empty">還沒有記帳</div>'}
      <div class="small muted" style="margin-top:8px">點一筆可以修改；黃色是收據 AI 看不清楚、要對照原收據的。</div>
      <div class="btn-row"><button class="btn btn-ghost" data-w="export">⬇︎ 匯出 CSV</button><button class="btn btn-danger" data-w="clear">清除全部</button></div>
    </div>

    <details class="card ai-card">
      <summary>🧾 收據 AI 整理匯入<span class="chev">›</span></summary>
      <div class="ai-warn">拍照前先遮住卡號、會員編號、QR Code。AI 可能看錯小字，入帳前請對照原收據。</div>
      <ol class="small" style="margin:10px 0 0 18px;color:var(--ink-2)"><li>按「複製提示詞」，連同收據照片傳給 Claude 或 ChatGPT（可以一次好幾張）。</li><li>把 AI 回覆的表格整段貼到下面，按「匯入」。</li><li>同一張收據、同一分類會合併成一筆；付款人用上面選的。</li></ol>
      <button class="btn btn-block" data-w="prompt" style="margin-top:10px">📋 複製收據整理提示詞</button>
      <textarea id="aiPaste" class="ai-paste" placeholder="| 日期 | 店名 | 品項 | 數量 | 含稅金額 | 付款方式 | 分類 | 備註 |"></textarea>
      <button class="btn btn-primary btn-block" data-w="ai-import" style="margin-top:8px">⬆︎ 匯入表格到記帳</button>
    </details>`;

  const top = $('#convTop'), bot = $('#convBot');
  const rateNow = () => getRate().rate;
  const calc = from => {
    const rt = rateNow();
    const val = parseFloat((from === 'top' ? top : bot).value);
    const target = from === 'top' ? bot : top;
    if (isNaN(val)) { target.value = ''; return; }
    const fromJpy = (from === 'top') === (convDir === 'JPY');
    target.value = fromJpy ? (Math.round(val * rt * 10) / 10).toString() : Math.round(val / rt).toString();
  };
  const swap = () => {
    convDir = convDir === 'JPY' ? 'TWD' : 'JPY';
    $('#curTop').textContent = convDir;
    $('#curBot').textContent = convDir === 'JPY' ? 'TWD' : 'JPY';
    top.value = bot.value;
    calc('top');
  };
  top.oninput = () => calc('top');
  bot.oninput = () => calc('bot');
  $('#swapBtn').onclick = swap;
  $('#rateEdit').onclick = openRateSheet;
  $('#lockBtn').onclick = () => {
    const cur = getRate();
    cur.locked = !cur.locked;
    store.set(K.rate, cur);
    toast(cur.locked ? '匯率已鎖定，不再自動更新' : '已解鎖，有網路時會自動抓最新匯率');
    renderWallet();
  };
  $('#expDateSel').onchange = e => { expDate = e.target.value; };
  $('#expCatSel').onchange = e => setExpPref({ cat: e.target.value });
  $('#expForm').onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const amt = parseFloat(String(fd.get('amt')).replace(/[,，¥＄$]/g, ''));
    if (!(amt > 0)) return toast('金額要大於 0');
    const p = expPref();
    const list = store.get(K.exp, []);
    list.push({ id: uid('x'), date: expDate, name: String(fd.get('name')).trim(), amt, cur: p.cur, payer: p.payer, cat: p.cat, ts: Date.now() });
    store.set(K.exp, list);
    toast(`已記帳：${p.payer}・${p.cat}`);
    renderWallet();
  };
  v.onclick = async e => {
    const q = e.target.closest('[data-q]');
    if (q) { if (convDir !== 'JPY') swap(); top.value = q.dataset.q; calc('top'); return; }
    const pay = e.target.closest('[data-payer]');
    const cu = e.target.closest('[data-cur]');
    if (pay || cu) {
      setExpPref(pay ? { payer: pay.dataset.payer } : { cur: cu.dataset.cur });
      $$(pay ? '[data-payer]' : '[data-cur]', v).forEach(b => b.classList.toggle('on', b === (pay || cu)));
      if (cu) $('.amt-in', v).placeholder = cu.dataset.cur === 'TWD' ? '台幣' : '日幣';
      return;
    }
    const d = e.target.closest('[data-del]');
    if (d) {
      if (!(await askConfirm('刪除這筆？', '刪除'))) return;
      store.set(K.exp, store.get(K.exp, []).filter(x => x.id !== d.dataset.del));
      return renderWallet();
    }
    const row = e.target.closest('[data-exp]');
    if (row) return openExpEditor(row.dataset.exp);
    const w = e.target.closest('[data-w]');
    if (!w) return;
    const act = w.dataset.w;
    if (act === 'budget') openBudget();
    else if (act === 'export') exportExpCsv();
    else if (act === 'prompt') { await copyText(RECEIPT_PROMPT); toast('已複製提示詞，傳給 AI 時記得附上收據照片'); }
    else if (act === 'ai-import') { if (await importReceipt($('#aiPaste').value)) renderWallet(); }
    else if (act === 'clear') {
      if (!store.get(K.exp, []).length) return toast('沒有資料');
      if (await askConfirm('清除全部記帳？建議先匯出 CSV。', '全部清除')) { store.set(K.exp, []); renderWallet(); }
    }
  };
  v.onkeydown = e => { if (e.key === 'Enter' && e.target.matches('[data-exp]')) openExpEditor(e.target.dataset.exp); };
  if (!r.locked && (!r.ts || Date.now() - r.ts > 6 * 3600e3)) {
    refreshRate().then(nr => {
      const typing = document.activeElement && document.activeElement.closest('#view-wallet input, #view-wallet select, #view-wallet textarea');
      if (nr.ts !== r.ts && ui.view === 'wallet' && !sheets.length && !typing) renderWallet();
    });
  }
}

/* 匯率小視窗：手動輸入（並鎖定）或抓最新 */

    <label class="field"><span>1 日圓＝幾台幣</span><input name="rate" inputmode="decimal" value="${esc(r.rate)}" required></label>
    <div class="small muted">${r.locked ? '🔒 目前鎖定，不會自動更新。' : '🔓 沒鎖定：有網路時每 6 小時自動更新。'}</div>
    <div class="btn-row"><button type="button" class="btn" data-a="refresh">${ic('refresh')} 抓最新匯率</button><button class="btn btn-primary">用這個匯率並鎖定</button></div></form>`, (body, entry) => {
    $('#rtForm', body).onsubmit = e => {
      e.preventDefault();
      const val = parseFloat(new FormData(e.target).get('rate'));
      if (!(val > 0 && val < 10)) return toast('匯率格式不對');
      store.set(K.rate, { rate: val, src: '手動', ts: Date.now(), locked: true });
      closeSheet(entry);
      toast('已改用手動匯率並鎖定');
      renderWallet();
    };
    $('[data-a=refresh]', body).onclick = async () => {

      closeSheet(entry);
      if (nr.ts !== r.ts) toast('匯率已更新：' + nr.rate);
      renderWallet();
    };
  });
}

function openExpEditor(id) {
  const e = store.get(K.exp, []).find(x => x.id === id);
  if (!e) return;

/* 解析 AI 表格：同一張收據（日期＋店名＋付款方式）同分類合併成一筆，消費稅依金額比例分到各分類（9/15 記帳設計稿 2C） */
function parseReceipt(raw, fallbackDate, payer) {
  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l && !/^\|?\s*:?-{3,}/.test(l));
  const cellsOf = l => (l.includes('\t') ? l.split('\t') : l.replace(/^\|/, '').replace(/\|$/, '').split('|')).map(c => c.trim());
  let head = null;
  const groups = new Map();
  for (const line of lines) {
    const c = cellsOf(line);
    if (!head) { if (c.some(x => x.includes('日期')) && c.some(x => x.includes('金額'))) head = c; continue; }
    if (c.every(x => !x)) continue;
    const g = k => { const i = head.findIndex(h => h.includes(k)); return i >= 0 ? (c[i] || '') : ''; };
    const [date0, shop, item, qty, amt, pay, cat0, note] = ['日期', '店名', '品項', '數量', '金額', '付款', '分類', '備註'].map(g);
    if (/合計|小計|總計/.test(item || shop)) continue;
    let pending = [date0, shop, item, qty, amt, cat0].some(x => x.includes('待確認'));
    const yenAmt = parseInt(amt.replace(/[^\d]/g, ''), 10) || 0;
    if (!yenAmt) pending = true;
    let date = date0;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date0)) { date = fallbackDate; pending = true; }
    const isTax = /消費稅|消費税/.test(item);
    let cat = cat0;
    if (!isTax && !EXP_CATS.includes(cat0)) { cat = '其他'; pending = true; }
    const key = [date, shop, pay].join('|');
    if (!groups.has(key)) groups.set(key, { date, shop, pay, tax: 0, taxPending: false, cats: new Map() });
    const gr = groups.get(key);
    if (isTax) { gr.tax += yenAmt; if (pending) gr.taxPending = true; continue; }
    if (!gr.cats.has(cat)) gr.cats.set(cat, { amt: 0, items: [], notes: new Set(), pending: false });
    const cg = gr.cats.get(cat);
    cg.amt += yenAmt;
    const q = parseInt(qty, 10);
    cg.items.push((item || '未命名') + (q > 1 ? '×' + q : ''));
    if (note && note !== '-') cg.notes.add(note);
    if (pending) cg.pending = true;
  }
  const recs = [];
  for (const gr of groups.values()) {
    const cats = [...gr.cats.entries()];
    if (!cats.length) cats.push(['其他', { amt: 0, items: ['消費稅'], notes: new Set(), pending: true }]);
    const base = cats.reduce((s, [, cg]) => s + cg.amt, 0);
    let left = gr.tax;
    cats.forEach(([, cg], i) => {
      const share = i === cats.length - 1 ? left : Math.round(gr.tax * (base ? cg.amt / base : 1 / cats.length));
      cg.amt += share;
      left -= share;
    });
    for (const [cat, cg] of cats) {
      const rec = { id: uid('x'), date: gr.date, name: gr.shop || cg.items[0] || '收據', items: cg.items.join('、'), amt: cg.amt, cur: 'JPY', payer, cat, ts: Date.now() + recs.length, src: 'ai' };
      if (gr.pay) rec.pay = gr.pay;
      if (cg.notes.size) rec.note = [...cg.notes].join('、');
      if (cg.pending || gr.taxPending || !cg.amt) rec.pending = true;
      recs.push(rec);
    }
  }
  return { head, recs };
}

async function importReceipt(text) {
  const raw = String(text || '').trim();
  if (!raw) { toast('請先貼上 AI 回覆的表格'); return false; }
  const pf = expPref();
  const { head, recs } = parseReceipt(raw, expDate || nowAt(9).date, pf.payer);
  if (!head) { toast('找不到表頭：表格第一列要有「日期」和「含稅金額」'); return false; }
  if (!recs.length) { toast('表格裡沒有可以匯入的資料'); return false; }
  const pend = recs.filter(r => r.pending).length;
  const sum = recs.reduce((s, r) => s + r.amt, 0);
  const msg = `匯入 ${recs.length} 筆，合計 ${yen(sum)}（同一張收據、同一分類合併成一筆）。\n付款人記為「${pf.payer}」，之後可以點那一筆修改。` +
    (pend ? `\n其中 ${pend} 筆有「待確認」，會用黃底標示：對照原收據點一下補上。` : '');
  if (!(await askConfirm(msg, '匯入', false))) return false;
  store.set(K.exp, store.get(K.exp, []).concat(recs));
  toast('已匯入');
  return true;
}

        switchView('trip');
      }
    });
  });
}

/* 12 月穿搭建議（8-6）：日落時間用天文公式算 */
function outfitHtml(days) {
  const sets = days.map(d => { const l = LOCS[d.loc] || LOCS.kobe; return sunTimes(d.date, l.lat, l.lon).set; }).filter(Boolean).sort();
  const sun = sets.length ? (sets[0] === sets[sets.length - 1] ? sets[0] : `${sets[0]}–${sets[sets.length - 1]}`) : '';
  return `<div class="card"><div class="card-title">👕 12 月神戶穿搭</div>
    <div class="outfit-temp">🌡️ 平年 約 4–11°C・洋蔥式穿搭</div>

      <li>發熱衣＋毛衣或刷毛＋防風保暖外套</li>

}

/* 離線地圖截圖 */
function openMapShots() {
  const draw = async body => {
    const all = (await idb.all().catch(() => [])).filter(([k]) => k.startsWith('map:')).sort((a, b) => b[1].ts - a[1].ts);
    const days = sortedDays();
    body.innerHTML = `
      <div class="note small">把 Google Maps 的路線、站內地圖、餐廳位置先截圖存進來。圖片只存在這支手機，沒網路也能看。</div>
      <div class="row2" style="margin-top:12px;align-items:end">
        <label class="field" style="margin-bottom:0"><span>標記為</span><select id="shotTag"><option value="">一般</option>${days.map(d => `<option value="${esc(d.date)}">${md(d.date)} ${esc(d.title)}</option>`).join('')}</select></label>
        <button class="btn btn-primary" data-act="add" style="margin-bottom:0">📷 加入截圖</button>
      </div>
      <div class="sec-title">${all.length} 張</div>
      ${all.length ? `<div class="gallery">${all.map(([k, f]) => `<figure data-k="${esc(k)}"><img src="${imgSrc(f.dataUrl)}" alt="${esc(f.name || '')}"><figcaption>${f.tag ? md(f.tag) : '一般'}</figcaption></figure>`).join('')}</div>`
        : '<div class="empty">還沒有截圖</div>'}`;
  };
  openSheet('離線地圖截圖', '<div class="empty">載入中…</div>', body => {
    draw(body);
    body.onclick = async e => {
      if (e.target.closest('[data-act=add]')) {
        const tag = $('#shotTag', body).value;
        const files = await pickFile('image/*', true);
        if (!files.length) return;
        toast('處理中…');
        for (const f of files) {
          try {
            await idb.set('map:' + uid(''), { dataUrl: await readImage(f, 2000, 'image/jpeg', 0.85), name: f.name, tag, ts: Date.now() });
          } catch (err) { toast('有一張讀取失敗'); }
        }
        toast(`已存 ${files.length} 張`);
        return draw(body);
      }
      const fig = e.target.closest('figure[data-k]');
      if (!fig) return;
      const k = fig.dataset.k;
      const f = await idb.get(k);
      if (!f) return;
      openSheet(f.tag ? md(f.tag) : '截圖', `<img class="fc-img" src="${imgSrc(f.dataUrl)}" alt="" style="border-radius:12px;background:#fff">
        <div class="small muted" style="margin-top:6px">雙指可放大。</div>
        <div class="btn-row"><button class="btn" data-act="full">⛶ 全螢幕</button><button class="btn btn-danger" data-act="del">刪除</button></div>`, (b2, en2) => {
        b2.onclick = async ev => {
          const a = ev.target.closest('[data-act]');
          if (!a) return;
          if (a.dataset.act === 'full') openFullCard(() => `<img class="fc-img" src="${imgSrc(f.dataUrl)}" alt="">`);
          if (a.dataset.act === 'del' && await askConfirm('刪除這張截圖？', '刪除')) {
            await idb.del(k);
            closeSheet(en2);
            draw(body);
          }
        };
      });
    };
  });
}

async function offlinePrep() {
  toast('準備中…');
  const days = sortedDays();
  let ok = 0;
  const cache = store.get(K.wx, {});
  for (const d of days) {
    try {
      const { key, url } = wxRequest(d);
      cache[key] = { ts: Date.now(), json: await fetchJson(url) };
      ok++;
    } catch (e) { /* 單日失敗略過 */ }
  }
  store.set(K.wx, cache);
  await refreshRate(!getRate().locked);
  const img = await offlineImages(true);
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('precache');
  toast(`完成：天氣 ${ok}/${days.length} 天、主圖 ${img} 張`);
  renderOfflineStatus();
}

async function offlineImages(silent = false) {
  let n = 0, fail = 0;
  for (const d of trip.days) {
    if (!d.bg || d.bg.startsWith('idb:')) continue;
    try {
      const r = await fetch(d.bg, { mode: 'cors' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const blob = await r.blob();
      const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
      await idb.set('hero:' + d.id, { dataUrl, name: d.bg, ts: Date.now() });
      d.bg = 'idb:hero:' + d.id;
      n++;
    } catch (e) { fail++; }
  }
  if (n) saveTrip();
  if (!silent) toast(n || fail ? `離線化 ${n} 張${fail ? `，${fail} 張失敗（網站不允許，可改用相簿上傳）` : ''}` : '沒有需要離線化的網路圖片（插畫本來就離線可用）');
  if (!silent) renderOfflineStatus();
  return n;
}

/* 私人資料合併匯入：備份檔 mode=merge，或網址 #import=… */
async function mergeImport(data, label) {
  if (!data || typeof data !== 'object' || data.app !== APP_ID || data.mode !== 'merge') return toast('匯入資料格式不對');
  label = String(label || '私人預約資料').slice(0, 60);
  const ids = new Set(getList('res').map(r => r.id));
  const entries = Object.entries(data.res && typeof data.res === 'object' ? data.res : {})
    .filter(([k, v]) => ids.has(k) && v && typeof v === 'object');
  const contacts = Array.isArray(data.contacts) ? data.contacts.filter(c => c && typeof c.name === 'string' && typeof c.num === 'string') : [];
  if (!entries.length && !contacts.length) return toast('匯入資料裡沒有可用的內容');
  if (!(await askConfirm(`把「${label}」存進這支手機？\n共 ${entries.length} 筆預約的確認號與備註，只存在本機、不會上傳。`, '存進手機', false))) return;
  const all = store.get(K.res, {});
  for (const [k, v] of entries) {
    const o = {};
    if (typeof v.conf === 'string') o.conf = v.conf;
    if (typeof v.note === 'string') o.note = v.note;
    if (RES_STATUSES.includes(v.status)) o.status = v.status;
    all[k] = Object.assign(all[k] || {}, o);
  }
  store.set(K.res, all);
  if (contacts.length) {
    const list = store.get(K.contacts, []);
    contacts.forEach(c => { if (!list.some(x => x.num === c.num)) list.push({ id: uid('c'), name: c.name, num: c.num }); });
    store.set(K.contacts, list);
  }
  toast('已存進手機');
  RENDER[ui.view]();
}

/* 匯入碼＝網址 #import= 後面那段 base64url JSON；也接受整條網址 */
function decodeImportCode(text) {
  const m = /#import=([A-Za-z0-9_-]+)/.exec(text) || /^\s*([A-Za-z0-9_-]{20,})\s*$/.exec(text);
  if (!m) return null;
  try {
    const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))));
  } catch (e) { return null; }
}

function checkHashImport() {
  if (!location.hash.startsWith('#import=')) return;
  const data = decodeImportCode(location.hash);
  history.replaceState(null, '', location.pathname + location.search);
  if (!data) return toast('匯入連結格式不對');
  mergeImport(data, data.label || '私人預約資料');
}

  const data = { app: APP_ID, dataVer: DATA_VER, exportedAt: new Date().toISOString(), ls, files };
  download(`kobe-xmas-backup-${nowAt(8).date}.json`, JSON.stringify(data), 'application/json');

async function importBackup() {
  const [file] = await pickFile('application/json,.json');
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { return toast('檔案格式不對'); }
  if (data.mode === 'merge') return mergeImport(data, data.label || file.name);
  if (data.app !== APP_ID || !data.ls) return toast('這不是本 APP 的備份檔');
  if (!(await askConfirm(`匯入 ${String(data.exportedAt || '').slice(0, 10)} 的備份？目前手機上的資料會被覆蓋。`, '匯入'))) return;
  Object.keys(localStorage).filter(k => k.startsWith('ox26.')).forEach(k => localStorage.removeItem(k));
  Object.entries(data.ls).forEach(([k, v]) => { if (k.startsWith('ox26.')) localStorage.setItem(k, v); });
  await idb.clear().catch(() => {});
  for (const [k, v] of data.files || []) await idb.set(k, v);
  toast('匯入完成');
  setTimeout(() => location.reload(), 600);
}

  const d = store.get(K.disp, {});
  return { dark: !!d.dark, fs: [0, 1, 2].includes(d.fs) ? d.fs : 0 };
}
function applyDisp() {
  const d = getDisp();
  const root = document.documentElement;
  root.classList.toggle('dark', d.dark);
  root.classList.remove('fs-1', 'fs-2');
  if (d.fs) root.classList.add('fs-' + d.fs);
  $('meta[name="theme-color"]').setAttribute('content', d.dark ? '#0F172A' : '#EFF6FF');
}

/* =========================================================
   啟動
   ========================================================= */
function init() {
  applyDisp();
  const n = jstTripNow();
  const todayDay = trip.days.find(d => d.date === n.date);
  if (todayDay) ui.day = todayDay.id;
  if (!trip.days.some(d => d.id === ui.day)) ui.day = sortedDays()[0]?.id;
  $$('.tab').forEach(t => { t.onclick = () => { closeAllSheets(); switchView(t.dataset.view); }; });
  $('#nowFab').onclick = scrollToNow;
  $('#quickNav').onclick = e => {
    const b = e.target.closest('[data-jump]');
    if (b) document.getElementById(b.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  /* 點最上面的標題回到頁面最上方 */
  $('.topbar').addEventListener('click', e => { if (!e.target.closest('#quickNav')) window.scrollTo({ top: 0, behavior: 'smooth' }); });
  window.addEventListener('resize', setTopH);
  renderCountdown();
  updateTabDots();
  switchView(RENDER[ui.view] ? ui.view : 'trip');
  checkHashImport();
  window.addEventListener('hashchange', checkHashImport);
  setInterval(() => { renderCountdown(); updateTabDots(); refreshNowHighlight(); }, 60e3);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    renderCountdown();
    updateTabDots();
    refreshNowHighlight();
    if (wakeLock === null && $('.fullcard')) keepAwake(true);
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
init();
</script>
