<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AY's Shortened URL</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; margin: 0; padding: 30px 20px; }
    .box { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,.08); }
    h1 { text-align: center; }
    input { width: 100%; box-sizing: border-box; padding: 14px; margin: 8px 0 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #222; color: white; font-size: 16px; cursor: pointer; }
    button:hover { background: #444; }
    #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 10px; word-break: break-all; display: none; }
  </style>
</head>
<body>

<div class="box">
  <h1>🔗 AY's Shortened URL</h1>
  <label>【 原始網址 】</label>
  <input id="longUrl" placeholder="請貼上連結 (例如：https://www.google.com/)">
  <label>【 自訂代碼 】</label>
  <input id="code" placeholder="例如：12345">
  <button onclick="createUrl()">產生</button>
  <div id="result"></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycby9ngTy00VPXNN5cBiZkR-NeYEBS9JSNee-_eKWU9OEQ9Zxw0NX5ZIca6zrqdYNcv3Dvg/exec";

  async function createUrl() {
    const longUrl = document.getElementById("longUrl").value.trim();
    const code = document.getElementById("code").value.trim();
    const result = document.getElementById("result");

    if (!longUrl || !code) {
      alert("請填寫完整！");
      return;
    }

    result.style.display = "block";
    result.innerHTML = "正在儲存並產生短網址，請稍候...";

    try {
      const res = await fetch(`${API_URL}?action=set&code=${encodeURIComponent(code)}&url=${encodeURIComponent(longUrl)}`);
      const data = await res.json();

      if (data.status === "success") {
        const shortUrl = "https://aymathx.github.io/" + code;
        result.innerHTML =
          "你的短網址：<br><br>" +
          "<strong><a href='" + shortUrl + "' target='_blank'>" + shortUrl + "</a></strong>";
      } else {
        result.innerHTML = "<span style='color:red;'>儲存失敗，請重試！</span>";
      }
    } catch (err) {
      result.innerHTML = "<span style='color:red;'>連線錯誤，請確認 GAS API 設定！</span>";
    }
  }
</script>

</body>
</html>
