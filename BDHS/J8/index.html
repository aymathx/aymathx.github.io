<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=5">

<title>數學特工隊｜分配律 50 題</title>

<style>

/* =========================================================
   基本設定
========================================================= */

*{
  box-sizing:border-box;
}

html{
  width:100%;
  min-height:100%;
}

body{
  margin:0;
  width:100%;
  min-height:100vh;

  background:#f4f2ed;
  color:#20242b;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

  overflow-x:hidden;
}


/* =========================================================
   外框
========================================================= */

.wrap{
  width:100%;
  max-width:1600px;

  min-height:100vh;

  margin:0 auto;
  padding:18px;
}

.hero{
  width:100%;
  min-height:calc(100vh - 36px);

  background:#20242b;
  color:#fff;

  border-radius:30px;

  padding:
    clamp(22px,3vw,42px);

  display:flex;
  flex-direction:column;

  overflow:hidden;
}


/* =========================================================
   標題
========================================================= */

.header{
  position:relative;

  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:20px;

  margin-bottom:22px;
}

.tag{
  font-size:clamp(12px,1.2vw,20px);
  letter-spacing:4px;

  color:#bfc1c4;

  line-height:1;

  margin-bottom:10px;
}

h1{
  margin:0;

  font-size:clamp(42px,5vw,78px);

  line-height:1;

  font-weight:950;

  letter-spacing:-2px;
}

.restart-top{
  flex-shrink:0;

  border:0;

  background:#fff;
  color:#20242b;

  border-radius:999px;

  padding:
    15px 28px;

  min-height:56px;

  font-size:clamp(16px,1.4vw,23px);

  font-weight:900;

  cursor:pointer;

  transition:.15s;
}

.restart-top:hover{
  transform:translateY(-2px);
}


/* =========================================================
   六格成績區
========================================================= */

.scoreboard{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(6,minmax(0,1fr));

  gap:14px;

  margin-bottom:24px;
}

.score-card{
  min-width:0;

  background:#fff;
  color:#20242b;

  border-radius:18px;

  min-height:112px;

  padding:14px 10px;

  text-align:center;

  border:3px solid transparent;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

.score-card.active{
  border-color:#20242b;

  box-shadow:
    inset 0 0 0 3px #fff;
}

.score-card.total{
  background:#e8e2d8;
}

.score-card .label{
  font-size:clamp(12px,1.25vw,19px);

  font-weight:900;

  letter-spacing:1px;

  opacity:.68;

  white-space:nowrap;
}

.score-card .value{
  font-size:clamp(27px,2.8vw,48px);

  font-weight:950;

  line-height:1;

  margin-top:7px;

  white-space:nowrap;
}

.score-card .value span{
  font-size:clamp(13px,1.3vw,21px);

  font-weight:800;

  opacity:.65;
}


/* =========================================================
   遊戲主區
========================================================= */

.game{
  flex:1;

  min-width:0;

  background:#fff;
  color:#20242b;

  border-radius:26px;

  padding:
    clamp(20px,2.5vw,38px);

  border:3px solid #20242b;

  box-shadow:
    0 8px 30px #00000010;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}


/* =========================================================
   選擇關卡標題
========================================================= */

.game-header{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:18px;
}

.game-title{
  font-size:clamp(24px,2.2vw,36px);

  font-weight:950;

  margin:0;
}

.auto-save{
  flex-shrink:0;

  background:#e9e3d8;

  color:#20242b;

  padding:
    9px 16px;

  border-radius:999px;

  font-size:clamp(12px,1vw,16px);

  font-weight:900;

  white-space:nowrap;
}


/* =========================================================
   姓名輸入
========================================================= */

.name-row{
  display:flex;

  align-items:center;

  gap:15px;

  width:100%;

  margin-bottom:18px;
}

.name-input{
  flex:1;

  min-width:0;

  height:68px;

  border:4px solid #e3ded4;

  border-radius:18px;

  padding:
    0 24px;

  font-size:clamp(18px,2vw,28px);

  font-weight:800;

  color:#20242b;

  outline:none;

  background:#fff;
}

.name-input:focus{
  border-color:#20242b;
}

.name-input::placeholder{
  color:#a8a8a8;
}


/* =========================================================
   LEVEL 按鈕
========================================================= */

.level-select{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(5,minmax(0,1fr));

  gap:12px;

  margin-bottom:20px;
}

.level-select button{
  min-width:0;

  min-height:82px;

  border:0;

  border-radius:18px;

  background:#e8e2d8;

  color:#20242b;

  padding:10px;

  font-size:clamp(16px,1.5vw,24px);

  font-weight:950;

  line-height:1.2;

  cursor:pointer;

  transition:.15s;

  overflow:hidden;
}

.level-select button small{
  display:block;

  margin-top:7px;

  font-size:clamp(11px,1vw,16px);

  font-weight:800;

  opacity:.72;
}

.level-select button:hover{
  transform:translateY(-2px);
}

.level-select button.active{
  background:#20242b;

  color:#fff;
}


/* =========================================================
   上方資訊
========================================================= */

.top{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:8px;
}

.badge{
  background:#e9e3d8;

  padding:
    8px 16px;

  border-radius:999px;

  font-size:clamp(13px,1.1vw,18px);

  font-weight:900;

  white-space:nowrap;
}


/* =========================================================
   進度條
========================================================= */

.progress{
  width:100%;

  height:9px;

  background:#e3ded4;

  border-radius:999px;

  overflow:hidden;

  margin-bottom:15px;
}

#bar{
  width:0%;

  height:100%;

  background:#20242b;

  border-radius:999px;

  transition:.3s;
}


/* =========================================================
   題目
========================================================= */

.question{
  width:100%;

  min-height:100px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  font-size:clamp(34px,5vw,72px);

  font-weight:950;

  line-height:1.15;

  padding:
    10px 10px;

  margin:
    4px 0 18px;

  overflow-wrap:anywhere;
}


/* =========================================================
   四個答案
   ★ 電腦固定 2 × 2
========================================================= */

.choices{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:14px;

  margin-top:auto;
}

.choice{
  width:100%;

  min-width:0;

  min-height:76px;

  border:0;

  border-radius:17px;

  padding:
    12px 18px;

  background:#e8e2d8;

  color:#20242b;

  cursor:pointer;

  display:flex;

  align-items:center;

  text-align:left;

  font-size:clamp(16px,1.45vw,24px);

  font-weight:900;

  line-height:1.25;

  transition:.15s;

  overflow:hidden;
}

.choice:hover{
  transform:translateY(-2px);
}

.choice.correct{
  background:#cfe8d5 !important;
}

.choice.wrong{
  background:#f0c8c8 !important;
}


/* =========================================================
   A B C D 圓形標籤
========================================================= */

.option-label{
  flex-shrink:0;

  width:44px;
  height:44px;

  margin-right:14px;

  border-radius:50%;

  background:#20242b;

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:18px;

  font-weight:950;
}

.choice.correct .option-label{
  background:#2e6b3f;
}

.choice.wrong .option-label{
  background:#8a3434;
}

.option-text{
  min-width:0;

  flex:1;

  text-align:center;

  overflow-wrap:anywhere;

  word-break:break-word;
}


/* =========================================================
   答題回饋
========================================================= */

.status{
  width:100%;

  min-height:42px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  line-height:1.5;

  font-weight:800;

  font-size:clamp(13px,1.15vw,18px);

  margin:
    12px 0 4px;
}

.score{
  width:100%;

  min-height:28px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  font-size:clamp(13px,1.15vw,18px);

  font-weight:900;
}


/* =========================================================
   完成畫面
========================================================= */

.finish-box{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;
}

.finish-box button{
  min-height:62px;

  border:0;

  border-radius:15px;

  background:#e8e2d8;

  color:#20242b;

  font-size:18px;

  font-weight:900;

  cursor:pointer;
}

.finish-box button:hover{
  transform:translateY(-2px);
}


/* =========================================================
   平板
========================================================= */

@media(max-width:900px){

  .wrap{
    padding:10px;
  }

  .hero{
    min-height:calc(100vh - 20px);

    border-radius:22px;

    padding:18px;
  }

  .scoreboard{
    gap:7px;
  }

  .score-card{
    min-height:82px;

    border-radius:13px;

    padding:8px 3px;
  }

  .game{
    border-radius:20px;

    padding:18px;
  }

  .level-select{
    gap:7px;
  }

  .level-select button{
    min-height:66px;

    border-radius:13px;
  }

  .question{
    min-height:90px;
  }

}


/* =========================================================
   手機
========================================================= */

@media(max-width:650px){

  body{
    background:#20242b;
  }

  .wrap{
    padding:6px;
  }

  .hero{
    min-height:calc(100vh - 12px);

    border-radius:17px;

    padding:11px;

    overflow:visible;
  }

  .header{
    align-items:center;

    margin-bottom:12px;
  }

  .tag{
    font-size:9px;

    letter-spacing:2px;

    margin-bottom:5px;
  }

  h1{
    font-size:32px;

    letter-spacing:-1px;
  }

  .restart-top{
    min-height:44px;

    padding:9px 14px;

    font-size:14px;
  }


  /* 六格成績 */

  .scoreboard{
    grid-template-columns:
      repeat(6,minmax(0,1fr));

    gap:4px;

    margin-bottom:10px;
  }

  .score-card{
    min-height:57px;

    border-radius:9px;

    padding:5px 1px;

    border-width:2px;
  }

  .score-card .label{
    font-size:8px;

    letter-spacing:0;
  }

  .score-card .value{
    font-size:18px;

    margin-top:3px;
  }

  .score-card .value span{
    font-size:8px;
  }


  /* 遊戲 */

  .game{
    border-radius:17px;

    padding:10px;

    border-width:2px;
  }

  .game-header{
    margin-bottom:9px;
  }

  .game-title{
    font-size:20px;
  }

  .auto-save{
    padding:5px 8px;

    font-size:9px;
  }


  /* 姓名 */

  .name-row{
    gap:6px;

    margin-bottom:8px;
  }

  .name-input{
    height:47px;

    border-width:3px;

    border-radius:12px;

    padding:0 13px;

    font-size:15px;
  }


  /* Level */

  .level-select{
    gap:4px;

    margin-bottom:9px;
  }

  .level-select button{
    min-height:54px;

    border-radius:10px;

    padding:5px 2px;

    font-size:11px;
  }

  .level-select button small{
    margin-top:4px;

    font-size:8px;
  }


  /* Badge */

  .top{
    margin-bottom:5px;
  }

  .badge{
    padding:5px 9px;

    font-size:10px;
  }

  .progress{
    height:7px;

    margin-bottom:7px;
  }


  /* 題目 */

  .question{
    min-height:72px;

    font-size:34px;

    padding:8px 4px;

    margin:2px 0 9px;
  }


  /* ★ 手機改成單欄 */

  .choices{
    grid-template-columns:1fr;

    gap:7px;
  }

  .choice{
    min-height:53px;

    border-radius:11px;

    padding:7px 10px;

    font-size:14px;
  }

  .option-label{
    width:34px;
    height:34px;

    margin-right:9px;

    font-size:14px;
  }

  .status{
    min-height:35px;

    font-size:11px;

    margin:6px 2px 1px;
  }

  .score{
    min-height:21px;

    font-size:11px;
  }

  .finish-box{
    grid-template-columns:1fr;
  }

}


/* =========================================================
   超小手機
========================================================= */

@media(max-width:390px){

  h1{
    font-size:28px;
  }

  .restart-top{
    padding:8px 10px;

    font-size:12px;
  }

  .question{
    font-size:30px;
  }

  .choice{
    min-height:49px;

    font-size:13px;
  }

  .option-label{
    width:31px;
    height:31px;

    margin-right:7px;
  }

}


/* =========================================================
   防止瀏覽器縮放後出現橫向跑版
========================================================= */

img,
button,
input{
  max-width:100%;
}

</style>
</head>


<body>

<div class="wrap">

<section class="hero">

  <!-- =====================================================
       標題
  ====================================================== -->

  <header class="header">

    <div>
      <div class="tag">
        GRADE 8 · FORMATIVE ASSESSMENT
      </div>

      <h1>
        數學特工隊 🕵️‍♂️
      </h1>
    </div>

    <button
      class="restart-top"
      onclick="restartAll()">
      ↻ 重新開始
    </button>

  </header>


  <!-- =====================================================
       成績區
  ====================================================== -->

  <div class="scoreboard">

    <div class="score-card" id="scoreCard1">
      <div class="label">LEVEL 1</div>
      <div class="value" id="score1">
        0<span> / 20</span>
      </div>
    </div>

    <div class="score-card" id="scoreCard2">
      <div class="label">LEVEL 2</div>
      <div class="value" id="score2">
        0<span> / 20</span>
      </div>
    </div>

    <div class="score-card" id="scoreCard3">
      <div class="label">LEVEL 3</div>
      <div class="value" id="score3">
        0<span> / 20</span>
      </div>
    </div>

    <div class="score-card" id="scoreCard4">
      <div class="label">LEVEL 4</div>
      <div class="value" id="score4">
        0<span> / 20</span>
      </div>
    </div>

    <div class="score-card" id="scoreCard5">
      <div class="label">LEVEL 5</div>
      <div class="value" id="score5">
        0<span> / 20</span>
      </div>
    </div>

    <div class="score-card total">
      <div class="label">🏆 總分</div>
      <div class="value" id="totalScore">
        0<span> / 100</span>
      </div>
    </div>

  </div>


  <!-- =====================================================
       遊戲區
  ====================================================== -->

  <section class="game">

    <div class="game-header">

      <div class="game-title">
        🎮 選擇關卡
      </div>

      <div class="auto-save">
        ✓ 已自動記錄
      </div>

    </div>


    <!-- 姓名 -->

    <div class="name-row">

      <input
        id="studentName"
        class="name-input"
        type="text"
        maxlength="20"
        placeholder="請輸入姓名（成績分享需要）"
        autocomplete="off">

    </div>


    <!-- LEVEL -->

    <div
      class="level-select"
      id="levelSelect">

      <button onclick="chooseLevel(1)">
        LEVEL 1
        <small>10 題 · 20 分</small>
      </button>

      <button onclick="chooseLevel(2)">
        LEVEL 2
        <small>10 題 · 20 分</small>
      </button>

      <button onclick="chooseLevel(3)">
        LEVEL 3
        <small>10 題 · 20 分</small>
      </button>

      <button onclick="chooseLevel(4)">
        LEVEL 4
        <small>10 題 · 20 分</small>
      </button>

      <button onclick="chooseLevel(5)">
        LEVEL 5
        <small>10 題 · 20 分</small>
      </button>

    </div>


    <!-- 上方資訊 -->

    <div class="top">

      <span
        class="badge"
        id="lv">
        尚未選擇
      </span>

      <span
        class="badge"
        id="num">
        請選擇 Level
      </span>

    </div>


    <!-- 進度 -->

    <div class="progress">
      <div id="bar"></div>
    </div>


    <!-- 題目 -->

    <div
      class="question"
      id="q">

      選擇一個 LEVEL 開始任務

    </div>


    <!-- 答案 -->

    <div
      class="choices"
      id="c">
    </div>


    <!-- 回饋 -->

    <div
      class="status"
      id="s">
    </div>


    <!-- 成績 -->

    <div
      class="score"
      id="sc">
    </div>

  </section>

</section>

</div>


<script>

/* =========================================================
   題庫

   難度安排：

   LEVEL 1
   → 原難度 1～2

   LEVEL 2
   → 原難度 3～4

   LEVEL 3
   → 原難度 5～6

   LEVEL 4
   → 原難度 7～8

   LEVEL 5
   → 原難度 9～10

   每個 LEVEL 固定 10 題
========================================================= */

const data = [

/* =========================================================
   LEVEL 1｜基礎
========================================================= */

{
  q:"12 × 7",
  c:[
    "(10＋2) × 7",
    "10 × 7＋2",
    "12＋7",
    "12 × 7＋2"
  ],
  a:0,
  n:"12＝10＋2，所以 12×7＝(10＋2)×7。",
  lv:1
},

{
  q:"19 × 6",
  c:[
    "20 × 6－6",
    "20 × 6＋6",
    "19＋6",
    "(20－1)＋6"
  ],
  a:0,
  n:"19＝20－1，所以可以利用分配律。",
  lv:1
},

{
  q:"31 × 8",

    "30 × 8＋8",
    "30 × 8－8",
    "31＋8",
    "30 × 8＋31"
  ],
  a:0,
  n:"31＝30＋1，所以 31×8＝30×8＋8。",
  lv:1
},

{
  q:"49 × 7",
  c:[
    "50 × 7－7",
    "50 × 7＋7",
    "49＋7",
    "50 × 7－1"
  ],
  a:0,
  n:"49＝50－1，所以 49×7＝50×7－7。",
  lv:1
},

{
  q:"47 × 11",
  c:[
    "47 × (10＋1)",
    "47 × 10＋1",
    "40 × 11＋7",
    "50 × 11－3"
  ],
  a:0,
  n:"11＝10＋1，可以直接利用分配律。",
  lv:1
},

{
  q:"25 × 18",

    "25 × (20－2)",
    "25 × 20－2",
    "(25－2) × 20",
    "25 × 20＋2"
  ],
  a:0,
  n:"18＝20－2。",
  lv:1
},

{
  q:"39 × 12",
  c:[
    "39 × (10＋2)",
    "40 × 12－12",
    "39 × 10＋2",
    "(40－1) × 10"
  ],
  a:0,
  n:"12＝10＋2，所以 39×12＝39×10＋39×2。",
  lv:1
},

{
  q:"61 × 19",
  c:[
    "61 × (20－1)",
    "60 × 19＋1",
    "61 × 20－1",
    "60 × 20＋19"
  ],
  a:0,
  n:"19＝20－1。",
  lv:1
},

{
  q:"97 × 8",
  c:[
    "(100－3) × 8",
    "100 × 8－3",
    "(100－3) × 8＋3",
    "97 × (10－2)"
  ],
  a:0,
  n:"97＝100－3。",
  lv:1
},

{
  q:"103 × 7",
  c:[
    "(100＋3) × 7",
    "100 × 7＋3",
    "103 × (5＋2)",
    "100 × 7－3"
  ],
  a:0,
  n:"103＝100＋3。",
  lv:1
},


/* =========================================================
   LEVEL 2｜進階
========================================================= */

{
  q:"398 × 7",
  c:[
    "(400－2) × 7",
    "400 × 7－2",
    "(400＋2) × 7",
    "398 × (5＋2)"
  ],
  a:0,
  n:"398＝400－2。",
  lv:2
},

{
  q:"602 × 8",
  c:[
    "(600＋2) × 8",
    "600 × 8＋2",
    "(600－2) × 8",
    "602 × (10－2)"

/* =========================================================
   Fisher-Yates 洗牌
========================================================= */

function shuffle(array){

  const arr =
    [...array];

  for(
    let i=arr.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      arr[i],
      arr[j]
    ]=[
      arr[j],
      arr[i]
    ];

  }

  return arr;

}


/* =========================================================
   建立隨機選項
========================================================= */

function createChoices(question){

  /*
    把原本的答案資料轉成：

    {
      text:"...",
      correct:true / false
    }

    然後洗牌。

    因此每次重新開始，
    A～D 的位置都會重新排列。
  */

  const options =
    question.c.map(
      (text,index)=>({

        text:text,

        correct:
          index===question.a

      })
    );

  return shuffle(options);

}


/* =========================================================
   更新成績
========================================================= */

  let total = 0;

  for(
    let lv=1;
    lv<=5;
    lv++
  ){

    document.getElementById(
      "score"+lv
    ).innerHTML =
      `${levelScores[lv]}<span> / 20</span>`;

    total +=
      levelScores[lv];

  }

  document.getElementById(
    "totalScore"
  ).innerHTML =
    `${total}<span> / 100</span>`;

}


/* =========================================================
   選擇 LEVEL
========================================================= */

function chooseLevel(level){

  currentLevel =
    level;

  [startQ,endQ] =
    ranges[level];

  currentIndex =
    startQ;

  lock =
    false;


  /*
    LEVEL 按鈕 active
  */

  document
    .querySelectorAll(
      "#levelSelect button"
    )
    .forEach(
      (button,index)=>{

        button.classList.toggle(
          "active",
          index===level-1
        );

      }
    );


  /*
    成績卡 active
  */

  document
    .querySelectorAll(
      ".score-card"
    )
    .forEach(
      card=>
        card.classList.remove(
          "active"
        )
    );

  document
    .getElementById(
      "scoreCard"+level
    )
    .classList.add(
      "active"
    );


  /*
    顯示資訊
  */

  lvEl.textContent =
    "LEVEL "+level;

  numEl.textContent =
    `第 1 / 10 題`;

  barEl.style.width =
    "0%";

  sEl.textContent =
    "";

  scEl.textContent =
    `本 Level：${levelScores[level]} / 20 分・已作答 ${levelAnswered[level]} / 10 題`;


  /*
    尚未開始
  */

  qEl.textContent =
    `準備挑戰 LEVEL ${level}`;

  cEl.innerHTML = `

    <button
      class="choice"
      onclick="startLevel()">

      <span
        class="option-label">
        ▶
      </span>

      <span
        class="option-text">
        開始 LEVEL ${level} 🚀
      </span>

    </button>

  `;

}


/* =========================================================
   開始 LEVEL
========================================================= */

function startLevel(){

  currentIndex =
    startQ;

  lock =
    false;

  showQuestion();

}


/* =========================================================
   顯示題目
========================================================= */

function showQuestion(){

  lock =
    false;


  const question =
    data[currentIndex];


  /*
    每一次顯示題目，
    都重新洗牌選項。

    所以：

    第一次玩
    A B C D

    重玩
    會變成另一種順序。

    同一題也會重新排列。
  */

  const options =
    createChoices(question);


  /*
    題號
  */

  const questionNumber =
    currentIndex-startQ+1;


  lvEl.textContent =
    "LEVEL "+currentLevel;

  numEl.textContent =
    `第 ${questionNumber} / 10 題`;


  /*
    進度條
  */

  barEl.style.width =
    (
      (questionNumber-1)/10*100
    )+"%";


  /*
    題目
  */

  qEl.textContent =
    question.q;


  /*
    答案 A～D
  */

  const letters =
    ["A","B","C","D"];


  cEl.innerHTML =
    options.map(
      (option,index)=>`

        <button
          class="choice"
          onclick="answerQuestion(${index})">

          <span
            class="option-label">

            ${letters[index]}

          </span>

          <span
            class="option-text">

            ${option.text}

          </span>

        </button>

      `
    ).join("");


  /*
    清除回饋
  */

  sEl.textContent =
    "";


  scEl.textContent =
    `本 Level：${levelScores[currentLevel]} / 20 分・已作答 ${levelAnswered[currentLevel]} / 10 題`;

}


/* =========================================================
   作答
========================================================= */

function answerQuestion(selectedIndex){

  if(lock){
    return;
  }

  lock =
    true;


  const question =
    data[currentIndex];


  /*
    重新取得目前畫面上的選項。

    這裡不能直接使用原本的 a，
    因為答案已經被洗牌。
  */

  const buttons =
    document.querySelectorAll(
      ".choice"
    );


  /*
    從按鈕的文字取得答案狀態。

    showQuestion 時，
    我們重新產生一次選項。
  */

  const options =
    [...buttons].map(
      button=>button
    );


  /*
    取得目前題目的答案順序。

    因為 createChoices 每次只建立一次，
    因此這裡重新依照按鈕文字比對原始答案。
  */

  const selectedText =
    buttons[selectedIndex]
      .querySelector(".option-text")
      .textContent
      .trim();


  const correctText =
    question.c[
      question.a
    ];


  const isCorrect =
    selectedText === correctText;


  /*
    選中的按鈕
  */

  buttons[selectedIndex]
    .classList.add(
      isCorrect
        ? "correct"
        : "wrong"
    );


  /*
    找出真正答案
  */

  let correctButton =
    null;

  buttons.forEach(button=>{

    const text =
      button
        .querySelector(".option-text")
        .textContent
        .trim();

    if(
      text === correctText
    ){

      correctButton =
        button;

    }

  });


  /*
    答對
  */

  if(isCorrect){

    levelScores[currentLevel] += 2;

    sEl.innerHTML =
      `✅ 答對！ ${question.n}<br>本題 <strong>2 分</strong>。`;

  }


  /*
    答錯
  */

  else{

    if(correctButton){

      correctButton
        .classList
        .add("correct");

    }

    sEl.innerHTML =
      `❌ 答案揭曉：${question.n}`;

  }


  /*
    作答數 +1
  */

  levelAnswered[currentLevel]++;


  /*
    更新成績
  */

  updateScoreboard();


  scEl.textContent =
    `本 Level：${levelScores[currentLevel]} / 20 分・已作答 ${levelAnswered[currentLevel]} / 10 題`;


  /*
    儲存目前成績
  */

  saveProgress();


  /*
    延遲進入下一題
  */

  setTimeout(()=>{

    currentIndex++;

    if(
      currentIndex < endQ
    ){

      showQuestion();

    }

    else{

      finishLevel();

    }

  },1800);

}


/* =========================================================
   完成 LEVEL
========================================================= */

function finishLevel(){

  barEl.style.width =
    "100%";


  lvEl.textContent =
    `LEVEL ${currentLevel} 完成`;

  numEl.textContent =
    "10 / 10 題";


  qEl.textContent =
    `🎉 LEVEL ${currentLevel} 挑戰完成！`;


  const total =
    Object
      .values(levelScores)
      .reduce(
        (sum,value)=>
          sum+value,
        0
      );


  /*
    如果不是最後一關
  */

  let nextButton = "";

  if(currentLevel < 5){

    nextButton = `

      <button
        onclick="nextLevel()">

        ➡️ 前往 LEVEL ${currentLevel+1}

      </button>

    `;

  }


  cEl.innerHTML = `

    <div
      class="finish-box">

      <button
        onclick="startLevel()">

        🔁 重玩 LEVEL ${currentLevel}

      </button>

      ${nextButton}

    </div>

  `;


  sEl.innerHTML = `

    本 Level 得分：
    <strong>
      ${levelScores[currentLevel]} / 20 分
    </strong>

    <br>

    目前總分：
    <strong>
      ${total} / 100 分
    </strong>

  `;


  scEl.textContent =
    "每題 2 分・本 Level 共 10 題・滿分 20 分";


  saveProgress();

}


/* =========================================================
   下一 LEVEL
========================================================= */

function nextLevel(){

  if(currentLevel < 5){

    chooseLevel(
      currentLevel+1
    );

  }

}


/* =========================================================
   儲存成績
========================================================= */

function saveProgress(){

  const total =
    Object
      .values(levelScores)
      .reduce(
        (sum,value)=>
          sum+value,
        0
      );


  const record = {

    name:
      nameEl.value.trim(),

    levelScores:{
      ...levelScores
    },

    levelAnswered:{
      ...levelAnswered
    },

    total:
      total,

    updatedAt:
      new Date().toISOString()

  };


  localStorage.setItem(
    "mathAgentProgress",
    JSON.stringify(record)
  );

}

   重新開始全部測驗
========================================================= */

function restartAll(){

  const confirmed =
    confirm(
      "確定要重新開始嗎？\n目前成績將歸零。"
    );

  if(!confirmed){

    return;

  }


  /*
    清除分數
  */

  for(
    let lv=1;
    lv<=5;
    lv++
  ){

    levelScores[lv] =
      0;

    levelAnswered[lv] =
      0;

  }


  /*
    清除暫存成績
  */

  localStorage.removeItem(
    "mathAgentProgress"
  );


  /*
    更新畫面
  */

  updateScoreboard();


  document
    .querySelectorAll(
      ".score-card"
    )
    .forEach(
      card=>
        card.classList.remove(
          "active"
        )
    );

  document
    .querySelectorAll(
      "#levelSelect button"
    )
    .forEach(
      button=>
        button.classList.remove(
          "active"
        )
    );


  currentLevel =
    0;

  currentIndex =
    0;

  startQ =
    0;

  endQ =
    0;


  lvEl.textContent =
    "尚未選擇";

  numEl.textContent =
    "請選擇 Level";

  barEl.style.width =
    "0%";

  qEl.textContent =
    "選擇一個 LEVEL 開始任務";

  cEl.innerHTML =
    "";

  sEl.textContent =
    "";

  scEl.textContent =
    "";

}


/* =========================================================
   初始化
========================================================= */

updateScoreboard();

</script>

</body>
</html>
