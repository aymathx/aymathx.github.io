  "20261004課堂影片": ""
};

// 取得網址路徑中的代碼
const code = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "");

function renderNotFound() {
  document.body.innerHTML = `
    <h2>找不到這個短網址</h2>
    <p>請確認網址是否輸入正確。</p>
  `;
}

if (!code) {
  renderNotFound();
} else if (links[code]) {
  // 1. 如果原本的 links 裡面有，秒速直接跳轉
  window.location.replace(links[code]);
} else {
  // 2. 如果原本清單沒有，顯示提示並向 Google 試算表查詢
  document.body.innerHTML = `<h2>短網址轉址中，請稍候...</h2>`;

  fetch(`${API_URL}?action=get&code=${encodeURIComponent(code)}`)
    .then(res => res.json())
    .then(data => {
      if (data.status === "success" && data.url) {
        // 在試算表查到了，自動跳轉！
        window.location.replace(data.url);
      } else {
        renderNotFound();
      }
    })
    .catch(() => {
      document.body.innerHTML = `
        <h2>連線失敗</h2>
        <p>無法連線至短網址資料庫，請稍後再試。</p>
      `;
    });
}
</script>
