<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>區間計算器</title>
<style>
    /* 全域顏色與深色主題設定 */
    :root {
        --bg-color: #040508;    
        --card-bg: #131722;     
        --text-main: #ffffff;   
        --text-muted: #a4b1c6;  
        
        --red: #ff3b5c;         
        --green: #00e676;       
        --blue: #339af0;        
        
        --btn-blue: #1c68f3;    
        --border: #2c354a;      
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 8px; 
        box-sizing: border-box;
        
        height: 100vh; 
        height: 100dvh; 
        overflow: hidden; 
        
        display: flex;
        justify-content: center;
    }
    .container {
        max-width: 1200px;
        width: 100%;
        height: 100%; 
        display: flex;
        flex-direction: column;
    }
    
    /* 輸入區塊樣式 */
    .input-group {
        background-color: var(--card-bg);
        border: 1px solid var(--border); 
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 8px; 
        flex: 0 0 auto; 
        display: flex;
        gap: 15px;
        box-sizing: border-box;
        align-items: flex-end;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); 
    }
    .input-field {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .input-field label {
        color: var(--text-muted);
        font-size: 13px;
        font-weight: bold;
        text-align: center;
        letter-spacing: 0.5px;
    }
    .input-field input {
        background-color: #07090e; 
        border: 1px solid var(--border);
        color: white;
        padding: 8px;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        font-weight: bold;
        transition: 0.2s;
    }
    .input-field input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 5px rgba(51, 154, 240, 0.3);
    }
    button {
        background-color: var(--btn-blue);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        height: 40px;
        padding: 0 25px;
        transition: 0.2s;
        font-weight: bold;
        letter-spacing: 1px;
    }
    button:hover {
        background-color: #0b57e6;
    }

    /* 輸出圖表樣式 */
    #output {
        flex: 1 1 auto; 
        min-height: 0; 
        display: grid;
        grid-template-columns: 3fr 1fr; 
        gap: 10px;
    }
    .left-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr); 
        gap: 10px;
        height: 100%;
    }
    .right-group {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    
    /* 基本卡片與各表格專屬背景色 */
    .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border); 
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); 
        border-radius: 10px;
        padding: 6px 0; 
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        flex: 1; 
        min-height: 0;
    }
    
    .card-ubridge {
        background-color: rgba(41, 121, 255, 0.08) !important; 
        border-color: rgba(41, 121, 255, 0.25);
    }
    .card-dbridge {
        background-color: rgba(170, 0, 255, 0.08) !important; 
        border-color: rgba(170, 0, 255, 0.25);
    }
    .card-fib {
        background-color: rgba(255, 255, 255, 0.04) !important; 
        border-color: rgba(255, 255, 255, 0.15);
    }

    .card-title {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 4px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
        text-align: center;
        font-weight: bold;
        width: 80%; 
        margin-left: auto;
        margin-right: auto;
        flex: 0 0 auto;
        letter-spacing: 0.5px;
    }
    
    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 85%; 
        margin: 0 auto;
        border-bottom: 1px solid var(--border);
        flex: 1; 
        min-height: 0;
    }
    .row:last-child {
        border-bottom: none;
    }
    
    .row-mid-bg {
        background-color: rgba(255, 215, 0, 0.15); 
        border-radius: 6px;
        padding: 0 10px; 
        width: 88%; 
        border-bottom: 1px solid transparent; 
        box-sizing: border-box;
    }

    .row-centered {
        justify-content: center;
    }
    .col-val-center {
        font-size: 16px;
        font-weight: bold;
        color: var(--text-main);
        letter-spacing: 0.5px;
    }
    
    .col-label {
        font-weight: bold;
        font-size: 13px;
        letter-spacing: 0.5px;
    }
    .col-val {
        text-align: right;
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 0.5px;
        color: var(--text-main);
    }

    /* 狀態高亮顏色 (螢光感) */
    .text-red { color: var(--red); text-shadow: 0 0 8px rgba(255, 59, 92, 0.3); }
    .text-green { color: var(--green); text-shadow: 0 0 8px rgba(0, 230, 118, 0.3); }
    .text-blue { color: var(--blue); text-shadow: 0 0 8px rgba(51, 154, 240, 0.3); }

    /* --- 手機版最佳化 --- */
    @media (max-width: 768px) {
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }
        .input-group .input-field:nth-child(1) { grid-column: 1 / 2; grid-row: 1 / 2; }
        .input-group .input-field:nth-child(2) { grid-column: 1 / 2; grid-row: 2 / 3; }
        .input-group button {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            width: 100%;
            height: 100%;
            font-size: 19px;
        }
        
        #output {
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
        }
        .left-group {
            display: flex;
            flex-direction: column;
            gap: 8px; 
        }
        
        .card-title { font-size: 12px; }
        .col-label { font-size: 12px; }
        .col-val { font-size: 14px; }
        .col-val-center { font-size: 15px; }
        .input-field input { font-size: 15px; padding: 6px; }
    }

    @media (max-width: 400px) {
        .input-group { gap: 8px; padding: 10px; }
        #output { gap: 6px; }
        .left-group { gap: 6px; }
        .card { padding: 4px 0; border-radius: 8px; }
        .col-label { font-size: 11px; }
        .col-val { font-size: 13px; }
        .col-val-center { font-size: 14px; }
        .input-field label { font-size: 12px; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="input-group">
        <div class="input-field">
            <label>Max</label>
            <input type="number" id="maxVal" value="49243">
        </div>
        <div class="input-field">
            <label>Min</label>
            <input type="number" id="minVal" value="39438">
        </div>
        <button onclick="calculate()">計算</button>
    </div>

    <div id="output"></div>
</div>

<script>
    // ★ 更新：判斷如果沒有標籤 (label) 且有中線 (isMid)，也要讓它變成跨欄置中的黃色區塊
    function createRow(label, val, type, isMid = false) {
        // 先決定基礎的 row class
        let rowClass = isMid ? "row row-mid-bg" : "row";

        // 若沒有傳入 label，代表要將數字置中
        if (!label) {
            rowClass += " row-centered"; // 加上置中對齊的屬性
            return `
            <div class="${rowClass}">
                <div class="col-val-center">${val}</div>
            </div>`;
        }

        let colorClass = '';
        if (type === 'up') colorClass = 'text-red';
        if (type === 'down') colorClass = 'text-green';
        if (type === 'mid') colorClass = 'text-blue';

        return `
        <div class="${rowClass}">
            <div class="col-label ${colorClass}">${label}</div>
            <div class="col-val">${val}</div>
        </div>`;
    }

    function createCard(title, rowsHTML, cardClass = "") {
        return `
        <div class="card ${cardClass}">
            <div class="card-title">${title}</div>
            ${rowsHTML}
        </div>`;
    }

    function calculate() {
        const max = parseFloat(document.getElementById('maxVal').value);
        const min = parseFloat(document.getElementById('minVal').value);
        
        if (isNaN(max) || isNaN(min) || max <= min) {
            alert("請輸入正確的數值 (最大值需大於最小值)");
            return;
        }

        const range = max - min;
        
        const q3_val = Math.round(min + range * 0.75);
        const q2_val = Math.round(min + range * 0.5);
        const q1_val = Math.round(min + range * 0.25);

        // --- Big Bridge ---
        let t1_rows = "";
        t1_rows += createRow("", max, ""); 
        t1_rows += createRow("壓力", q3_val, "up");
        t1_rows += createRow("", q2_val, "mid", true); // ★ 將文字 "分界" 改為空字串
        t1_rows += createRow("支撐", q1_val, "down");
        t1_rows += createRow("", min, ""); 

        // --- U - Bridge ---
        const upper_step = (q3_val - q2_val) / 4;
        const lower_step = (q2_val - q1_val) / 4;
        
        let t2_rows = "";
        t2_rows += createRow("", q3_val, "");
        t2_rows += createRow("壓力", Math.round(q2_val + upper_step * 3), "up");
        t2_rows += createRow("", Math.round(q2_val + upper_step * 2), "up", true); // ★ 將文字 "分界" 改為空字串
        t2_rows += createRow("支撐", Math.round(q2_val + upper_step * 1), "up");
        t2_rows += createRow("", q2_val, "");

        // --- D - Bridge ---
        let t3_rows = "";
        t3_rows += createRow("", q2_val, "");
        t3_rows += createRow("壓力", Math.round(q1_val + lower_step * 3), "down");
        t3_rows += createRow("", Math.round(q1_val + lower_step * 2), "down", true); // ★ 將文字 "分界" 改為空字串
        t3_rows += createRow("支撐", Math.round(q1_val + lower_step * 1), "down");
        t3_rows += createRow("", q1_val, "");

        // --- 建立左側群組 ---
        let leftHtml = `<div class="left-group">`;
        leftHtml += createCard("Big Bridge", t1_rows, ""); 
        leftHtml += createCard("U - Bridge", t2_rows, "card-ubridge"); 
        leftHtml += createCard("D - Bridge", t3_rows, "card-dbridge"); 
        leftHtml += `</div>`;

        // --- Fibonacci Retracement ---
        const fib_data = [
            { ratio: 0.809, label: "壓力三" },
            { ratio: 0.705, label: "壓力二" },
            { ratio: 0.618, label: "壓力一" },
            { ratio: 0.5,   label: "中線" },
            { ratio: 0.382, label: "支撐一" },
            { ratio: 0.295, label: "支撐二" },
            { ratio: 0.191, label: "支撐三" }
        ];
        
        let t4_rows = "";
        t4_rows += createRow("", max, ""); 
        
        fib_data.forEach(item => {
            const val = Math.round(min + range * item.ratio);
            let type = item.ratio > 0.5 ? "up" : (item.ratio < 0.5 ? "down" : "mid");
            let isMid = (item.ratio === 0.5); 
            
            // ★ 若為中線 (0.5)，將傳入的 label 替換成空字串，以觸發跨欄置中
            let labelText = isMid ? "" : item.label;
            
            t4_rows += createRow(labelText, val, type, isMid);
        });
        
        t4_rows += createRow("", min, ""); 

        // --- 建立右側群組 ---
        let rightHtml = `<div class="right-group">`;
        rightHtml += createCard("Fibonacci Retracement", t4_rows, "card-fib"); 
        rightHtml += `</div>`;

        document.getElementById('output').innerHTML = leftHtml + rightHtml;
    }

    window.onload = calculate;
</script>
</body>
</html>
