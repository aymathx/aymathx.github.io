<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【 國八 】2026-09-16 -- 1-1 乘法公式</title>
<style>
  :root{
    --ink:#16212b; --dim:#5d6b79; --line:#d8e0e9;
    --blue:#1a5276; --blue-soft:#eaf1f7; --red:#c0392b;
    --bg:#f4f6f9; --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.8;
    min-height:100vh; display:flex; flex-direction:column;
  }

  header{
    background:var(--blue); color:#fff; padding:14px 20px;
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  header h1{font-size:1.15rem; font-weight:700; letter-spacing:.02em}
  header .sub{font-size:.82rem; opacity:.82}
  header .spacer{flex:1}
  header .count{font-size:.82rem; opacity:.82; font-variant-numeric:tabular-nums}

  nav{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:10px 20px; display:flex; gap:8px; flex-wrap:wrap;
    position:sticky; top:0; z-index:10;
  }
  nav button{
    font:inherit; font-size:.95rem; font-weight:700; font-variant-numeric:tabular-nums;
    min-width:46px; padding:7px 10px; cursor:pointer;
    background:#fff; color:var(--blue);
    border:1.5px solid var(--line); border-radius:8px;
    transition:background .12s, border-color .12s, color .12s;
  }
  nav button:hover{border-color:var(--blue); background:var(--blue-soft)}
  nav button[aria-current="true"]{background:var(--blue); border-color:var(--blue); color:#fff}
  nav button.seen:not([aria-current="true"]){background:var(--blue-soft)}

  main{flex:1; padding:26px 20px 40px; display:flex; justify-content:center}
  .card{
    width:100%; max-width:860px; background:var(--card);
    border:1px solid var(--line); border-radius:14px;
    padding:30px 34px 34px; box-shadow:0 1px 3px rgba(22,33,43,.06);
  }
  .meta{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding-bottom:14px; margin-bottom:20px; border-bottom:2px solid var(--blue);
  }
  .badge{
    background:var(--blue); color:#fff; font-weight:700;
    font-size:1.05rem; padding:5px 14px; border-radius:7px;
    font-variant-numeric:tabular-nums;
  }
  .skill{color:var(--dim); font-size:.88rem}
  .stem{font-size:1.24rem; line-height:2.05}
  .stem .disp{margin:22px 0 6px; font-size:1.12rem; overflow-x:auto}

  .tools{margin-top:28px; display:flex; gap:10px; flex-wrap:wrap}
  .btn{
    font:inherit; font-size:.95rem; font-weight:600; cursor:pointer;
    padding:9px 18px; border-radius:9px; border:1.5px solid var(--blue);
    background:#fff; color:var(--blue); transition:background .12s,color .12s;
  }
  .btn:hover{background:var(--blue); color:#fff}
  .btn.ghost{border-color:var(--line); color:var(--dim)}
  .btn.ghost:hover{background:var(--line); color:var(--ink)}
  .sol{
    margin-top:22px; padding:20px 24px; border-radius:11px;
    background:#f7f9fb; border:1px solid var(--line); border-left:5px solid var(--blue);
    font-size:1.04rem; line-height:2.0;
  }
  .sol[hidden]{display:none}
  .sol ol{margin:0; padding-left:1.35em}
  .sol li{margin:.4em 0}
  .sol .note{
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
    color:var(--dim); font-size:.92rem; line-height:1.85;
  }
  .ans{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    color:var(--red); font-weight:700; font-size:1.12rem;
  }

  .pager{
    max-width:860px; width:100%; margin:20px auto 0;
    display:flex; justify-content:space-between; gap:10px;
  }
  .pager button:disabled{opacity:.35; cursor:default}
  .pager button:disabled:hover{background:#fff; color:var(--blue)}
  footer{
    padding:16px 20px 30px; text-align:center;
    color:var(--dim); font-size:.8rem; line-height:1.7;
  }

  @media (max-width:640px){
    .card{padding:22px 18px 26px; border-radius:11px}
    .stem{font-size:1.1rem; line-height:1.95}
    nav{padding:9px 12px; gap:6px}
    nav button{min-width:40px; padding:6px 8px; font-size:.88rem}
    main{padding:16px 12px 30px}
  }
</style>
<script>
window.MathJax = {
  tex: {inlineMath: [['$','$']], displayMath: [['$$','$$']]},
  chtml: {scale: 1.05},
  options: {renderActions: {addMenu: []}}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

<header>
  <h1>Chapter 1 · 乘法公式與多項式</h1>
  <span class="sub">【 國八 】1-1 乘法公式</span>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
</header>

<nav id="nav" aria-label="題號"></nav>

<main>
  <div style="width:100%;max-width:860px">
    <article class="card">
      <div class="meta">
        <span class="badge" id="badge"></span>
        <span class="skill" id="skill"></span>
      </div>
      <div class="stem" id="stem"></div>

      <div class="tools">
        <button class="btn" id="toggle">顯示解答</button>
        <button class="btn ghost" id="reset">收合全部解答</button>
      </div>

      <div class="sol" id="sol" hidden></div>
    </article>

    <div class="pager">
      <button class="btn" id="prev">← 上一題</button>
      <button class="btn" id="next">下一題 →</button>
    </div>
  </div>
</main>

<footer>
  題目原題取自《112 年〔博志〕縱橫天下國中資優 數學 3》第一章，僅供課堂教學使用。<br>
  鍵盤：← → 切換題目 ｜ 空白鍵 顯示／收合解答
</footer>

<script>
const QUESTIONS = [
  {
    "n": 1,
    "skill": "提出共同因子",
    "stem": "計算 $2022\\times 20212021-2021\\times 20222022$ 的值。",
    "sol": [
      "$20212021=2021\\times 10001$，$20222022=2022\\times 10001$。",
      "原式$=2022\\times 2021\\times 10001-2021\\times 2022\\times 10001=0$。"
    ],
    "ans": "$0$"
  },
  {
    "n": 2,
    "skill": "乘法公式直接套用",
    "stem": "已知 $a=1000x+364$，$b=1000x+365$，$c=1000x+366$，求 ${a}^{2}+{b}^{2}+{c}^{2}-ab-bc-ac$ 之值。",
    "sol": [
      "${a}^{2}+{b}^{2}+{c}^{2}-ab-bc-ac=\\dfrac{{(a-b)}^{2}+{(b-c)}^{2}+{(c-a)}^{2}}{2}$。",
      "由題意 $a-b=-1$，$b-c=-1$，$c-a=2$。",
      "代入得 $\\dfrac{{(-1)}^{2}+{(-1)}^{2}+{2}^{2}}{2}=\\dfrac{1+1+4}{2}=3$。"
    ],
    "ans": "$3$"
  },
  {
    "n": 3,
    "skill": "中心數代換消去高次項",
    "stem": "計算下式的值：<div class=\"disp\">$$\\dfrac{{2022}^{3}+2023\\times 2021-2023\\times {2022}^{2}}{{2022}^{3}-2023\\times 2021-2021\\times {2022}^{2}}$$</div>",
    "sol": [
      "設 $x=2022$，則 $2023=x+1$、$2021=x-1$。",
      "分子$={x}^{3}+(x+1)(x-1)-(x+1){x}^{2}={x}^{3}+{x}^{2}-1-{x}^{3}-{x}^{2}=-1$。",
      "分母$={x}^{3}-(x+1)(x-1)-(x-1){x}^{2}={x}^{3}-{x}^{2}+1-{x}^{3}+{x}^{2}=1$。",
      "所以原式$=-1$。"
    ],
    "ans": "$-1$"
  },
  {
    "n": 4,
    "skill": "平方差＋望遠鏡連乘",
    "stem": "計算下式的值：<div class=\"disp\">$$\\dfrac{(1-{2}^{2})(1-{3}^{2})\\cdots (1-{2023}^{2})}{{2}^{2}\\times {3}^{2}\\times \\cdots \\times {2023}^{2}}$$</div>",
    "sol": [
      "一般項 $\\dfrac{1-{k}^{2}}{{k}^{2}}=-\\dfrac{(k-1)(k+1)}{{k}^{2}}$。",
      "$k$ 從 $2$ 到 $2023$ 共 $2022$ 項，負號成偶數個，全部相乘後為正號。",
      "原式$=[\\dfrac{1\\times 3}{{2}^{2}}]\\times [\\dfrac{2\\times 4}{{3}^{2}}]\\times \\cdots \\times [\\dfrac{2022\\times 2024}{{2023}^{2}}]$。",
      "中間項交叉約分後只剩首尾：原式$=(\\dfrac{1}{2})\\times (\\dfrac{2024}{2023})=\\dfrac{1012}{2023}$。"
    ],
    "ans": "$\\dfrac{1012}{2023}$"
  },
  {
    "n": 5,
    "skill": "對稱式降階",
    "stem": "已知 $x+y=3$，${x}^{2}+{y}^{2}-xy=4$，求 ${x}^{4}+{y}^{4}+{x}^{3}y+x{y}^{3}$ 的值。",
    "sol": [
      "由 $x+y=3$ 平方得 ${x}^{2}+{y}^{2}+2xy=9$。",
      "與 ${x}^{2}+{y}^{2}-xy=4$ 相減得 $3xy=5$，故 $xy=\\dfrac{5}{3}$，${x}^{2}+{y}^{2}=\\dfrac{17}{3}$。",
      "原式$={x}^{4}+{y}^{4}+xy({x}^{2}+{y}^{2})={({x}^{2}+{y}^{2})}^{2}-2{(xy)}^{2}+xy({x}^{2}+{y}^{2})$。",
      "$={(\\dfrac{17}{3})}^{2}-2{(\\dfrac{5}{3})}^{2}+(\\dfrac{5}{3})(\\dfrac{17}{3})=\\dfrac{289-50+85}{9}=\\dfrac{324}{9}=36$。"
    ],
    "ans": "$36$"
  },
  {
    "n": 6,
    "skill": "三次恆等式",
    "stem": "已知 $abc\\neq 0$，且 $a+b+c=0$，求下式之值：<div class=\"disp\">$$\\dfrac{{a}^{2}}{bc}+\\dfrac{{b}^{2}}{ca}+\\dfrac{{c}^{2}}{ab}$$</div>",
    "sol": [
      "三項通分，公分母為 $abc$，得 原式$=\\dfrac{{a}^{3}+{b}^{3}+{c}^{3}}{abc}$。",
      "由 $a+b+c=0$ 可得恆等式 ${a}^{3}+{b}^{3}+{c}^{3}=3abc$。",
      "所以 原式$=\\dfrac{3abc}{abc}=3$。"
    ],
    "ans": "$3$"
  },
  {
    "n": 7,
    "skill": "倒數換元",
    "stem": "已知 $\\dfrac{a}{{a}^{2}+a+1}=6$，試求 $\\dfrac{{a}^{2}}{{a}^{4}+{a}^{2}+1}$ 之值。",
    "sol": [
      "已知式取倒數：$\\dfrac{{a}^{2}+a+1}{a}=\\dfrac{1}{6}$，即 $a+1+\\dfrac{1}{a}=\\dfrac{1}{6}$，故 $a+\\dfrac{1}{a}=-\\dfrac{5}{6}$。",
      "所求式取倒數：$\\dfrac{{a}^{4}+{a}^{2}+1}{{a}^{2}}={a}^{2}+1+\\dfrac{1}{{a}^{2}}={(a+\\dfrac{1}{a})}^{2}-1$。",
      "$={(-\\dfrac{5}{6})}^{2}-1=\\dfrac{25}{36}-1=-\\dfrac{11}{36}$。",
      "再取倒數，所求$=-\\dfrac{36}{11}$。"
    ],
    "ans": "$-\\dfrac{36}{11}$",
    "note": "本題為形式恆等變形。若檢驗實數存在性，$a+\\dfrac{1}{a}=-\\dfrac{5}{6}$ 的絕對值小於 $2$，在實數範圍內無解——原書即如此設計，作答時依恆等變形求值即可。"
  },
  {
    "n": 8,
    "skill": "配方＋平方和非負",
    "stem": "已知 $a+b+c=3$，${a}^{2}+{b}^{2}+{c}^{2}=3$，求 ${a}^{2023}+{b}^{2023}+{c}^{2023}$ 之值。",
    "sol": [
      "構造 ${(a-1)}^{2}+{(b-1)}^{2}+{(c-1)}^{2}=({a}^{2}+{b}^{2}+{c}^{2})-2(a+b+c)+3$。",
      "代入已知值$=3-2\\times 3+3=0$。",
      "三個實數平方和為 $0$，必每項皆為 $0$，故 $a=b=c=1$。",
      "所求$={1}^{2023}+{1}^{2023}+{1}^{2023}=3$。"
    ],
    "ans": "$3$"
  },
  {
    "n": 9,
    "skill": "平方差＋整數解",
    "stem": "若 $a$、$b$ 為正整數，且 $9{a}^{2}-4{b}^{2}=17$，求 $a-b$ 之值。",
    "sol": [
      "左式因式分解：$9{a}^{2}-4{b}^{2}=(3a-2b)(3a+2b)=17$。",
      "$17$ 為質數，且 $a$、$b$ 為正整數使 $3a+2b>3a-2b>0$，",
      "故 $3a-2b=1$ 且 $3a+2b=17$。",
      "兩式相加得 $6a=18$，$a=3$；相減得 $4b=16$，$b=4$。",
      "所以 $a-b=3-4=-1$。"
    ],
    "ans": "$-1$"
  },
  {
    "n": 10,
    "skill": "指數配對參數化",
    "stem": "設 $a$、$b$、$c$、$d$ 都是正整數，並且 ${a}^{5}={b}^{4}$，${c}^{3}={d}^{2}$，$c-a=19$，求 $d-b$ 之值。",
    "sol": [
      "由 ${a}^{5}={b}^{4}$ 可設 $a={p}^{4}$、$b={p}^{5}$；由 ${c}^{3}={d}^{2}$ 可設 $c={q}^{2}$、$d={q}^{3}$，其中 $p$、$q$ 均為正整數。",
      "代入 $c-a=19$ 得 ${q}^{2}-{p}^{4}=19$，即 $(q-{p}^{2})(q+{p}^{2})=19$。",
      "$19$ 為質數，且 $q+{p}^{2}>q-{p}^{2}>0$，故 $q+{p}^{2}=19$、$q-{p}^{2}=1$。",
      "解得 $q=10$、${p}^{2}=9$，即 $p=3$。",
      "所以 $b={3}^{5}=243$、$d={10}^{3}=1000$，$d-b=1000-243=757$。"
    ],
    "ans": "$757$"
  }
];

const $ = id => document.getElementById(id);
const nav = $('nav');
const shown = new Set();          // 已顯示解答的題號
const seen = new Set();           // 已看過的題號
let cur = 0;

QUESTIONS.forEach((q, i) => {
  const b = document.createElement('button');
  b.textContent = 'Q' + q.n;
  b.addEventListener('click', () => go(i));
  nav.appendChild(b);
});

function render() {
  const q = QUESTIONS[cur];
  seen.add(q.n);

  $('badge').textContent = 'Q' + q.n;
  $('skill').textContent = '技法：' + q.skill;
  $('stem').innerHTML = q.stem;
  $('count').textContent = (cur + 1) + ' / ' + QUESTIONS.length;

  const open = shown.has(q.n);
  const sol = $('sol');
  sol.hidden = !open;
  $('toggle').textContent = open ? '收合解答' : '顯示解答';
  if (open) {
    sol.innerHTML =
      '<ol>' + q.sol.map(s => '<li>' + s + '</li>').join('') + '</ol>' +
      (q.note ? '<div class="note">※ ' + q.note + '</div>' : '') +
      '<div class="ans">答：' + q.ans + '</div>';
  } else {
    sol.innerHTML = '';
  }

  [...nav.children].forEach((b, i) => {
    b.setAttribute('aria-current', i === cur ? 'true' : 'false');
    b.classList.toggle('seen', seen.has(QUESTIONS[i].n));
  });
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === QUESTIONS.length - 1;

  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([$('stem'), sol]).catch(() => {});
  }
  location.hash = 'q' + q.n;
}

function go(i) {
  cur = Math.max(0, Math.min(QUESTIONS.length - 1, i));
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

$('toggle').addEventListener('click', () => {
  const n = QUESTIONS[cur].n;
  shown.has(n) ? shown.delete(n) : shown.add(n);
  render();
});
$('reset').addEventListener('click', () => { shown.clear(); render(); });
$('prev').addEventListener('click', () => go(cur - 1));
$('next').addEventListener('click', () => go(cur + 1));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'BUTTON' && e.key === ' ') e.preventDefault();
  if (e.key === 'ArrowLeft') go(cur - 1);
  else if (e.key === 'ArrowRight') go(cur + 1);
  else if (e.key === ' ') { e.preventDefault(); $('toggle').click(); }
});

// 網址帶 #q7 時直接開該題
const m = /^#q(\d+)$/.exec(location.hash);
if (m) {
  const i = QUESTIONS.findIndex(q => q.n === +m[1]);
  if (i >= 0) cur = i;
}
render();
</script>
</body>
</html>
