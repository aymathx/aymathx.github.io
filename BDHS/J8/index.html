/* =========================================================
   Fisher-Yates 隨機排序
   每次重新開始時重新排列選項
   ========================================================= */

function shuffle(a){

  a=[...a];

  for(let j=a.length-1;j>0;j--){

    let k=Math.floor(Math.random()*(j+1));

    [a[j],a[k]]=[a[k],a[j]];
  }

  return a;
}


/* =========================================================
   建立本次 Level 的題目
   題目順序固定
   選項順序隨機
   ========================================================= */

function makeSession(lv){

  const [s,e]=ranges[lv];

  return data.slice(s,e).map(x=>{

    const z=shuffle(
      x.c.map((text,index)=>({
        text,
        index
      }))
    );

    return {
      ...x,
      c:z.map(v=>v.text),
      a:z.findIndex(v=>v.index===x.a)
    };

  });
}

  for(let l=1;l<=5;l++){

    document.getElementById("score"+l).innerHTML=
      scores[l]+'<span> / 20</span>';

    total+=scores[l];
  }

  document.getElementById("totalScore").innerHTML=
    total+'<span> / 100</span>';
}


/* =========================================================
   選擇 Level
   ========================================================= */

function chooseLevel(lv){

  level=lv;

  i=0;

  session=makeSession(lv);


  /* Level 按鈕 */

  document
    .querySelectorAll("#levelSelect button")
    .forEach((b,n)=>{
      b.classList.toggle(
        "active",
        n===lv-1
      );
    });


  /* 成績卡 */

  document
    .querySelectorAll(".score-card")
    .forEach(x=>{
      x.classList.remove("active");
    });

  document
    .getElementById("scoreCard"+lv)
    .classList.add("active");


  document.getElementById("lv").textContent=
    "LEVEL "+lv;

  document.getElementById("num").textContent=
    "準備開始 · 第 1 / 10 題";

  document.getElementById("bar").style.width=
    "0%";

  document.getElementById("q").textContent=
    "準備挑戰 LEVEL "+lv;

  document.getElementById("s").textContent="";

  document.getElementById("sc").textContent=
    `本 Level：${scores[lv]} / 20 分 · 已作答 0 / 10 題`;

  document.getElementById("c").innerHTML=
    `<button onclick="startLevel()" style="grid-column:1/-1">
      開始 LEVEL ${lv} 🚀
    </button>`;
}


/* =========================================================
   開始 Level
   每次開始都重新隨機選項
   ========================================================= */

function startLevel(){

  session=makeSession(level);

  i=0;

  lock=false;

  show();
}


/* =========================================================
   顯示題目
   ========================================================= */

function show(){

  lock=false;

  const x=session[i];


  document.getElementById("lv").textContent=
    "LEVEL "+level;

  document.getElementById("num").textContent=
    `第 ${i+1} / 10 題`;


  document.getElementById("bar").style.width=
    (i*10)+"%";


  document.getElementById("q").textContent=
    x.q;


  document.getElementById("c").innerHTML=
    x.c
      .map((v,k)=>
        `<button onclick="ans(${k})">${v}</button>`
      )
      .join("");


  document.getElementById("s").textContent="";


  document.getElementById("sc").textContent=
    `本 Level：${scores[level]} / 20 分 · 已作答 ${i} / 10 題`;
}


/* =========================================================
   作答
   正確 +2 分
   錯誤 +0 分
   ========================================================= */

function ans(k){

  if(lock)return;

  lock=true;

  const x=session[i];

  const b=
    document.querySelectorAll(".choices button");


  /* 標記答案 */

  b[k].classList.add(
    k===x.a ? "correct" : "wrong"
  );


  /* 正確 */

  if(k===x.a){

    scores[level]+=2;

    document.getElementById("s").innerHTML=
      "✅ 答對！ "+
      x.n+
      "<br>本題 +2 分";
  }


  /* 錯誤 */

  else{

    b[x.a].classList.add("correct");

    document.getElementById("s").innerHTML=
      "❌ 答案揭曉："+
      x.n+
      "<br>本題 0 分";
  }


  updateScores();


  document.getElementById("sc").textContent=
    `本 Level：${scores[level]} / 20 分 · 已作答 ${i+1} / 10 題`;


  /* 1.9 秒後進下一題 */

  setTimeout(()=>{

    i++;

    if(i<10){

      show();

    }else{

      finishLevel();

    }

  },1900);
}


/* =========================================================
   Level 完成
   ========================================================= */

function finishLevel(){

  document.getElementById("bar").style.width=
    "100%";

  document.getElementById("lv").textContent=
    `LEVEL ${level} 完成`;

  document.getElementById("num").textContent=
    "10 / 10 題";

  document.getElementById("q").textContent=
    `🎉 LEVEL ${level} 挑戰完成！`;


  const total=
    Object.values(scores)
      .reduce((a,b)=>a+b,0);


  document.getElementById("c").innerHTML=

    `<button onclick="startLevel()">
      🔁 重玩 LEVEL ${level}
    </button>

    <button onclick="nextLevel()">
      ➡️ 選擇下一 LEVEL
    </button>`;


  document.getElementById("s").innerHTML=

    `本 Level 得分：
    <strong>${scores[level]} / 20</strong>
    <br>
    目前總分：
    <strong>${total} / 100</strong>`;


  document.getElementById("sc").textContent=
    "每題 2 分 · 共 10 題 · Level 滿分 20 分";
}


/* =========================================================
   下一 Level
   ========================================================= */

function nextLevel(){

  chooseLevel(
    level<5 ? level+1 : 1
  );
}


/* =========================================================
   全部重新開始
   ========================================================= */

function restartAll(){

  if(
    !confirm(
      "確定要重新開始嗎？目前所有 Level 成績都會歸零。"
    )
  )return;


  for(let l=1;l<=5;l++){

    scores[l]=0;
  }


  level=0;

  i=0;

  session=[];


  document
    .querySelectorAll(
      "#levelSelect button,.score-card"
    )
    .forEach(x=>{
      x.classList.remove("active");
    });


  document.getElementById("lv").textContent=
    "尚未選擇";

  document.getElementById("num").textContent=
    "請選擇 Level";

  document.getElementById("bar").style.width=
    "0%";

  document.getElementById("q").textContent=
    "選擇一個 LEVEL 開始任務";

  document.getElementById("c").innerHTML="";

  document.getElementById("s").textContent="";

  document.getElementById("sc").textContent="";


  updateScores();
}


/* =========================================================
   初始載入
   ========================================================= */

updateScores();

</script>

</body>
</html>
