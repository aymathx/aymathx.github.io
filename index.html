<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AY Math 短網址</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      word-break: break-all;
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🔗 AY Math 短網址</h1>

  <label>原始網址</label>
  <input id="longUrl" placeholder="貼上超長網址">

  <label>短代碼</label>
  <input id="code" placeholder="例如：520">

  <button onclick="createUrl()">產生短網址</button>

  <div id="result"></div>

</div>

<script>
function createUrl() {

  const longUrl = document.getElementById("longUrl").value;
  const code = document.getElementById("code").value;

  if (!longUrl || !code) {
    alert("請填寫完整！");
    return;
  }

  const shortUrl =
    "https://aymathx.github.io/" + code;

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML =
    "你的短網址：<br><br>" +
    "<strong>" + shortUrl + "</strong>";

}
</script>

</body>
</html>
