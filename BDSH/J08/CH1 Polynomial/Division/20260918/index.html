<script>
const M=s=>`<span class="math">${s}</span>`;
const Q=(badge,num,html,prompts='')=>({badge,num,html,prompts});
const slides=[
Q('精選範例 1','1-1',`<p>在空格中填入適當的式子：</p><p>${M('x<sup>2</sup>')} × <span class="blank"></span> = ${M('x<sup>5</sup>')}</p>`),
Q('精選範例 1','1-2',`<p>在空格中填入適當的式子：</p><p>2x × <span class="blank"></span> = ${M('x<sup>4</sup>')}</p>`),
Q('精選範例 1','1-3',`<p>在空格中填入適當的式子：</p><p>−2x × <span class="blank"></span> = ${M('−7x<sup>4</sup>')}</p>`),
Q('精選範例 1','1-4',`<p>在空格中填入適當的式子：</p><p>${M('12x<sup>3</sup>')} ÷ 3x = <span class="blank"></span></p>`),
Q('精選範例 1','1-5',`<p>在空格中填入適當的式子：</p><p>${M('(−8x<sup>4</sup>)')} ÷ (−2x) = <span class="blank"></span></p>`),
Q('精選範例 1','1-6',`<p>在空格中填入適當的式子：</p><p>${M('9x<sup>2</sup>')} ÷ (−6x<sup>2</sup>) = <span class="blank"></span></p>`),
Q('隨堂練習','1-7',`<p>在空格中填入適當的式子：</p><p>${M('x<sup>2</sup>')} × <span class="blank"></span> = 3x<sup>7</sup></p>`),
Q('隨堂練習','1-8',`<p>在空格中填入適當的式子：</p><p>${M('½x')} × <span class="blank"></span> = −3x<sup>4</sup></p>`),
Q('隨堂練習','1-9',`<p>在空格中填入適當的式子：</p><p>${M('2x<sup>2</sup>')} ÷ 3x = <span class="blank"></span></p>`),
Q('隨堂練習','1-10',`<p>在空格中填入適當的式子：</p><p>${M('x<sup>3</sup>')} ÷ 4x = <span class="blank"></span></p>`),
Q('隨堂練習','1-11',`<p>在空格中填入適當的式子：</p><p>(−15x<sup>2</sup>) ÷ 3x = <span class="blank"></span></p>`),
Q('隨堂練習','1-12',`<p>在空格中填入適當的式子：</p><p>10x<sup>3</sup> ÷ (−4x<sup>3</sup>) = <span class="blank"></span></p>`),
Q('精選範例 2','2-1',`<p>求下列各式的商式與餘式：</p><p>${M('x(4x−3)')} ÷ x</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('精選範例 2','2-2',`<p>求下列各式的商式與餘式：</p><p>${M('(15x<sup>2</sup>−24x)')} ÷ 3x</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('隨堂練習','2-3',`<p>求下列各式的商式與餘式：</p><p>${M('(−9x<sup>2</sup>+6x−4)')} ÷ 3x</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('隨堂練習','2-4',`<p>求下列各式的商式與餘式：</p><p>${M('(14x<sup>2</sup>+10x−2)')} ÷ (−2x)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('隨堂練習','2-5',`<p>求下列各式的商式與餘式：</p><p>x(4x+3) ÷ (4x+3)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('隨堂練習','2-6',`<p>求下列各式的商式與餘式：</p><p>(3x+4)(−x−1) ÷ (x+1)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('精選範例 3','3-1',`<p>計算 (x<sup>2</sup> − 3x + 1) ÷ (x + 2) 的商式與餘式。</p><div style="margin-top:18px">${M('x + 2')} ) ${M('x<sup>2</sup> − 3x + 1')}</div>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('隨堂練習','3-2',`<p>求下列各式的商式與餘式：</p><p>(2x<sup>2</sup> + 5x − 3) ÷ (x + 3)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('隨堂練習','3-3',`<p>求下列各式的商式與餘式：</p><p>(6x<sup>2</sup> + x − 2) ÷ (2x − 1)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('精選範例 4','4-1',`<p>計算 (3x<sup>2</sup> − 7) ÷ (x − 2) 的商式與餘式。</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('隨堂練習','4-2',`<p>求下列各式的商式與餘式：</p><p>(5 − 7x + 2x<sup>2</sup>) ÷ (x − 3)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('隨堂練習','4-3',`<p>求下列各式的商式與餘式：</p><p>(4x<sup>2</sup> − 9) ÷ (2x + 3)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('精選範例 5','5-1',`<p>求下列各式的商式與餘式：</p><p>(8x<sup>2</sup> − 15x + 3) ÷ (4x<sup>2</sup> + 3x − 7)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('精選範例 5','5-2',`<p>求下列各式的商式與餘式：</p><p>(6x<sup>2</sup> − x) ÷ (−3x<sup>2</sup> + 2x + 1)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('隨堂練習','5-3',`<p>求下列各式的商式與餘式：</p><p>(x<sup>2</sup> + 4x − 3) ÷ (x<sup>2</sup> + 1)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('隨堂練習','5-4',`<p>求下列各式的商式與餘式：</p><p>(3x<sup>2</sup> + 2x − 4) ÷ (2x<sup>2</sup> − x)</p>`,`商式：<span class="line"></span>　　餘式：<span class="line"></span>`),
Q('精選範例 6','6-1',`<p>有一多項式除以 x<sup>2</sup> + 2x，得商式為 x − 2、餘式為 5x + 3，求此多項式。</p>`),
Q('隨堂練習','6-2',`<p>多項式 A 除以 2x − 3，得商式 x + 4、餘式 −5，求 A。</p>`),
Q('隨堂練習','6-3',`<p>多項式 B 除以 x<sup>2</sup> − 1，得商式 3x + 2、餘式 x − 4，求 B。</p>`),
Q('精選範例 7','7-1',`<p>已知 6x<sup>2</sup> + x − 10 除以多項式 B，得商式為 2x + 3、餘式為 2，求多項式 B。</p>`),
Q('隨堂練習','7-2',`<p>已知 3x<sup>2</sup> − 5x + 7 除以多項式 C，得商式為 x − 1、餘式為 5，求多項式 C。</p>`),
Q('精選範例 8','7-3',`<p>若 6x<sup>2</sup> − 7x + k 能被 2x − 1 整除，求 k 的值與商式。</p>`),
Q('隨堂練習','7-4',`<p>若 x<sup>2</sup> + ax − 12 能被 x + 4 整除，求 a 的值。</p>`),
Q('精熟 A＋＋','8-1',`<p>小明計算 (6x<sup>2</sup> + x − 4) ÷ (3x + 2)，得到「商式為 2x，餘式為 −3x − 4」。</p><p>他算對了嗎？若不對，請寫出正確的商式與餘式。</p>`),
Q('精熟 A＋＋','8-2',`<p>若 2x<sup>2</sup> + ax + b 除以 x − 3，得商式為 2x + 5、餘式為 4，求 a、b 的值。</p>`),
Q('精熟 A＋＋','8-3',`<p>若 x<sup>2</sup> + ax + b 除以 x − 1 的餘式為 2，除以 x + 2 的餘式為 5，求 a、b 的值。</p>`),
Q('109 會考','9-1',`<p>計算 2x<sup>2</sup> − 3 除以 x + 1 後，得商式和餘式分別為何？</p><div class="options"><div class="option">🄐 商式為 2，餘式為 −5</div><div class="option">🄑 商式為 2x − 5，餘式為 5</div><div class="option">🄒 商式為 2x + 2，餘式為 −1</div><div class="option">🄓 商式為 2x − 2，餘式為 −1</div></div>`),
Q('115 會考','9-2',`<p>計算多項式 4x<sup>2</sup> − 3x − 5 除以 x + 2 後，所得商式與餘式兩者之和為何？</p><div class="options"><div class="option">🄐 4x + 6</div><div class="option">🄑 4x + 10</div><div class="option">🄒 −7x − 5</div><div class="option">🄓 −11x − 1</div></div>`),
Q('104 會考','9-3',`<p>計算多項式 −2x(3x − 2) + 3 除以 3x − 2 後，所得商式與餘式兩者之和為何？</p><div class="options"><div class="option">🄐 −2x + 3</div><div class="option">🄑 −6x<sup>2</sup> + 4x</div><div class="option">🄒 −6x<sup>2</sup> + 4x + 3</div><div class="option">🄓 −6x<sup>2</sup> − 4x + 3</div></div>`),
Q('93-2 基測','9-4',`<p>若多項式 A 除以 2x + 1 得商式為 3x − 4，餘式為 5，則 A = ？</p><div class="options"><div class="option">🄐 6x<sup>2</sup> − 5x − 4</div><div class="option">🄑 6x<sup>2</sup> − 5x − 9</div><div class="option">🄒 6x<sup>2</sup> + 5x + 1</div><div class="option">🄓 6x<sup>2</sup> − 5x + 1</div></div>`),
Q('93-1 基測','9-5',`<p>已知有一多項式除以 (x − 2) 得商式為 (2x − 3)，餘式為 3，若此多項式除以 (2x + 3)，得商式為何？</p><div class="options"><div class="option">🄐 x + 5</div><div class="option">🄑 x − 5</div><div class="option">🄒 x + 2</div><div class="option">🄓 x − 2</div></div>`),
Q('91-1 基測','9-6',`<div class="q96"><p>章老師作一個多項式除法示範後，擦掉計算過程中的六個係數，並以 a、b、c、d、e、f 表示，求 a + b + d + e =？</p><div class="division-diagram"><div class="divgrid"><div class="quot">2x　　　　+3</div><div class="divisor">bx+5 ）</div><div class="dividend">6x<sup>2</sup>　+ax　+d</div><div class="sub1">cx<sup>2</sup>　+10x</div><div class="line1"></div><div class="rem1">ex　+d</div><div class="sub2">fx　+15</div><div class="line2"></div><div class="rem2">−2</div></div></div><div class="options"><div class="option">🄐 18</div><div class="option">🄑 26</div><div class="option">🄒 38</div><div class="option">🄓 44</div></div></div>`)
];
let idx=0,zoom=1;
const quick=document.getElementById('quick');
function renderQuick(){quick.innerHTML=slides.map((s,i)=>`<button data-i="${i}">${s.num}</button>`).join('');}
function applyZoom(){document.documentElement.style.setProperty('--qzoom',zoom);document.getElementById('zoomLabel').textContent=Math.round(zoom*100)+'%';document.querySelector('.qtext')?.style.setProperty('font-size',`calc(28px * ${zoom})`);document.querySelectorAll('.option').forEach(e=>e.style.fontSize=`calc(26px * ${zoom})`);}
function show(n){idx=Math.max(0,Math.min(slides.length-1,n));const s=slides[idx];document.getElementById('badge').textContent=s.badge;document.getElementById('qnum').textContent='第 '+s.num+' 題';document.getElementById('qcontent').innerHTML=`<div class="qtext">${s.html}</div>`;document.getElementById('counter').textContent=`${idx+1} / ${slides.length}`;document.querySelectorAll('.quick button').forEach((b,i)=>b.classList.toggle('active',i===idx));const active=quick.querySelector('.active');active?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===slides.length-1;document.getElementById('prev').style.opacity=idx===0?.45:1;document.getElementById('next').style.opacity=idx===slides.length-1?.45:1;applyZoom();}
quick.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(+b.dataset.i)});document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('home').onclick=()=>{const n=prompt('輸入題號（1～44）',String(idx+1));if(n&&/^\d+$/.test(n))show(+n-1)};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.75,Math.round((zoom-.125)*1000)/1000);applyZoom()};document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(1.75,Math.round((zoom+.125)*1000)/1000);applyZoom()};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(idx-1);else if(e.key==='ArrowRight'||e.key===' ') {e.preventDefault();show(idx+1)}else if(e.key==='-'||e.key==='Subtract')document.getElementById('zoomOut').click();else if(e.key==='+'||e.key==='=')document.getElementById('zoomIn').click()});renderQuick();show(0);
</script></body></html>
