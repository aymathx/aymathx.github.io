<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AY Math</title>
</head>

<body>

<script>

const links = {

  "520": "https://www.google.com/",
  "math": "https://www.google.com/",
  "ai": "https://chatgpt.com/"

};

const code = location.pathname
  .replace(/^\/+|\/+$/g, "");

if (links[code]) {

  window.location.replace(links[code]);

} else {

  document.body.innerHTML = `
    <h2>找不到這個短網址</h2>
    <p>請確認網址是否輸入正確。</p>
  `;

}

</script>

</body>
</html>
