<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>【 2026 大阪聖誕節 】</title>
<meta name="theme-color" content="#1E4D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="大阪聖誕">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root {
  --bg: #F6F2EA;
  --card: #FFFFFF;
  --ink: #1D2320;
  --ink-2: #3F4642;
  --muted: #767C77;
  --line: #E6DFD2;
  --pine: #1E4D3A;
  --pine-2: #2C6A51;
  --pine-soft: #E4EEE8;
  --berry: #B4232C;
  --berry-soft: #FBE9E9;
  --gold: #BF8F2E;
  --gold-soft: #FBF1DC;
  --radius: 18px;
  --radius-s: 12px;
  --shadow: 0 1px 2px rgba(30, 40, 35, .06), 0 6px 20px rgba(30, 40, 35, .06);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --tabbar-h: 64px;
  --t-FLIGHT: #2F5D8A;
  --t-TRANSPORT: #55658A;
  --t-LODGING: #6B5B95;
  --t-FOOD: #B4232C;
  --t-CAFE: #A0672B;
  --t-SIGHT: #1E4D3A;
  --t-SHOP: #8A6D1E;
  --t-RITUAL: #C2410C;
  --t-ONSEN: #0E7490;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Hiragino Sans", "Noto Sans TC", "Noto Sans JP", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  font-size: 15px;
  min-height: 100vh;
}
body.locked { overflow: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); }
.ja { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", -apple-system, sans-serif; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  padding: calc(var(--safe-t) + 10px) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: rgba(246, 242, 234, .88);
  -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid rgba(230, 223, 210, .7);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 11px; flex: none;
  display: grid; place-items: center; font-size: 20px;
  background: var(--pine); box-shadow: inset 0 0 0 2px rgba(191, 143, 46, .55);
}
.brand-title { font-weight: 800; letter-spacing: .08em; font-size: 15px; color: var(--pine); }
.brand-sub { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.countdown {
  flex: none; font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 999px;
  background: var(--berry); color: #fff; letter-spacing: .03em; white-space: nowrap;
}

main { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(var(--tabbar-h) + var(--safe-b) + 28px); }
.view { display: none; }
.view.active { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; justify-content: center;
  padding: 6px 8px calc(var(--safe-b) + 6px);
  background: rgba(255, 255, 255, .94);
  -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px);
  border-top: 1px solid var(--line);
}
.tabbar-inner { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 560px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 12px; color: var(--muted); font-size: 11px; font-weight: 600; }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.active { color: var(--pine); }
.tab.active svg { stroke-width: 2.2; }

/* ---------- generic ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card-title { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.card-title .sp { flex: 1; }
.sec-title { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin: 22px 4px 10px; text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; vertical-align: 1px; white-space: nowrap; }
.tag-est { background: var(--gold-soft); color: #8A6414; }
.tag-off { background: var(--pine-soft); color: var(--pine); }
.tag-warn { background: var(--berry-soft); color: var(--berry); }
.tag-draft { background: #EEE; color: #555; }
.warn { background: var(--berry-soft); color: #8E1B22; border-radius: 10px; padding: 8px 10px; font-size: 13.5px; margin-top: 8px; }
.note { background: var(--gold-soft); color: #6E5112; border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: 14.5px;
  background: var(--pine-soft); color: var(--pine); text-decoration: none; white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--pine); color: #fff; }
.btn-berry { background: var(--berry); color: #fff; }
.btn-danger { background: var(--berry-soft); color: var(--berry); }
.btn-ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn-row .btn { flex: 1 1 auto; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; background: rgba(255, 255, 255, .18); color: #fff; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .ttl { font-weight: 700; }
.chk { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; border: 2px solid var(--line); background: #fff; font-size: 15px; color: #fff; font-weight: 800; }
.chk.on { background: var(--pine); border-color: var(--pine); }
.done .ttl { text-decoration: line-through; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }

/* ---------- form ---------- */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; min-height: 44px;
  -webkit-appearance: none; appearance: none;
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--pine-2); box-shadow: 0 0 0 3px var(--pine-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; background: #EFEBE3; border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--muted); min-height: 36px; }
.seg button.on { background: #fff; color: var(--pine); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.check-line { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 12px; }
.check-line input { width: 20px; height: 20px; accent-color: var(--pine); }

/* ---------- trip: banner, date scroller ---------- */
.next-todo { display: flex; align-items: center; gap: 10px; background: var(--gold-soft); color: #6E5112; border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px; width: 100%; text-align: left; }
.next-todo b { color: #5A410B; }
.date-scroller { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.date-scroller::-webkit-scrollbar { display: none; }
.date-chip { flex: none; min-width: 64px; padding: 8px 10px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); text-align: center; line-height: 1.2; }
.date-chip .d { font-size: 18px; font-weight: 800; }
.date-chip .w { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.date-chip.active { background: var(--pine); color: #fff; }
.date-chip.active .w { color: rgba(255, 255, 255, .8); }
.date-chip.today:not(.active) { box-shadow: inset 0 0 0 2px var(--berry), var(--shadow); }
.date-chip.add { color: var(--muted); font-size: 22px; font-weight: 400; display: grid; place-items: center; min-width: 52px; }

/* ---------- hero ---------- */
.hero {
  position: relative; border-radius: 22px; color: #fff; padding: 16px 16px 18px; min-height: 172px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; box-shadow: 0 10px 28px rgba(20, 40, 30, .22);
  background-size: cover; background-position: center;
}
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 28% 60%, #fff 50%, transparent 51%),
    radial-gradient(2px 2px at 46% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 63% 42%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 14%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 90% 52%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 8% 78%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 80%, #fff 50%, transparent 51%);
}
.hero.has-img::before { display: none; }
.hero > * { position: relative; }
.hero-tools { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
.hero-day { font-size: 12px; font-weight: 800; letter-spacing: .14em; opacity: .9; }
.hero-city { font-size: 13px; opacity: .9; margin-top: 2px; }
.hero-title { font-size: 23px; font-weight: 800; line-height: 1.25; margin-top: 4px; text-shadow: 0 1px 8px rgba(0, 0, 0, .25); }
.theme-night { background-image: linear-gradient(150deg, #0E2233 0%, #173F33 60%, #1E4D3A 100%); }
.theme-usj { background-image: linear-gradient(150deg, #13284B 0%, #4C1D3D 55%, #B4232C 100%); }
.theme-kobe { background-image: linear-gradient(150deg, #0B2E4A 0%, #135069 55%, #2E7D8C 100%); }
.theme-umeda { background-image: linear-gradient(150deg, #2A1B17 0%, #6A3A23 55%, #BF8F2E 100%); }
.theme-snow { background-image: linear-gradient(150deg, #36506B 0%, #6E8AA6 60%, #A9C0D3 100%); }

/* ---------- strips ---------- */
.strip { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 12px; padding: 12px 14px; }
.strip-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
.strip-head b { font-size: 14px; }
.wx-hours { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.wx-hours::-webkit-scrollbar { display: none; }
.wx-h { flex: none; min-width: 54px; text-align: center; background: #F7F5F0; border-radius: 12px; padding: 6px 4px; font-size: 12px; line-height: 1.3; }
.wx-h .e { font-size: 20px; }
.wx-h .t { font-weight: 800; font-size: 14px; }
.wx-h .p { color: #2F5D8A; font-weight: 700; }
.wx-big { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.wx-big .e { font-size: 30px; }
.wx-big .t { font-size: 22px; font-weight: 800; }
.sun-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; margin-top: 6px; }
.sun-row b { font-variant-numeric: tabular-nums; }
.light-chip { display: block; width: 100%; text-align: left; margin-top: 8px; background: #FFF8EA; border-radius: 12px; padding: 8px 10px; font-size: 13px; }
.light-chip .n { font-weight: 700; }
.hotel-bar { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.hotel-bar .ico { font-size: 22px; }
.hotel-bar .grow { flex: 1; min-width: 0; }
.hotel-bar .nm { font-weight: 800; font-size: 14.5px; }
.chev { color: var(--muted); font-size: 18px; }
.rit-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.rit-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--card); box-shadow: var(--shadow); min-height: 36px; }
.rit-chip.on { background: var(--pine); color: #fff; }
.branch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.branch .lbl { font-size: 13px; font-weight: 700; color: var(--muted); }

/* ---------- timeline ---------- */
.timeline { margin-top: 14px; position: relative; }
.ev { display: grid; grid-template-columns: 58px 18px 1fr; gap: 0 8px; position: relative; width: 100%; text-align: left; cursor: pointer; }
.ev-time { text-align: right; padding-top: 12px; font-weight: 800; font-size: 14.5px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.ev-time small { display: block; font-weight: 600; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.ev-time .tag { margin-top: 4px; }
.ev-rail { position: relative; }
.ev-rail::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.ev:first-child .ev-rail::before { top: 18px; }
.ev:last-child .ev-rail::before { bottom: calc(100% - 18px); }
.ev-dot { position: absolute; left: 2px; top: 14px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--tc, var(--pine)); }
.ev-body { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 10px 12px 11px; margin: 4px 0 10px; border-left: 4px solid var(--tc, var(--pine)); }
.ev-type { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--tc, var(--pine)); }
.ev-title { font-weight: 800; font-size: 15.5px; line-height: 1.35; margin-top: 1px; }
.ev-sub { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.ev-warn { font-size: 12.5px; color: var(--berry); margin-top: 5px; font-weight: 600; }
.ev.past .ev-body { opacity: .55; }
.ev.now .ev-body { box-shadow: 0 0 0 2.5px var(--berry), var(--shadow); }
.ev.now .ev-dot { background: var(--berry); border-color: var(--berry); animation: pulse 1.6s infinite; }
.now-badge { display: inline-block; background: var(--berry); color: #fff; font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; margin-left: 6px; letter-spacing: .06em; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(180, 35, 44, .5); } 70% { box-shadow: 0 0 0 9px rgba(180, 35, 44, 0); } 100% { box-shadow: 0 0 0 0 rgba(180, 35, 44, 0); } }
.add-ev { margin: 4px 0 0 84px; }
.day-note { margin-top: 10px; }
.type-FLIGHT { --tc: var(--t-FLIGHT); } .type-TRANSPORT { --tc: var(--t-TRANSPORT); } .type-LODGING { --tc: var(--t-LODGING); }
.type-FOOD { --tc: var(--t-FOOD); } .type-CAFE { --tc: var(--t-CAFE); } .type-SIGHT { --tc: var(--t-SIGHT); }
.type-SHOP { --tc: var(--t-SHOP); } .type-RITUAL { --tc: var(--t-RITUAL); } .type-ONSEN { --tc: var(--t-ONSEN); }

/* ---------- wallet ---------- */
.rate-card { background: linear-gradient(150deg, #173F33, #1E4D3A 60%, #2C6A51); color: #fff; }
.rate-card .card-title { color: #fff; }
.rate-meta { font-size: 12px; opacity: .85; }
.conv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-top: 6px; }
.conv-row { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, .12); border-radius: 14px; padding: 8px 12px; }
.conv-row .cur { width: 46px; font-weight: 800; letter-spacing: .05em; }
.conv-row input { flex: 1; min-width: 0; width: 100%; background: transparent; border: 0; color: #fff; font-size: 24px; font-weight: 800; text-align: right; outline: none; }
.conv-row input::placeholder { color: rgba(255, 255, 255, .45); }
.swap { align-self: center; justify-self: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .2); font-size: 18px; color: #fff; }
.rate-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: 13.5px; }
.rate-line input { width: 92px; border-radius: 10px; border: 0; padding: 6px 8px; font-weight: 800; text-align: center; }
.rate-line .btn { background: rgba(255, 255, 255, .18); color: #fff; }
.rate-line .btn.on { background: var(--gold); color: #fff; }
.total-box { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.total-box .big { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.exp-day { font-size: 12.5px; font-weight: 800; color: var(--muted); margin: 14px 0 2px; display: flex; justify-content: space-between; }
.exp-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.exp-row .grow { flex: 1; min-width: 0; }
.exp-row .amt { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.exp-row .amt small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }
.exp-del { width: 32px; height: 32px; border-radius: 50%; color: var(--muted); font-size: 15px; }

/* ---------- tools ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; text-align: left; min-height: 104px; display: flex; flex-direction: column; gap: 4px; }
.tile .ic { font-size: 26px; }
.tile .nm { font-weight: 800; font-size: 15px; }
.tile .ds { font-size: 12px; color: var(--muted); line-height: 1.35; }
.tile.hot { background: var(--berry); color: #fff; }
.tile.hot .ds { color: rgba(255, 255, 255, .85); }
.phrase { display: block; width: 100%; text-align: left; padding: 11px 0; border-top: 1px solid var(--line); }
.phrase:first-child { border-top: 0; }
.phrase .zh { font-size: 13px; color: var(--muted); }
.phrase .jp { font-size: 16px; font-weight: 700; margin-top: 1px; }
.cat-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tabs button { flex: none; padding: 7px 14px; border-radius: 999px; background: #EFEBE3; font-weight: 700; font-size: 13.5px; min-height: 36px; }
.cat-tabs button.on { background: var(--pine); color: #fff; }
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.gallery figure { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #EEE; }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery figcaption { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5px; color: #fff; padding: 2px 6px; background: linear-gradient(transparent, rgba(0, 0, 0, .6)); }
.sun-table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.sun-table th, .sun-table td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: center; }
.sun-table th { font-size: 12px; color: var(--muted); }
.ticket-grid { display: grid; grid-template-columns: 64px repeat(3, 1fr); gap: 8px; align-items: center; }
.ticket { min-height: 44px; border-radius: 12px; border: 2px dashed var(--line); font-weight: 700; font-size: 13px; color: var(--muted); }
.ticket.on { border-style: solid; border-color: var(--t-ONSEN); background: #E3F2F5; color: var(--t-ONSEN); }
.progress { height: 8px; border-radius: 99px; background: #EFEBE3; overflow: hidden; margin-top: 8px; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--pine-2), var(--gold)); border-radius: 99px; }

/* ---------- info ---------- */
.res-card { border-top: 1px solid var(--line); padding: 12px 0; }
.res-card:first-child { border-top: 0; padding-top: 0; }
.res-top { display: flex; align-items: flex-start; gap: 10px; }
.res-top .grow { flex: 1; min-width: 0; }
.res-name { font-weight: 800; }
.res-when { font-size: 12.5px; color: var(--muted); }

const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ox26', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('files', mode);
      const req = fn(t.objectStore('files'));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => run('readonly', s => s.get(k)),
    set: (k, v) => run('readwrite', s => s.put(v, k)),
    del: k => run('readwrite', s => s.delete(k)),
    clear: () => run('readwrite', s => s.clear()),
    async all() {
      const db = await open();
      return new Promise((res, rej) => {
        const out = [];
        const t = db.transaction('files');
        t.objectStore('files').openCursor().onsuccess = e => {
          const c = e.target.result;
          if (c) { out.push([c.key, c.value]); c.continue(); }
        };
        t.oncomplete = () => res(out);
        t.onerror = () => rej(t.error);
      });
    }
  };
})();

function nowAt(offsetH) {

}
/* 日本時間；凌晨 5 點前算前一天的行程 */
function jstTripNow() {

  if (n.min < 300) {

    return { date: prev, min: n.min + 1440 };

}

};

function readImage(file, max = 1600, type = 'image/jpeg', q = 0.82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc);
        c.height = Math.round(img.height * sc);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(type, q));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

/* 日出日落（天文公式，誤差約 ±1 分） */
function sunTimes(date, lat, lon, alt = -0.833) {
  const rad = Math.PI / 180;
  const J = Date.parse(date + 'T12:00:00Z') / 864e5 + 2440587.5;
  const n = Math.ceil(J - 2451545.0 + 0.0008);
  const Js = n - lon / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
  const cosw = (Math.sin(alt * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec));
  const w = Math.acos(Math.max(-1, Math.min(1, cosw))) / rad;
  const f = j => new Date((j - 2440587.5) * 864e5 + 9 * 3600e3).toISOString().slice(11, 16);
  return { rise: f(Jt - w / 360), set: f(Jt + w / 360) };
}

const sheets = [];
function openSheet(title, html, onMount) {
  const bd = document.createElement('div');

  sh.className = 'sheet';
  sh.innerHTML = `<div class="sheet-head"><div class="sheet-title">${esc(title)}</div><button class="sheet-close" aria-label="關閉">✕</button></div><div class="sheet-body">${html}</div>`;
  document.body.append(bd, sh);
  document.body.classList.add('locked');
  requestAnimationFrame(() => { bd.classList.add('show'); sh.classList.add('show'); });
  const entry = { bd, sh };
  sheets.push(entry);
  bd.onclick = () => closeSheet(entry);
  $('.sheet-close', sh).onclick = () => closeSheet(entry);
  if (onMount) onMount($('.sheet-body', sh), entry);
  return entry;
}
function closeSheet(entry = sheets[sheets.length - 1]) {
  if (!entry) return;
  const i = sheets.indexOf(entry);
  if (i >= 0) sheets.splice(i, 1);
  entry.bd.classList.remove('show');
  entry.sh.classList.remove('show');
  setTimeout(() => { entry.bd.remove(); entry.sh.remove(); }, 250);
  if (!sheets.length && !$('.fullcard')) document.body.classList.remove('locked');
}

let wxToken = 0;
async function renderWeather(day, force = false) {
  const token = ++wxToken;
  const loc = LOCS[day.loc] || LOCS.fukushima;
  const today = nowAt(9).date;
  const ahead = daysBetween(today, day.date);
  const inRange = ahead >= 0 && ahead <= 15;
  const key = inRange ? `${day.loc}|${day.date}` : `${day.loc}|now`;
  const cache = store.get(K.wx, {});
  let data = null;
  let offline = false;
  const fresh = cache[key] && Date.now() - cache[key].ts < 30 * 60e3;
  if (fresh && !force) data = cache[key];
  else {
    try {
      const base = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&timezone=Asia%2FTokyo`;
      const url = inRange
        ? `${base}&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&start_date=${day.date}&end_date=${day.date}`
        : `${base}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&forecast_days=1`;
      data = { ts: Date.now(), json: await fetchJson(url) };
      cache[key] = data;
      store.set(K.wx, cache);
    } catch (e) {
      data = cache[key] || null;
      offline = true;
    }
  }
  if (token !== wxToken) return;
  const el = $('#wx');
  if (!el) return;
  const head = `<div class="strip-head"><b>🌤️ 天氣・${esc(loc.name)}</b><span class="muted small">${data ? (offline ? '離線快取・' : '') + fmtTs(data.ts) : ''}</span></div>`;
  if (!data) {
    el.innerHTML = `${head}<div class="small muted" style="margin-top:6px">無法取得天氣（離線且沒有快取）。${esc(loc.normal)}</div>
      <div class="btn-row"><button class="btn btn-ghost btn-sm" data-act="wx-retry">重試</button></div>`;
    return;
  }
  const j = data.json;
  if (inRange) {
    const d = j.daily;
    const [ic, txt] = WMO(d.weather_code[0]);
    const hours = (j.hourly.time || []).map((t, i) => ({ h: t.slice(11, 13), t: j.hourly.temperature_2m[i], p: j.hourly.precipitation_probability[i], c: j.hourly.weather_code[i] }))
      .filter(x => +x.h >= 6 && +x.h % 3 === 0);
    el.innerHTML = `${head}<div class="wx-big"><span class="e">${ic}</span><span class="t">${Math.round(d.temperature_2m_max[0])}° / ${Math.round(d.temperature_2m_min[0])}°</span>
      <span class="small muted">${txt}・降雨 ${d.precipitation_probability_max[0] ?? '—'}%</span></div>
      <div class="wx-hours">${hours.map(x => `<div class="wx-h"><div>${x.h}時</div><div class="e">${WMO(x.c)[0]}</div><div class="t">${Math.round(x.t)}°</div><div class="p">${x.p ?? '—'}%</div></div>`).join('')}</div>`;
  } else {
    const c = j.current || {};
    const [ic, txt] = WMO(c.weather_code);
    el.innerHTML = `${head}<div class="wx-big"><span class="e">${ic}</span><span class="t">${Math.round(c.temperature_2m)}°</span><span class="small muted">現在${txt}・今天 ${Math.round(j.daily.temperature_2m_max[0])}°/${Math.round(j.daily.temperature_2m_min[0])}°</span></div>
      <div class="small muted" style="margin-top:6px">${md(day.date)} 進入 16 天預報範圍後自動換成當天逐時預報。${esc(loc.normal)}</div>`;
  }
}

const RATE_FALLBACK = 0.21;
let convDir = 'JPY';

function getRate() { return store.get(K.rate, { rate: RATE_FALLBACK, src: '預設值', ts: 0, locked: false }); }

async function refreshRate(force = false) {
  const r = getRate();
  if (r.locked && !force) return r;
  if (!force && r.ts && Date.now() - r.ts < 6 * 3600e3) return r;
  const tries = [
    ['open.er-api.com', 'https://open.er-api.com/v6/latest/JPY', j => j.rates && j.rates.TWD],
    ['fawazahmed0', 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json', j => j.jpy && j.jpy.twd]
  ];
  for (const [src, url, pick] of tries) {
    try {
      const val = pick(await fetchJson(url));
      if (val > 0) {
        const nr = { rate: +val.toFixed(5), src, ts: Date.now(), locked: false };
        store.set(K.rate, nr);
        return nr;
      }
    } catch (e) { /* 換下一個來源 */ }
  }
  if (force) toast('抓不到匯率，沿用目前數值');
  return r;
}

          <div class="seg" id="curSeg" style="margin-bottom:4px"><button type="button" data-c="JPY" class="on">¥ JPY</button><button type="button" data-c="TWD">NT$</button></div>
        </div>

      </form>
    </div>

    <div class="card">
      <div class="total-box"><div><div class="muted small">總支出</div><div class="big">${yen(totalJ)}</div></div><div class="muted" style="text-align:right">≈ ${twd(totalJ * r.rate)}<div class="small">${Object.entries(byPayer).map(([k, s]) => `${esc(k)} ${yen(s)}`).join('・')}</div></div></div>
      ${dates.length ? dates.map(d => {
        const sum = byDate[d].reduce((s, e) => s + toJpy(e), 0);
        return `<div class="exp-day"><span>${md(d)}（${wd(d)}）</span><span>${yen(sum)}</span></div>` +
          byDate[d].map(e => `<div class="exp-row"><div class="grow"><div style="font-weight:700">${esc(e.name)}</div><div class="small muted">${esc(e.payer || '')}</div></div>
            <div class="amt">${e.cur === 'TWD' ? twd(e.amt) : yen(e.amt)}<small>${e.cur === 'TWD' ? '≈ ' + yen(e.amt / r.rate) : '≈ ' + twd(e.amt * r.rate)}</small></div>
            <button class="exp-del" data-del="${esc(e.id)}" aria-label="刪除">✕</button></div>`).join('');
      }).join('') : '<div class="empty">還沒有記帳</div>'}
      <div class="btn-row"><button class="btn btn-ghost" id="expExport">⬇︎ 匯出 CSV</button><button class="btn btn-danger" id="expClear">清除全部</button></div>
    </div>`;

  const top = $('#convTop'), bot = $('#convBot');
  const rateNow = () => getRate().rate;
  const calc = from => {
    const rt = rateNow();
    const val = parseFloat((from === 'top' ? top : bot).value);
    const target = from === 'top' ? bot : top;
    if (isNaN(val)) { target.value = ''; return; }
    const topIsJpy = convDir === 'JPY';
    const out = (from === 'top') === topIsJpy ? val * rt : val / rt;
    target.value = (from === 'top') === topIsJpy ? (Math.round(out * 10) / 10).toString() : Math.round(out).toString();
  };
  top.oninput = () => calc('top');
  bot.oninput = () => calc('bot');
  $('#swapBtn').onclick = () => {
    convDir = convDir === 'JPY' ? 'TWD' : 'JPY';
    $('#curTop').textContent = convDir;
    $('#curBot').textContent = convDir === 'JPY' ? 'TWD' : 'JPY';
    top.value = bot.value;
    calc('top');
  };
  $('#rateInput').onchange = e => {
    const val = parseFloat(e.target.value);
    if (!(val > 0)) return toast('匯率格式不對');
    store.set(K.rate, { rate: val, src: '手動', ts: Date.now(), locked: true });
    toast('已改用手動匯率並鎖定');
    renderWallet();
  };
  $('#lockBtn').onclick = () => {
    const cur = getRate();
    cur.locked = !cur.locked;
    store.set(K.rate, cur);
    toast(cur.locked ? '匯率已鎖定，不再自動更新' : '已解鎖，會自動抓最新匯率');
    renderWallet();
  };
  $('#rateRefresh').onclick = async () => {
    const cur = getRate();
    if (cur.locked && !(await askConfirm('匯率目前鎖定中，要解鎖並抓最新匯率嗎？', '解鎖並更新', false))) return;
    cur.locked = false;
    store.set(K.rate, cur);
    await refreshRate(true);
    renderWallet();
  };
  let cur = 'JPY';
  $('#curSeg').onclick = e => {
    const b = e.target.closest('[data-c]');
    if (!b) return;
    cur = b.dataset.c;
    $$('#curSeg button').forEach(x => x.classList.toggle('on', x === b));
  };
  $('#expForm').onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const amt = parseFloat(String(fd.get('amt')).replace(/[,，]/g, ''));
    if (!(amt > 0)) return toast('金額要大於 0');
    const list = store.get(K.exp, []);
    list.push({ id: uid('x'), date: fd.get('date'), name: fd.get('name').trim(), amt, cur, payer: fd.get('payer'), ts: Date.now() });
    store.set(K.exp, list);
    toast('已記帳');
    renderWallet();
  };
  v.onclick = async e => {
    const d = e.target.closest('[data-del]');
    if (!d) return;
    if (!(await askConfirm('刪除這筆？', '刪除'))) return;
    store.set(K.exp, store.get(K.exp, []).filter(x => x.id !== d.dataset.del));
    renderWallet();
  };
  $('#expExport').onclick = () => {
    const list = store.get(K.exp, []);
    if (!list.length) return toast('沒有資料');
    const rt = rateNow();
    const rows = [['日期', '項目', '金額', '幣別', '付款', '約合 JPY', '約合 TWD']].concat(list.map(x => {
      const j = x.cur === 'TWD' ? x.amt / rt : x.amt;
      return [x.date, x.name, x.amt, x.cur, x.payer || '', Math.round(j), Math.round(j * rt)];
    }));
    const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    download(`osaka-xmas-expenses-${nowAt(8).date}.csv`, csv, 'text/csv');
  };
  $('#expClear').onclick = async () => {
    if (!store.get(K.exp, []).length) return toast('沒有資料');
    if (await askConfirm('清除全部記帳？建議先匯出 CSV。', '全部清除')) {
      store.set(K.exp, []);
      renderWallet();
    }
  };
  if (!r.locked && (!r.ts || Date.now() - r.ts > 6 * 3600e3)) {
    refreshRate().then(nr => {
      const typing = document.activeElement && document.activeElement.closest('#view-wallet input, #view-wallet select');
      if (nr.ts !== r.ts && ui.view === 'wallet' && !sheets.length && !typing) renderWallet();
    });
  }
}

/* ⑤ 離線地圖截圖 */
function openMapShots() {
  const draw = async body => {
    const all = (await idb.all().catch(() => [])).filter(([k]) => k.startsWith('map:')).sort((a, b) => b[1].ts - a[1].ts);
    const days = sortedDays();
    body.innerHTML = `
      <div class="note small">把 Google Maps 的路線、站內地圖、餐廳位置先截圖存進來。圖片只存在這支手機，沒網路也能看。</div>
      <div class="row2" style="margin-top:12px;align-items:end">
        <label class="field" style="margin-bottom:0"><span>標記為</span><select id="shotTag"><option value="">一般</option>${days.map(d => `<option value="${d.date}">${md(d.date)} ${esc(d.title)}</option>`).join('')}</select></label>
        <button class="btn btn-primary" data-act="add" style="margin-bottom:0">📷 加入截圖</button>
      </div>
      <div class="sec-title">${all.length} 張</div>
      ${all.length ? `<div class="gallery">${all.map(([k, f]) => `<figure data-k="${esc(k)}"><img src="${f.dataUrl}" alt="${esc(f.name || '')}"><figcaption>${f.tag ? md(f.tag) : '一般'}</figcaption></figure>`).join('')}</div>`
        : '<div class="empty">還沒有截圖</div>'}`;
  };
  openSheet('🗺️ 離線地圖截圖', '<div class="empty">載入中…</div>', body => {
    draw(body);
    body.onclick = async e => {
      if (e.target.closest('[data-act=add]')) {
        const tag = $('#shotTag', body).value;
        const files = await pickFile('image/*', true);
        if (!files.length) return;
        toast('處理中…');
        for (const f of files) {
          try {
            await idb.set('map:' + uid(''), { dataUrl: await readImage(f, 2000, 'image/jpeg', 0.85), name: f.name, tag, ts: Date.now() });
          } catch (err) { toast('有一張讀取失敗'); }
        }
        toast(`已存 ${files.length} 張`);
        return draw(body);
      }
      const fig = e.target.closest('figure[data-k]');
      if (!fig) return;
      const k = fig.dataset.k;
      const f = await idb.get(k);
      if (!f) return;
      openSheet(f.tag ? md(f.tag) : '截圖', `<img class="fc-img" src="${f.dataUrl}" alt="" style="border-radius:12px;background:#fff">
        <div class="small muted" style="margin-top:6px">雙指可放大。</div>
        <div class="btn-row"><button class="btn" data-act="full">⛶ 全螢幕</button><button class="btn btn-danger" data-act="del">刪除</button></div>`, (b2, en2) => {
        b2.onclick = async ev => {
          const a = ev.target.closest('[data-act]');
          if (!a) return;
          if (a.dataset.act === 'full') openFullCard(() => `<img class="fc-img" src="${f.dataUrl}" alt="">`);
          if (a.dataset.act === 'del' && await askConfirm('刪除這張截圖？', '刪除')) {
            await idb.del(k);
            closeSheet(en2);
            draw(body);
          }
        };
      });
    };
  });
}

async function renderQr() {
  const grid = $('#qrGrid');
  if (!grid) return;
  const people = [['A', 'Aaron'], ['P', '伴侶']];
  const files = await Promise.all(people.map(([k]) => idb.get('vjw:' + k).catch(() => null)));
  grid.innerHTML = people.map(([k, name], i) => files[i]
    ? `<button class="qr-slot has" data-qr="${k}"><img src="${files[i].dataUrl}" alt="${name} QR"><b>${name}</b></button>`
    : `<button class="qr-slot" data-qrup="${k}"><span style="font-size:26px">＋</span><span>上傳 ${name} 的 QR 截圖</span></button>`).join('');
  grid.onclick = async e => {
    const up = e.target.closest('[data-qrup]');
    const show = e.target.closest('[data-qr]');
    if (up) {
      const [file] = await pickFile('image/*');
      if (!file) return;
      await idb.set('vjw:' + up.dataset.qrup, { dataUrl: await readImage(file, 1400, 'image/png'), name: file.name, ts: Date.now() });
      toast('QR 已存');
      renderQr();
    } else if (show) {
      const k = show.dataset.qr;
      const f = await idb.get('vjw:' + k);
      const name = k === 'A' ? 'Aaron' : '伴侶';
      openSheet(`🛂 ${name} 的 VJW QR`, `<img class="fc-img" src="${f.dataUrl}" alt="" style="background:#fff;border-radius:12px">
        <div class="btn-row"><button class="btn btn-primary" data-act="full">⛶ 全螢幕給海關看</button><button class="btn" data-act="replace">換一張</button><button class="btn btn-danger" data-act="del">刪除</button></div>`, (body, entry) => {
        body.onclick = async ev => {
          const a = ev.target.closest('[data-act]');
          if (!a) return;
          if (a.dataset.act === 'full') openFullCard(() => `<div style="text-align:center;font-weight:800;font-size:18px;margin-bottom:10px">${name}・Visit Japan Web</div><img class="fc-img" src="${f.dataUrl}" alt="">`);
          if (a.dataset.act === 'replace') {
            const [file] = await pickFile('image/*');
            if (!file) return;
            await idb.set('vjw:' + k, { dataUrl: await readImage(file, 1400, 'image/png'), name: file.name, ts: Date.now() });
            closeSheet(entry);
            renderQr();

          if (a.dataset.act === 'del' && await askConfirm(`刪除 ${name} 的 QR？`, '刪除')) {
            await idb.del('vjw:' + k);
            closeSheet(entry);
            renderQr();

  };

  const count = p => files.filter(([k]) => k.startsWith(p)).length;
  el.innerHTML = `
    <div><span>App 離線快取</span><span>${sw ? '✅ 已啟用' : '⏳ 重新開一次 APP 後生效'}</span></div>
    <div><span>天氣快取</span><span>${wxTs ? fmtTs(wxTs) + '（' + Object.keys(wx).length + ' 筆）' : '—'}</span></div>
    <div><span>匯率</span><span>${r.rate}${r.locked ? ' 🔒' : ''}${r.ts ? '・' + fmtTs(r.ts) : '（預設值）'}</span></div>
    <div><span>VJW QR／地圖截圖／主圖</span><span>${count('vjw:')}／${count('map:')}／${count('hero:')}</span></div>`;
}

async function offlinePrep() {
  toast('準備中…');
  const days = sortedDays();
  let ok = 0;
  for (const d of days) {
    try { await renderWeatherPrefetch(d); ok++; } catch (e) { /* 單日失敗略過 */ }
  }
  await refreshRate(!getRate().locked);
  const img = await offlineImages(true);
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('precache');
  toast(`完成：天氣 ${ok}/${days.length} 天、主圖 ${img} 張`);
  renderOfflineStatus();
}

async function renderWeatherPrefetch(day) {
  const loc = LOCS[day.loc] || LOCS.fukushima;
  const ahead = daysBetween(nowAt(9).date, day.date);
  const inRange = ahead >= 0 && ahead <= 15;
  const key = inRange ? `${day.loc}|${day.date}` : `${day.loc}|now`;
  const base = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&timezone=Asia%2FTokyo`;
  const url = inRange
    ? `${base}&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&start_date=${day.date}&end_date=${day.date}`
    : `${base}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&forecast_days=1`;
  const json = await fetchJson(url);
  const cache = store.get(K.wx, {});
  cache[key] = { ts: Date.now(), json };
  store.set(K.wx, cache);
}

async function offlineImages(silent = false) {
  let n = 0, fail = 0;
  for (const d of trip.days) {
    if (!d.bg || d.bg.startsWith('idb:')) continue;
    try {
      const r = await fetch(d.bg, { mode: 'cors' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const blob = await r.blob();
      const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
      await idb.set('hero:' + d.id, { dataUrl, name: d.bg, ts: Date.now() });
      d.bg = 'idb:hero:' + d.id;
      n++;
    } catch (e) { fail++; }
  }
  if (n) saveTrip();
  if (!silent) toast(n || fail ? `離線化 ${n} 張${fail ? `，${fail} 張失敗（網站不允許，可改用相簿上傳）` : ''}` : '沒有需要離線化的網路圖片');
  if (!silent) renderOfflineStatus();
  return n;
}

async function exportBackup() {
  const ls = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('ox26.')) ls[k] = localStorage.getItem(k);
  }
  const files = await idb.all().catch(() => []);
  const data = { app: 'osaka-xmas-2026', dataVer: DATA_VER, exportedAt: new Date().toISOString(), ls, files };
  download(`osaka-xmas-backup-${nowAt(8).date}.json`, JSON.stringify(data), 'application/json');
  toast('備份已下載');
}

async function importBackup() {
  const [file] = await pickFile('application/json,.json');
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { return toast('檔案格式不對'); }
  if (data.app !== 'osaka-xmas-2026' || !data.ls) return toast('這不是本 APP 的備份檔');
  if (!(await askConfirm(`匯入 ${String(data.exportedAt || '').slice(0, 10)} 的備份？目前手機上的資料會被覆蓋。`, '匯入'))) return;
  Object.keys(localStorage).filter(k => k.startsWith('ox26.')).forEach(k => localStorage.removeItem(k));
  Object.entries(data.ls).forEach(([k, v]) => { if (k.startsWith('ox26.')) localStorage.setItem(k, v); });
  await idb.clear().catch(() => {});
  for (const [k, v] of data.files || []) await idb.set(k, v);
  toast('匯入完成');
  setTimeout(() => location.reload(), 600);
}

async function resetApp() {
  if (!(await askConfirm('重置會清掉這支手機上的所有資料：行程修改、記帳、確認號、QR、截圖。\n建議先匯出備份。', '全部重置'))) return;
  Object.keys(localStorage).filter(k => k.startsWith('ox26.')).forEach(k => localStorage.removeItem(k));
  await idb.clear().catch(() => {});
  location.reload();
}

/* =========================================================
   啟動
   ========================================================= */
function init() {
  const n = jstTripNow();
  const todayDay = trip.days.find(d => d.date === n.date);
  if (todayDay) ui.day = todayDay.id;
  if (!trip.days.some(d => d.id === ui.day)) ui.day = sortedDays()[0]?.id;
  $$('.tab').forEach(t => { t.onclick = () => { closeAllSheets(); switchView(t.dataset.view); }; });
  renderCountdown();
  switchView(RENDER[ui.view] ? ui.view : 'trip');
  setInterval(() => { renderCountdown(); refreshNowHighlight(); }, 60e3);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    renderCountdown();
    refreshNowHighlight();
    if (wakeLock === null && $('.fullcard')) keepAwake(true);
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
init();
