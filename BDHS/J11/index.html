<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動態圓：探索 s = r × θ</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --panel-bg: #1e1e20;
            --card-bg: #2a2a2d;
            --input-bg: #3a3a3d;
            --text-main: #ffffff;
            --text-muted: #9aa0a6;
            --separator: #3c4043;
            
            /* 數值強調色 */
            --color-r: #fbbc04;     /* 黃色 */
            --color-rad: #81c995;   /* 綠色 */
            --color-arc: #8ab4f8;   /* 藍色 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 滿版左右並排佈局 */
        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 40px;
            width: 100%;
            max-width: 1400px;
            padding: 40px;
            box-sizing: border-box;
            align-items: stretch;
        }

        /* 左側：圖形區 */
        .canvas-section {
            flex: 1;
            background-color: var(--panel-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--separator);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1 / 1;
            height: auto;
        }

        /* 右側：控制區 */
        .controls-section {
            width: 550px; 
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* 數據面板 (2x2 網格) */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stat-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--separator);
            border-radius: 12px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .stat-label {
            font-size: 28px; 
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat-value {
            font-size: 52px; 
            font-weight: 600;
            font-family: 'SF Pro Display', Arial, sans-serif;
        }

        .val-r { color: var(--color-r); }
        .val-rad { color: var(--color-rad); }
        .val-arc { color: var(--color-arc); }
        .val-deg { color: var(--text-main); }

        /* 滑桿面板 */
        .sliders-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--separator);
            border-radius: 12px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-label {
            color: var(--text-muted);
            font-size: 30px;
            font-weight: 500;
        }

        .slider-value-box {
            background-color: var(--card-bg);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 28px;
            font-family: monospace;
            min-width: 80px;
            text-align: center;
            border: 1px solid #444;
        }

        .slider-control-row {
            display: flex;
            align-items: center;
        }

        /* 滑桿美化 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 32px;
        }
        
        input[type=range]:focus { outline: none; }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 30px;
            width: 30px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            border: 2px solid #fff;
        }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: var(--separator);
            border-radius: 3px;
        }

        /* 響應式設定 */
        @media (max-width: 1100px) {
            .main-layout {
                flex-direction: column;
                padding: 20px;
            }
            .controls-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="canvas-section">
            <canvas id="mathCanvas" width="1000" height="1000"></canvas>
        </div>

        <div class="controls-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">半徑 (r)</span>
                    <span class="stat-value val-r" id="valRadius">2.0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">弳度 (θ)</span>
                    <span class="stat-value val-rad" id="valRad">1.00</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">角度 (°)</span>
                    <span class="stat-value val-deg" id="valDeg">57.3°</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">弧長 (s)</span>
                    <span class="stat-value val-arc" id="valArc">2.00</span>
                </div>
            </div>

            <div class="sliders-panel">
                <div class="slider-group">
                    <div class="slider-header">
                        <span class="slider-label">角度 (θ) 控制</span>
                        <div class="slider-value-box" id="sliderValAngle">1.00</div>
                    </div>
                    <div class="slider-control-row">
                        <input type="range" id="angleSlider" min="0" max="6.28" step="0.01" value="1.00">
                    </div>
                </div>
                
                <div class="slider-group">
                    <div class="slider-header">
                        <span class="slider-label">半徑 (r) 控制</span>
                        <div class="slider-value-box" id="sliderValRadius">2.0</div>
                    </div>
                    <div class="slider-control-row">
                        <input type="range" id="radiusSlider" min="1" max="5" step="0.1" value="2.0">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('mathCanvas');
            const ctx = canvas.getContext('2d');
            
            const angleSlider = document.getElementById('angleSlider');
            const radiusSlider = document.getElementById('radiusSlider');
            
            const elements = {
                rad: document.getElementById('valRad'),
                deg: document.getElementById('valDeg'),
                r: document.getElementById('valRadius'),
                arc: document.getElementById('valArc'),
                sAngle: document.getElementById('sliderValAngle'),
                sRadius: document.getElementById('sliderValRadius')
            };

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            // 加大基礎比例尺，讓預設的圓形在畫布上更大
            const PIXELS_PER_UNIT = 85;

            const colors = {
                bg: '#1e1e20',
                axis: '#3c4043',
                circle: '#555555',
                radiusLine: '#cccccc',
                arc: '#8ab4f8',
                angleArc: '#81c995',
                rText: '#fbbc04',
                pointFill: '#ffffff'
            };

            function drawArrow(ctx, x, y, angle, color, size = 12) {
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x - size * Math.cos(angle - Math.PI / 6), y - size * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(x - size * Math.cos(angle + Math.PI / 6), y - size * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
            }

            function draw(angle, r) {
                const visualRadius = r * PIXELS_PER_UNIT;
                const arcLength = r * angle;

                ctx.fillStyle = colors.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 1. 畫坐標軸
                ctx.beginPath();
                ctx.setLineDash([8, 8]);
                ctx.strokeStyle = colors.axis;
                ctx.lineWidth = 2.5;
                ctx.moveTo(cx - 450, cy);
                ctx.lineTo(cx + 450, cy);
                ctx.moveTo(cx, cy - 450);
                ctx.lineTo(cx, cy + 450);
                ctx.stroke();
                ctx.setLineDash([]);

                // 2. 畫基準圓
                ctx.beginPath();
                ctx.arc(cx, cy, visualRadius, 0, 2 * Math.PI);
                ctx.strokeStyle = colors.circle;
                ctx.lineWidth = 2.5;
                ctx.stroke();

                const px = cx + visualRadius * Math.cos(angle);
                const py = cy - visualRadius * Math.sin(angle); 

                // 3. 畫圓心角 (綠色弧線與箭頭)
                if (angle > 0) {
                    ctx.beginPath();
                    // 控制角度綠線的半徑大小 (最大 60, 不小於 35)
                    const angleVisRadius = Math.min(60, Math.max(35, visualRadius - 20)); 
                    ctx.arc(cx, cy, angleVisRadius, 0, -angle, true);
                    ctx.strokeStyle = colors.angleArc;
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    if (angle > 0.05) {
                        const ax = cx + angleVisRadius * Math.cos(-angle);
                        const ay = cy + angleVisRadius * Math.sin(-angle);
                        const arrowAngle = -angle - Math.PI / 2; 
                        // 箭頭大小縮小為 0.8 倍 (適配 1000px 畫布)
                        drawArrow(ctx, ax, ay, arrowAngle, colors.angleArc, 34);
                    }
                }

                // 4. 畫半徑線
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + visualRadius, cy); 
                ctx.strokeStyle = colors.circle;
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(px, py); 
                ctx.strokeStyle = colors.radiusLine;
                ctx.lineWidth = 3;
                ctx.stroke();

                // 5. 畫實際弧長 (藍色粗弧線與箭頭)
                if (angle > 0) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, visualRadius, 0, -angle, true);
                    ctx.strokeStyle = colors.arc;
                    ctx.lineWidth = 6;
                    ctx.stroke();

                    if (angle > 0.05) {
                        const arrowAngle = -angle - Math.PI / 2;
                        // 箭頭大小縮小為 0.8 倍 (適配 1000px 畫布)
                        drawArrow(ctx, px, py, arrowAngle, colors.arc, 48);
                    }
                }

                // 6. 畫端點
                ctx.beginPath();
                ctx.arc(px, py, 8, 0, 2 * Math.PI);
                ctx.fillStyle = colors.pointFill;
                ctx.fill();

                // 7. 畫文字標籤
                const radStr = angle.toFixed(2);
                
                // [排版技巧] 使用 center 讓座標計算完美置中，不需手動針對各象限調整
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // 標示 半徑 r
                ctx.fillStyle = colors.rText;
                ctx.font = '40px monospace';
                // 當半徑縮小時，文字依然保持最小距離以免擠到圓心
                const rTextX = cx + Math.max(50, visualRadius / 2);
                ctx.fillText(`r = ${r.toFixed(1)}`, rTextX, cy - 25);

                if (angle > 0) {
                    // 標示 角度 θ
                    ctx.fillStyle = colors.angleArc;
                    ctx.font = '40px monospace';
                    // 建立最小半徑距離，防止 r 極小時文字互相重疊
                    const textRad = Math.max(130, visualRadius + 50);
                    const tx = cx + textRad * Math.cos(-angle/2);
                    const ty = cy + textRad * Math.sin(-angle/2);
                    ctx.fillText(`θ = ${radStr}`, tx, ty);

                    // 標示 弧長 s
                    ctx.fillStyle = colors.arc;
                    ctx.font = 'bold 44px monospace';
                    // 建立最小半徑距離，確保永遠比角度文字更靠外側
                    const arcMidRad = Math.max(190, visualRadius + 110);
                    const arcX = cx + arcMidRad * Math.cos(-angle/2);
                    const arcY = cy + arcMidRad * Math.sin(-angle/2);
                    ctx.fillText(`s = ${arcLength.toFixed(2)}`, arcX, arcY);
                }
            }

            function updateUI() {
                const angle = parseFloat(angleSlider.value) || 1.0;
                const r = parseFloat(radiusSlider.value) || 1.0;
                
                const degrees = (angle * 180 / Math.PI).toFixed(1);
                const radStr = angle.toFixed(2);
                const rStr = r.toFixed(1);
                const arcStr = (angle * r).toFixed(2);

                elements.rad.textContent = radStr;
                elements.deg.textContent = `${degrees}°`;
                elements.r.textContent = rStr;
                elements.arc.textContent = arcStr;
                
                elements.sAngle.textContent = radStr;
                elements.sRadius.textContent = rStr;

                draw(angle, r);
            }

            angleSlider.addEventListener('input', updateUI);
            radiusSlider.addEventListener('input', updateUI);

            // 初始化
            updateUI();
        });
    </script>
</body>
</html>
