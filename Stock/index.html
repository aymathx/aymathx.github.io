<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>區間計算器</title>
<style>
    /* 全域顏色與深色主題設定 (高對比版) */
    :root {
        --bg-color: #040508;    /* 更深邃的背景黑，突顯上方卡片 */
        --card-bg: #131722;     /* 卡片底色，帶一點極暗的藍灰 */
        --text-main: #ffffff;   /* 主文字純白 */
        --text-muted: #a4b1c6;  /* 次要文字提亮，增加可讀性 */
        
        /* 狀態顏色改用高飽和度的螢光色系 */
        --red: #ff3b5c;         /* 鮮豔明亮的紅 */
        --green: #00e676;       /* 螢光綠 */
        --blue: #339af0;        /* 亮眼的天藍色 (文字用) */
        
        --btn-blue: #1c68f3;    /* 按鈕專用的飽和藍色 */
        --border: #2c354a;      /* 邊框線條提亮，讓表格分界更清晰 */
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 8px; 
        box-sizing: border-box;
        
        /* 鎖定全螢幕高度，不允許滑動 */
        height: 100vh; 
        height: 100dvh; 
        overflow: hidden; 
        
        display: flex;
        justify-content: center;
    }
    .container {
        max-width: 1200px;
        width: 100%;
        height: 100%; 
        display: flex;
        flex-direction: column;
    }
    
    /* 輸入區塊樣式 */
    .input-group {
        background-color: var(--card-bg);
        border: 1px solid var(--border); /* 新增邊框增強對比 */
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 8px; 
        flex: 0 0 auto; 
        display: flex;
        gap: 15px;
        box-sizing: border-box;
        align-items: flex-end;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); /* 新增微陰影讓卡片浮現 */
    }
    .input-field {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .input-field label {
        color: var(--text-muted);
        font-size: 13px;
        font-weight: bold;
        text-align: center;
        letter-spacing: 0.5px;
    }
    .input-field input {
        background-color: #07090e; /* 輸入框內使用更深的黑色形成凹陷感 */
        border: 1px solid var(--border);
        color: white;
        padding: 8px;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        font-weight: bold;
        transition: 0.2s;
    }
    .input-field input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 5px rgba(51, 154, 240, 0.3);
    }
    button {
        background-color: var(--btn-blue);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        height: 40px;
        padding: 0 25px;
        transition: 0.2s;
        font-weight: bold;
        letter-spacing: 1px;
    }
    button:hover {
        background-color: #0b57e6;
    }

    /* 輸出圖表樣式 (左三右一排版) */
    #output {
        flex: 1 1 auto; 
        min-height: 0; 
        display: grid;
        grid-template-columns: 3fr 1fr; 
        gap: 10px;
    }
    .left-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr); 
        gap: 10px;
        height: 100%;
    }
    .right-group {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    
    /* 卡片與內容彈性填滿樣式 */
    .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border); /* 新增外框線 */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); /* 新增陰影 */
        border-radius: 10px;
        padding: 6px 0; 
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        flex: 1; 
        min-height: 0;
    }
    .card-title {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 4px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
        text-align: center;
        font-weight: bold;
        width: 80%; 
        margin-left: auto;
        margin-right: auto;
        flex: 0 0 auto;
        letter-spacing: 0.5px;
    }
    
    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 85%; 
        margin: 0 auto;
        border-bottom: 1px solid var(--border);
        flex: 1; 
        min-height: 0;
    }
    .row:last-child {
        border-bottom: none;
    }
    
    .row-centered {
        justify-content: center;
    }
    .col-val-center {
        font-size: 16px;
        font-weight: bold;
        color: var(--text-main);
        letter-spacing: 0.5px;
    }
    
    .col-label {
        font-weight: bold;
        font-size: 13px;
        letter-spacing: 0.5px;
    }
    .col-val {
        text-align: right;
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 0.5px;
        color: var(--text-main);
    }

    /* 狀態高亮顏色 (螢光感) */
    .text-red { color: var(--red); text-shadow: 0 0 8px rgba(255, 59, 92, 0.3); }
    .text-green { color: var(--green); text-shadow: 0 0 8px rgba(0, 230, 118, 0.3); }
    .text-blue { color: var(--blue); text-shadow: 0 0 8px rgba(51, 154, 240, 0.3); }

    /* --- 手機版最佳化 (滿版螢幕配置) --- */
    @media (max-width: 768px) {
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }
        .input-group .input-field:nth-child(1) { grid-column: 1 / 2; grid-row: 1 / 2; }
        .input-group .input-field:nth-child(2) { grid-column: 1 / 2; grid-row: 2 / 3; }
        .input-group button {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            width: 100%;
            height: 100%;
            font-size: 19px;
        }
        
        #output {
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
        }
        .left-group {
            display: flex;
            flex-direction: column;
            gap: 8px; 
        }
        
        .card-title { font-size: 12px; }
        .col-label { font-size: 12px; }
        .col-val { font-size: 14px; }
        .col-val-center { font-size: 15px; }
        .input-field input { font-size: 15px; padding: 6px; }
    }

    /* 針對非常小的舊款手機微調 */
    @media (max-width: 400px) {
        .input-group { gap: 8px; padding: 10px; }
        #output { gap: 6px; }
        .left-group { gap: 6px; }
        .card { padding: 4px 0; border-radius: 8px; }
        .col-label { font-size: 11px; }
        .col-val { font-size: 13px; }
        .col-val-center { font-size: 14px; }
        .input-field label { font-size: 12px; }
    }
</style>
</head>
<body>

<div class="container">
    <!-- 頂部輸入區 -->
    <div class="input-group">
        <div class="input-field">
            <label>Max</label>
            <input type="number" id="maxVal" value="49243">
        </div>
        <div class="input-field">
            <label>Min</label>
            <input type="number" id="minVal" value="39438">
        </div>
        <button onclick="calculate()">計算</button>
    </div>

    <!-- 結果渲染區 -->
    <div id="output"></div>
</div>

<script>
    function createRow(label, val, type) {
        if (!label) {
            return `
            <div class="row row-centered">
                <div class="col-val-center">${val}</div>
            </div>`;
        }

        let colorClass = '';
        if (type === 'up') colorClass = 'text-red';
        if (type === 'down') colorClass = 'text-green';
        if (type === 'mid') colorClass = 'text-blue';

        return `
        <div class="row">
            <div class="col-label ${colorClass}">${label}</div>
            <div class="col-val">${val}</div>
        </div>`;
    }

    function createCard(title, rowsHTML) {
        return `
        <div class="card">
            <div class="card-title">${title}</div>
            ${rowsHTML}
        </div>`;
    }

    function calculate() {
        const max = parseFloat(document.getElementById('maxVal').value);
        const min = parseFloat(document.getElementById('minVal').value);
        
        if (isNaN(max) || isNaN(min) || max <= min) {
            alert("請輸入正確的數值 (最大值需大於最小值)");
            return;
        }

        const range = max - min;
        
        const q3_val = Math.round(min + range * 0.75);
        const q2_val = Math.round(min + range * 0.5);
        const q1_val = Math.round(min + range * 0.25);

        // --- Big Bridge ---
        let t1_rows = "";
        t1_rows += createRow("", max, ""); 
        t1_rows += createRow("壓力", q3_val, "up");
        t1_rows += createRow("分界", q2_val, "mid");
        t1_rows += createRow("支撐", q1_val, "down");
        t1_rows += createRow("", min, ""); 

        // --- U - Bridge ---
        const upper_step = (q3_val - q2_val) / 4;
        const lower_step = (q2_val - q1_val) / 4;
        
        let t2_rows = "";
        t2_rows += createRow("", q3_val, "");
        t2_rows += createRow("壓力", Math.round(q2_val + upper_step * 3), "up");
        t2_rows += createRow("分界", Math.round(q2_val + upper_step * 2), "up");
        t2_rows += createRow("支撐", Math.round(q2_val + upper_step * 1), "up");
        t2_rows += createRow("", q2_val, "");

        // --- D - Bridge ---
        let t3_rows = "";
        t3_rows += createRow("", q2_val, "");
        t3_rows += createRow("壓力", Math.round(q1_val + lower_step * 3), "down");
        t3_rows += createRow("分界", Math.round(q1_val + lower_step * 2), "down");
        t3_rows += createRow("支撐", Math.round(q1_val + lower_step * 1), "down");
        t3_rows += createRow("", q1_val, "");

        // --- 建立左側群組 (包含上面三個) ---
        let leftHtml = `<div class="left-group">`;
        leftHtml += createCard("Big Bridge", t1_rows);
        leftHtml += createCard("U - Bridge", t2_rows);
        leftHtml += createCard("D - Bridge", t3_rows);
        leftHtml += `</div>`;

        // --- Fibonacci Retracement ---
        const fib_data = [
            { ratio: 0.809, label: "壓力三" },
            { ratio: 0.705, label: "壓力二" },
            { ratio: 0.618, label: "壓力一" },
            { ratio: 0.5,   label: "中線" },
            { ratio: 0.382, label: "支撐一" },
            { ratio: 0.295, label: "支撐二" },
            { ratio: 0.191, label: "支撐三" }
        ];
        
        let t4_rows = "";
        t4_rows += createRow("", max, ""); 
        
        fib_data.forEach(item => {
            const val = Math.round(min + range * item.ratio);
            let type = item.ratio > 0.5 ? "up" : (item.ratio < 0.5 ? "down" : "mid");
            t4_rows += createRow(item.label, val, type);
        });
        
        t4_rows += createRow("", min, ""); 

        // --- 建立右側群組 (包含 Fib) ---
        let rightHtml = `<div class="right-group">`;
        rightHtml += createCard("Fibonacci Retracement", t4_rows);
        rightHtml += `</div>`;

        // 渲染到網頁
        document.getElementById('output').innerHTML = leftHtml + rightHtml;
    }

    window.onload = calculate;
</script>
</body>
</html>
