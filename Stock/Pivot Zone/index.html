<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pivot Zone</title>
<style>
    /* 全域顏色與深色主題設定 */
    :root {
        --bg-color: #040508;    
        --card-bg: #131722;     
        --text-main: #ffffff;   
        --text-muted: #a4b1c6;  
        
        --red: #ff3b5c;         
        --green: #00e676;       
        --blue: #339af0;        
        
        --btn-blue: #1c68f3;    
        --border: #2c354a;      
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 8px; 
        box-sizing: border-box;
        
        height: 100vh; 
        height: 100dvh; 
        overflow: hidden; 
        
        display: flex;
        justify-content: center;
    }
    .container {
        max-width: 1200px;
        width: 100%;
        height: 100%; 
        display: flex;
        flex-direction: column;
    }
    
    /* 輸入區塊樣式 */
    .input-group {
        background-color: var(--card-bg);
        border: 1px solid var(--border); 
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 8px; 
        flex: 0 0 auto; 
        display: flex;
        gap: 15px;
        box-sizing: border-box;
        align-items: flex-end;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); 
    }
    .input-field {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .input-field label {
        color: var(--text-muted);
        font-size: 13px;
        font-weight: bold;
        text-align: center;
        letter-spacing: 0.5px;
    }
    .input-field input {
        background-color: #07090e; 
        border: 1px solid var(--border);
        color: white;
        padding: 8px;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        font-weight: bold;
        transition: 0.2s;
    }
    .input-field input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 5px rgba(51, 154, 240, 0.3);
    }
    
    /* 按鈕群組 (清空 與 計算) */
    .btn-group {
        display: flex;
        gap: 10px;
        flex-direction: row; /* 桌機版並排 */
    }
    button {
        background-color: var(--btn-blue);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        height: 40px;
        padding: 0 25px;
        transition: 0.2s;
        font-weight: bold;
        letter-spacing: 1px;
    }
    button:hover {
        background-color: #0b57e6;
    }
    
    /* 清空按鈕的專屬次要樣式 */
    .btn-clear {
        background-color: #1a202f;
        border: 1px solid var(--border);
        color: var(--text-muted);
    }
    .btn-clear:hover {
        background-color: #242c3f;
        color: var(--text-main);
    }

    /* 輸出圖表樣式 */
    #output {
        flex: 1 1 auto; 
        min-height: 0; 
        /* 預設為隱藏，計算後才會改為 grid */
        display: none;
        grid-template-columns: 3fr 1fr; 
        gap: 10px;
    }
    
    .left-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr); 
        gap: 10px;
        height: 100%;
    }
    .right-group {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    
    /* 基本卡片與各表格專屬背景色 */
    .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border); 
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); 
        border-radius: 10px;
        padding: 6px 0; 
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        flex: 1; 
        min-height: 0;
    }
    
    .card-ubridge {
        background-color: rgba(41, 121, 255, 0.08) !important; 
        border-color: rgba(41, 121, 255, 0.25);
    }
    .card-dbridge {
        background-color: rgba(170, 0, 255, 0.08) !important; 
        border-color: rgba(170, 0, 255, 0.25);
    }
    .card-fib {
        background-color: rgba(255, 255, 255, 0.04) !important; 
        border-color: rgba(255, 255, 255, 0.15);
    }

    .card-title {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 4px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
        text-align: center;
        font-weight: bold;
        width: 80%; 
        margin-left: auto;
        margin-right: auto;
        flex: 0 0 auto;
        letter-spacing: 0.5px;
    }
    
    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 85%; 
        margin: 0 auto;
        border-bottom: 1px solid var(--border);
        flex: 1; 
        min-height: 0;
    }
    .row:last-child {
        border-bottom: none;
    }
    
    .row-mid-bg {
        background-color: rgba(255, 215, 0, 0.15); 
        border-radius: 6px;
        padding: 0 10px; 
        width: 88%; 
        border-bottom: 1px solid transparent; 
        box-sizing: border-box;
    }

    .row-centered {
        justify-content: center;
    }
    .col-val-center {
        font-size: 16px;
        font-weight: bold;
        color: var(--text-main);
        letter-spacing: 0.5px;
    }
    
    .col-label {
        font-weight: bold;
        font-size: 13px;
        letter-spacing: 0.5px;
    }
    .col-val {
        text-align: right;
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 0.5px;
        color: var(--text-main);
    }

    /* 狀態高亮顏色 */
    .text-red { color: var(--red); text-shadow: 0 0 8px rgba(255, 59, 92, 0.3); }
    .text-green { color: var(--green); text-shadow: 0 0 8px rgba(0, 230, 118, 0.3); }
    .text-blue { color: var(--blue); text-shadow: 0 0 8px rgba(51, 154, 240, 0.3); }

    /* --- 手機版最佳化 --- */
    @media (max-width: 768px) {
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }
        .input-group .input-field:nth-child(1) { grid-column: 1 / 2; grid-row: 1 / 2; }
        .input-group .input-field:nth-child(2) { grid-column: 1 / 2; grid-row: 2 / 3; }
        
        /* 手機版將按鈕群組放到右側，並改為上下排列 */
        .btn-group {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            flex-direction: column; /* 上下排列 */
            gap: 8px;
            height: 100%;
        }
        .btn-group button {
            flex: 1; /* 按鈕各自佔據 50% 高度 */
            width: 100%;
            height: auto;
            font-size: 16px;
        }
        
        /* 隱藏狀態覆寫時仍需保持無效狀態，但顯示時改為 grid */
        #output.show-grid {
            display: grid !important;
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
        }
        
        .left-group {
            display: flex;
            flex-direction: column;
            gap: 8px; 
        }
        
        .card-title { font-size: 12px; }
        .col-label { font-size: 12px; }
        .col-val { font-size: 14px; }
        .col-val-center { font-size: 15px; }
        .input-field input { font-size: 15px; padding: 6px; }
    }

    @media (max-width: 400px) {
        .input-group { gap: 8px; padding: 10px; }
        .btn-group { gap: 6px; }
        .btn-group button { font-size: 15px; padding: 0; }
        
        #output.show-grid { gap: 6px; }
        .left-group { gap: 6px; }
        .card { padding: 4px 0; border-radius: 8px; }
        .col-label { font-size: 11px; }
        .col-val { font-size: 13px; }
        .col-val-center { font-size: 14px; }
        .input-field label { font-size: 12px; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="input-group">
        <div class="input-field">
            <label>Max</label>
            <input type="number" id="maxVal">
        </div>
        <div class="input-field">
            <label>Min</label>
            <input type="number" id="minVal">
        </div>
        <!-- ★ 新增按鈕群組 -->
        <div class="btn-group">
            <button class="btn-clear" onclick="clearAll()">清空</button>
            <button onclick="calculate()">計算</button>
        </div>
    </div>

    <div id="output"></div>
</div>

<script>
    // ★ 清空畫面與數值的函式
    function clearAll() {
        document.getElementById('maxVal').value = '';
        document.getElementById('minVal').value = '';
        
        const outputDiv = document.getElementById('output');
        outputDiv.innerHTML = '';
        outputDiv.style.display = 'none'; // 隱藏表格區域
        outputDiv.classList.remove('show-grid');
    }

    function createRow(label, val, type, isMid = false) {
        let rowClass = isMid ? "row row-mid-bg" : "row";

        if (!label) {
            rowClass += " row-centered"; 
            return `
            <div class="${rowClass}">
                <div class="col-val-center">${val}</div>
            </div>`;
        }

        let colorClass = '';
        if (type === 'up') colorClass = 'text-red';
        if (type === 'down') colorClass = 'text-green';
        if (type === 'mid') colorClass = 'text-blue';

        return `
        <div class="${rowClass}">
            <div class="col-label ${colorClass}">${label}</div>
            <div class="col-val">${val}</div>
        </div>`;
    }

    function createCard(title, rowsHTML, cardClass = "") {
        return `
        <div class="card ${cardClass}">
            <div class="card-title">${title}</div>
            ${rowsHTML}
        </div>`;
    }

    function calculate() {
        const max = parseFloat(document.getElementById('maxVal').value);
        const min = parseFloat(document.getElementById('minVal').value);
        
        if (isNaN(max) || isNaN(min) || max <= min) {
            alert("請輸入正確的數值 ( 最大值需大於最小值 )");
            return;
        }

        const range = max - min;
        
        const q3_val = Math.round(min + range * 0.75);
        const q2_val = Math.round(min + range * 0.5);
        const q1_val = Math.round(min + range * 0.25);

        let t1_rows = "";
        t1_rows += createRow("", max, ""); 
        t1_rows += createRow("壓力", q3_val, "up");
        t1_rows += createRow("", q2_val, "mid", true); 
        t1_rows += createRow("支撐", q1_val, "down");
        t1_rows += createRow("", min, ""); 

        const upper_step = (q3_val - q2_val) / 4;
        const lower_step = (q2_val - q1_val) / 4;
        
        let t2_rows = "";
        t2_rows += createRow("", q3_val, "");
        t2_rows += createRow("壓力", Math.round(q2_val + upper_step * 3), "up");
        t2_rows += createRow("", Math.round(q2_val + upper_step * 2), "up", true); 
        t2_rows += createRow("支撐", Math.round(q2_val + upper_step * 1), "up");
        t2_rows += createRow("", q2_val, "");

        let t3_rows = "";
        t3_rows += createRow("", q2_val, "");
        t3_rows += createRow("壓力", Math.round(q1_val + lower_step * 3), "down");
        t3_rows += createRow("", Math.round(q1_val + lower_step * 2), "down", true); 
        t3_rows += createRow("支撐", Math.round(q1_val + lower_step * 1), "down");
        t3_rows += createRow("", q1_val, "");

        let leftHtml = `<div class="left-group">`;
        leftHtml += createCard("Big Bridge", t1_rows, ""); 
        leftHtml += createCard("U - Bridge", t2_rows, "card-ubridge"); 
        leftHtml += createCard("D - Bridge", t3_rows, "card-dbridge"); 
        leftHtml += `</div>`;

        const fib_data = [
            { ratio: 0.809, label: "壓力三" },
            { ratio: 0.705, label: "壓力二" },
            { ratio: 0.618, label: "壓力一" },
            { ratio: 0.5,   label: "中線" },
            { ratio: 0.382, label: "支撐一" },
            { ratio: 0.295, label: "支撐二" },
            { ratio: 0.191, label: "支撐三" }
        ];
        
        let t4_rows = "";
        t4_rows += createRow("", max, ""); 
        
        fib_data.forEach(item => {
            const val = Math.round(min + range * item.ratio);
            let type = item.ratio > 0.5 ? "up" : (item.ratio < 0.5 ? "down" : "mid");
            let isMid = (item.ratio === 0.5); 
            
            let labelText = isMid ? "" : item.label;
            t4_rows += createRow(labelText, val, type, isMid);
        });
        
        t4_rows += createRow("", min, ""); 

        let rightHtml = `<div class="right-group">`;
        rightHtml += createCard("Fibonacci Retracement", t4_rows, "card-fib"); 
        rightHtml += `</div>`;

        const outputDiv = document.getElementById('output');
        outputDiv.innerHTML = leftHtml + rightHtml;
        
        // ★ 計算完畢後顯示表格
        outputDiv.style.display = 'grid'; 
        // 在手機版我們需要加上此 class 覆寫 RWD 的版型排列
        if(window.innerWidth <= 768) {
            outputDiv.classList.add('show-grid');
        }
    }

    // ★ 網頁載入完成時，預設執行一次清空(保持初始畫面乾淨)
    window.onload = clearAll;
</script>
</body>
</html>
