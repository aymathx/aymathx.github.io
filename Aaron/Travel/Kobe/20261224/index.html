<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>【 2026 Winter Kobe 】</title>
<meta name="theme-color" content="#F5F8FD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="神戶聖誕">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F8FD;
  --card: #FFFFFF;
  --ink: #1B2A41;
  --ink-2: #44546B;
  --muted: #8995A8;
  --line: #E2E9F3;
  --blue: #2F6FDB;
  --blue-2: #5B8FE6;
  --blue-soft: #EAF2FD;
  --navy: #1C3A70;
  --red: #E5484D;
  --red-soft: #FDECEC;
  --gold: #C99A3B;
  --gold-soft: #FBF3E2;
  --green: #2BA39B;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(31, 71, 140, .05), 0 8px 24px rgba(31, 71, 140, .08);
  --serif: "Noto Serif TC", "Songti TC", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Hiragino Sans", "Noto Sans TC", "Noto Sans JP", "Segoe UI", sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --t-FLIGHT: #E5484D;
  --t-TRANSPORT: #6E83B7;
  --t-LODGING: #7C64D6;
  --t-FOOD: #2F6FDB;
  --t-CAFE: #C08A3E;
  --t-SIGHT: #2BA39B;
  --t-SHOP: #D9862B;
  --t-RAMEN: #E0703A;
  --t-WORK: #8995A8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.5; font-size: 15px; min-height: 100vh; }
body.locked { overflow: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); }
.serif { font-family: var(--serif); }
.ja { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", var(--sans); }
svg.i { width: 1em; height: 1em; fill: currentColor; flex: none; vertical-align: -.125em; }

/* ---------- header ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30; text-align: center;
  padding: calc(var(--safe-t) + 12px) 16px 10px;
  background: rgba(245, 248, 253, .92);
  -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px);
}
.kicker { font-size: 11px; font-weight: 800; letter-spacing: .28em; color: var(--blue); }
.title { font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--navy); letter-spacing: .06em; margin-top: 2px; }
.sub-line { font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: .04em; }
.sub-line b { color: var(--blue); }

main { max-width: 640px; margin: 0 auto; padding: 4px 16px calc(var(--safe-b) + 108px); }
.view { display: none; }
.view.active { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- floating pill nav ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: calc(var(--safe-b) + 14px); z-index: 40; display: flex; justify-content: center; pointer-events: none; }
.tabbar-inner { pointer-events: auto; display: grid; grid-template-columns: repeat(4, 1fr); width: min(440px, calc(100% - 40px)); background: rgba(255, 255, 255, .96); border-radius: 999px; box-shadow: 0 10px 30px rgba(31, 71, 140, .16), 0 1px 2px rgba(31, 71, 140, .08); padding: 6px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 0 5px; border-radius: 999px; color: #A8B3C4; font-size: 10.5px; font-weight: 700; }
.tab svg { width: 25px; height: 25px; fill: currentColor; }
.tab.active { color: var(--blue); }

/* ---------- generic ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card-title { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--navy); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.card-title .sp { flex: 1; }
.sec-title { font-size: 11.5px; font-weight: 800; letter-spacing: .22em; color: var(--blue); margin: 24px 4px 10px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; vertical-align: 1px; white-space: nowrap; letter-spacing: .03em; }
.tag-est { background: var(--gold-soft); color: #93681A; }
.tag-off { background: var(--blue-soft); color: var(--blue); }
.tag-draft { background: #EEF1F6; color: var(--ink-2); }
.warn { background: var(--red-soft); color: #A8282C; border-radius: 12px; padding: 8px 11px; font-size: 13.5px; margin-top: 8px; }
.note { background: var(--blue-soft); color: #2A4F8F; border-radius: 12px; padding: 9px 11px; font-size: 13.5px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: 14.5px;
  background: var(--blue-soft); color: var(--blue); text-decoration: none; white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-red { background: var(--red); color: #fff; }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn-ghost { background: #fff; color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn-row .btn { flex: 1 1 auto; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .ttl { font-weight: 700; }
.chk { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; border: 2px solid #D4DDEA; background: #fff; font-size: 15px; color: #fff; font-weight: 800; }
.chk.on { background: var(--blue); border-color: var(--blue); }
.done .ttl { text-decoration: line-through; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
.x-btn { width: 32px; height: 32px; border-radius: 50%; color: var(--muted); font-size: 15px; flex: none; }

/* ---------- form ---------- */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; min-height: 44px;
  -webkit-appearance: none; appearance: none;
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--blue-2); box-shadow: 0 0 0 3px var(--blue-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; background: #E9EEF6; border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--muted); min-height: 36px; }
.seg button.on { background: #fff; color: var(--blue); box-shadow: 0 1px 3px rgba(31, 71, 140, .15); }
.check-line { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 12px; }
.check-line input { width: 20px; height: 20px; accent-color: var(--blue); }

/* ---------- trip ---------- */
.next-todo { display: flex; align-items: center; gap: 10px; background: #fff; box-shadow: var(--shadow); color: var(--ink-2); border-radius: 14px; padding: 10px 12px; margin: 4px 0 6px; font-size: 13.5px; width: 100%; text-align: left; }
.next-todo b { color: var(--blue); }
.date-tabs { display: flex; gap: 2px; overflow-x: auto; margin: 0 -16px; padding: 8px 16px 10px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.date-tabs::-webkit-scrollbar { display: none; }
.date-tab { flex: none; min-width: 66px; padding: 4px 8px 10px; text-align: center; position: relative; color: #A8B3C4; }
.date-tab .w { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; }
.date-tab .d { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.15; }
.date-tab.active { color: var(--blue); }
.date-tab.active::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--blue); }
.date-tab.today:not(.active) .d { color: var(--ink-2); }
.date-tab.add { color: var(--blue); font-size: 26px; font-weight: 400; display: grid; place-items: center; min-width: 52px; }
.day-wrap { display: grid; grid-template-columns: 1fr; gap: 0 14px; margin-top: 16px; }
.day-vert { display: none; }
@media (min-width: 640px) {
  .day-wrap { grid-template-columns: 34px 1fr; }
  .day-vert { display: block; font-family: var(--serif); font-weight: 700; font-size: 26px; color: var(--navy); writing-mode: vertical-rl; text-orientation: upright; letter-spacing: .1em; align-self: center; }
}
.hero { position: relative; border-radius: 22px; overflow: hidden; min-height: 196px; color: #fff; box-shadow: 0 12px 30px rgba(31, 71, 140, .22); background: #2F6FDB; }
.hero-art, .hero-art svg, .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-img { object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 33, 78, 0) 38%, rgba(11, 33, 78, .62)); pointer-events: none; }
.hero-text { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 1; }
.hero-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.hero-badge { border: 1.5px solid rgba(255, 255, 255, .85); border-radius: 7px; padding: 0 8px; font-size: 12px; letter-spacing: .12em; }
.hero-title { font-family: var(--serif); font-weight: 900; font-size: 25px; line-height: 1.25; margin-top: 6px; text-shadow: 0 2px 10px rgba(5, 20, 50, .35); }
.wx-head { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.wx-loc { display: inline-flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--navy); }
.wx-loc svg { color: var(--blue); width: 22px; height: 22px; }
.vbar { width: 1px; height: 22px; background: var(--line); }
.ic-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--blue); }
.ic-btn svg { width: 21px; height: 21px; fill: currentColor; }
.ic-btn.red { color: var(--red); }
.ic-btn.on { background: var(--blue); color: #fff; }
.wx-head .sp { flex: 1; }
.wx-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.wx-hours { display: flex; gap: 2px; overflow-x: auto; margin: 6px -16px 0; padding: 4px 16px 2px; scrollbar-width: none; }
.wx-hours::-webkit-scrollbar { display: none; }
.wx-h { flex: none; width: 56px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.3; }
.wx-h svg { width: 26px; height: 26px; color: var(--blue); margin: 4px auto 2px; display: block; }
.wx-h .t { font-weight: 800; font-size: 15px; color: var(--ink); }
.wx-h .p { color: var(--blue); font-weight: 700; font-size: 11px; }
.wx-day { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.wx-day b { font-size: 18px; color: var(--ink); font-family: var(--serif); }
.info-strip { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 14px; padding: 12px 14px; }
.strip-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
.strip-head b { font-family: var(--serif); font-size: 15px; color: var(--navy); }
.sun-row { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; margin-top: 6px; color: var(--ink-2); }
.sun-row b { font-variant-numeric: tabular-nums; color: var(--ink); }
.light-chip { display: block; width: 100%; text-align: left; margin-top: 8px; background: var(--blue-soft); border-radius: 12px; padding: 8px 10px; font-size: 13px; }
.light-chip .n { font-weight: 700; color: var(--navy); }
.hotel-bar { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.hotel-bar .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }
.hotel-bar .ico svg { width: 22px; height: 22px; }
.hotel-bar .grow { flex: 1; min-width: 0; }
.hotel-bar .nm { font-weight: 800; font-size: 14.5px; color: var(--navy); }
.chev { color: var(--muted); font-size: 20px; }
.rit-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.rit-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #fff; box-shadow: var(--shadow); min-height: 36px; color: var(--ink-2); }
.rit-chip.on { background: var(--blue); color: #fff; }
.branch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.branch .lbl { font-size: 13px; font-weight: 700; color: var(--muted); }

/* ---------- timeline (Fuji style) ---------- */
.timeline { margin-top: 18px; }
.ev { display: grid; grid-template-columns: 62px 22px 1fr; position: relative; width: 100%; text-align: left; cursor: pointer; }
.ev-time { text-align: right; padding: 13px 4px 0 0; font-family: var(--serif); font-weight: 600; font-size: 19px; color: var(--blue); font-variant-numeric: tabular-nums; line-height: 1.15; }
.ev-time small { display: block; font-family: var(--sans); font-weight: 600; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.ev-time .tag { margin-top: 5px; }
.ev-rail { position: relative; }
.ev-rail::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: #D6E3F7; }
.ev:first-child .ev-rail::before { top: 22px; }
.ev:last-child .ev-rail::before { bottom: calc(100% - 22px); }
.ev-dot { position: absolute; left: 4px; top: 17px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2.5px solid #BFD3F3; }
.ev.now .ev-dot, .ev:first-child .ev-dot { background: var(--blue); border-color: #CFE0FB; box-shadow: 0 0 0 3px #EAF2FD; }
.ev-body { margin: 8px 0 14px 6px; padding: 2px 0 4px 12px; border-left: 3.5px solid var(--tc, var(--blue)); }
.ev-title { font-family: var(--serif); font-weight: 700; font-size: 18px; line-height: 1.35; color: var(--navy); }
.ev-type { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; color: var(--muted); margin-top: 3px; }
.ev-type svg { width: 14px; height: 14px; color: var(--muted); }
.ev-sub { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
.ev-warn { font-size: 12.5px; color: var(--red); margin-top: 4px; font-weight: 600; }
.ev-tools { display: none; gap: 6px; margin-top: 6px; }
.editing .ev-tools { display: flex; }
.ev.past .ev-body, .ev.past .ev-time { opacity: .5; }
.ev.now .ev-body { background: linear-gradient(90deg, #EAF2FD, rgba(234, 242, 253, 0)); border-radius: 0 12px 12px 0; }
.now-badge { display: inline-block; background: var(--blue); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 999px; letter-spacing: .08em; }
.add-ev { margin: 0 0 0 90px; }
.day-note { margin-top: 14px; }
.type-FLIGHT { --tc: var(--t-FLIGHT); } .type-TRANSPORT { --tc: var(--t-TRANSPORT); } .type-LODGING { --tc: var(--t-LODGING); }
.type-FOOD { --tc: var(--t-FOOD); } .type-CAFE { --tc: var(--t-CAFE); } .type-SIGHT { --tc: var(--t-SIGHT); }
.type-SHOP { --tc: var(--t-SHOP); } .type-RAMEN { --tc: var(--t-RAMEN); } .type-WORK { --tc: var(--t-WORK); }

/* ---------- wallet ---------- */
.rate-card { background: linear-gradient(150deg, #1F4FA8, #2F6FDB 60%, #5B8FE6); color: #fff; }
.rate-card .card-title { color: #fff; }
.rate-meta { font-family: var(--sans); font-size: 12px; font-weight: 600; opacity: .85; }
.conv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-top: 6px; }
.conv-row { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, .14); border-radius: 14px; padding: 8px 12px; }
.conv-row .cur { width: 46px; font-weight: 800; letter-spacing: .05em; }
.conv-row input { flex: 1; min-width: 0; width: 100%; background: transparent; border: 0; color: #fff; font-size: 24px; font-weight: 800; text-align: right; outline: none; }
.conv-row input::placeholder { color: rgba(255, 255, 255, .5); }
.swap { align-self: center; justify-self: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .22); font-size: 18px; color: #fff; }
.rate-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: 13.5px; }
.rate-line input { width: 92px; border-radius: 10px; border: 0; padding: 6px 8px; font-weight: 800; text-align: center; }
.rate-line .btn { background: rgba(255, 255, 255, .2); color: #fff; }
.rate-line .btn.on { background: #fff; color: var(--blue); }
.total-box { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.total-box .big { font-family: var(--serif); font-size: 28px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.exp-day { font-size: 12.5px; font-weight: 800; color: var(--muted); margin: 14px 0 2px; display: flex; justify-content: space-between; }
.exp-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.exp-row .grow { flex: 1; min-width: 0; }
.exp-row .amt { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.exp-row .amt small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }

/* ---------- tools ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.tile { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; text-align: left; min-height: 108px; display: flex; flex-direction: column; gap: 4px; }
.tile .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; font-size: 20px; }
.tile .nm { font-family: var(--serif); font-weight: 700; font-size: 16px; color: var(--navy); margin-top: 2px; }
.tile .ds { font-size: 12px; color: var(--muted); line-height: 1.35; }
.tile.hot { background: var(--red); }
.tile.hot .ic { background: rgba(255, 255, 255, .2); color: #fff; }
.tile.hot .nm { color: #fff; }
.tile.hot .ds { color: rgba(255, 255, 255, .88); }
.phrase { display: block; width: 100%; text-align: left; padding: 11px 0; border-top: 1px solid var(--line); }
.phrase:first-child { border-top: 0; }
.phrase .zh { font-size: 13px; color: var(--muted); }
.phrase .jp { font-size: 16px; font-weight: 700; margin-top: 1px; color: var(--navy); }
.cat-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tabs button { flex: none; padding: 7px 14px; border-radius: 999px; background: #E9EEF6; font-weight: 700; font-size: 13.5px; min-height: 36px; color: var(--ink-2); }
.cat-tabs button.on { background: var(--blue); color: #fff; }
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.gallery figure { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #E9EEF6; }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery figcaption { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5px; color: #fff; padding: 2px 6px; background: linear-gradient(transparent, rgba(0, 0, 0, .6)); }
.sun-table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.sun-table th, .sun-table td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: center; }
.sun-table th { font-size: 12px; color: var(--muted); }
.progress { height: 8px; border-radius: 99px; background: #E9EEF6; overflow: hidden; margin-top: 8px; }

const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ox26', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('files', mode);
      const req = fn(t.objectStore('files'));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => run('readonly', s => s.get(k)),
    set: (k, v) => run('readwrite', s => s.put(v, k)),
    del: k => run('readwrite', s => s.delete(k)),
    clear: () => run('readwrite', s => s.clear()),
    async all() {
      const db = await open();
      return new Promise((res, rej) => {
        const out = [];
        const t = db.transaction('files');
        t.objectStore('files').openCursor().onsuccess = e => {
          const c = e.target.result;
          if (c) { out.push([c.key, c.value]); c.continue(); }
        };
        t.oncomplete = () => res(out);
        t.onerror = () => rej(t.error);
      });
    }
  };
})();

function readImage(file, max = 1600, type = 'image/jpeg', q = 0.82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc);
        c.height = Math.round(img.height * sc);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(type, q));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

function download(name, text, mime) {

}

/* 日出日落（天文公式，誤差約 ±1 分） */
function sunTimes(date, lat, lon, alt = -0.833) {
  const rad = Math.PI / 180;
  const J = Date.parse(date + 'T12:00:00Z') / 864e5 + 2440587.5;
  const n = Math.ceil(J - 2451545.0 + 0.0008);
  const Js = n - lon / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
  const cosw = (Math.sin(alt * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec));
  const w = Math.acos(Math.max(-1, Math.min(1, cosw))) / rad;
  const f = j => new Date((j - 2440587.5) * 864e5 + 9 * 3600e3).toISOString().slice(11, 16);
  return { rise: f(Jt - w / 360), set: f(Jt + w / 360) };
}

const sheets = [];
function openSheet(title, html, onMount) {
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  const sh = document.createElement('div');
  sh.className = 'sheet';
  sh.innerHTML = `<div class="sheet-head"><div class="sheet-title">${esc(title)}</div><button class="sheet-close" aria-label="關閉">✕</button></div><div class="sheet-body">${html}</div>`;
  document.body.append(bd, sh);
  document.body.classList.add('locked');
  requestAnimationFrame(() => { bd.classList.add('show'); sh.classList.add('show'); });
  const entry = { bd, sh };
  sheets.push(entry);
  bd.onclick = () => closeSheet(entry);
  $('.sheet-close', sh).onclick = () => closeSheet(entry);
  if (onMount) onMount($('.sheet-body', sh), entry);
  return entry;
}
function closeSheet(entry = sheets[sheets.length - 1]) {
  if (!entry) return;
  const i = sheets.indexOf(entry);
  if (i >= 0) sheets.splice(i, 1);
  entry.bd.classList.remove('show');
  entry.sh.classList.remove('show');
  setTimeout(() => { entry.bd.remove(); entry.sh.remove(); }, 250);
  if (!sheets.length && !$('.fullcard')) document.body.classList.remove('locked');
}
function closeAllSheets() { while (sheets.length) closeSheet(); }

function askConfirm(msg, okText = '確定', danger = true) {
  return new Promise(res => {
    let done = false;
    const entry = openSheet('確認', `<p style="font-size:15.5px;white-space:pre-wrap">${esc(msg)}</p>
      <div class="btn-row"><button class="btn btn-ghost" data-a="no">取消</button><button class="btn ${danger ? 'btn-red' : 'btn-primary'}" data-a="yes">${esc(okText)}</button></div>`, body => {
      body.onclick = e => {
        const a = e.target.closest('[data-a]');
        if (!a) return;
        done = true;
        closeSheet(entry);
        res(a.dataset.a === 'yes');
      };
    });
    const origClose = entry.bd.onclick;
    entry.bd.onclick = () => { if (!done) res(false); origClose(); };
    $('.sheet-close', entry.sh).onclick = entry.bd.onclick;
  });
}

function openFullCard(render, tabs) {

      <button class="fc-close" aria-label="關閉">✕</button></div><div class="fc-body">${render(cur)}</div>`;
    $('.fc-close', fc).onclick = close;
    $$('.seg button', fc).forEach(b => { b.onclick = () => { cur = b.dataset.k; draw(); }; });

}

   導覽
   ========================================================= */
function switchView(v) {
  ui.view = v;
  saveUi();
  $$('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
  $$('.tab').forEach(el => el.classList.toggle('active', el.dataset.view === v));
  RENDER[v]();
  window.scrollTo(0, 0);
}
const RENDER = { trip: renderTrip, wallet: renderWallet, tools: renderTools, info: renderInfo };

function renderCountdown() {
  const today = nowAt(8).date;
  const el = $('#countdown');
  const toStart = daysBetween(today, TRIP_START);
  const toEnd = daysBetween(today, TRIP_END);
  const range = `${md(TRIP_START)} – ${md(TRIP_END)}`;
  if (toStart > 0) el.innerHTML = `${range}・出發倒數 <b>${toStart}</b> 天`;
  else if (toEnd >= 0) el.innerHTML = `${range}・旅程第 <b>${1 - toStart}</b> 天 🎄`;
  else el.innerHTML = `${range}・Merry Xmas ✨`;
}

/* =========================================================
   行程
   ========================================================= */
function nextTodo() {
  const done = store.get(K.todo, {});
  return TODOS.filter(t => !done[t.id]).sort((a, b) => a.due.localeCompare(b.due))[0];
}

function renderTrip() {
  const v = $('#view-trip');
  const day = curDay();
  const today = nowAt(8).date;
  const nt = today < TRIP_START ? nextTodo() : null;
  const days = sortedDays();
  const tripNow = jstTripNow();
  v.innerHTML = `
    <div class="date-tabs" id="dateTabs">
      ${days.map(d => `<button class="date-tab ${d.id === day?.id ? 'active' : ''} ${d.date === tripNow.date ? 'today' : ''}" data-day="${esc(d.id)}">
        <div class="w">${wdEn(d.date)}</div><div class="d">${md(d.date)}</div></button>`).join('')}
      <button class="date-tab add" data-act="add-day" aria-label="新增一天">＋</button>
    </div>
    ${nt ? `<button class="next-todo" style="margin-top:12px"><span>📌</span><span>下一步｜<b>${md(nt.due)} 前</b> ${esc(nt.text)}</span></button>` : ''}
    <div id="dayView"></div>`;
  $('#dateTabs', v).onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.act === 'add-day') return openDayEditor(null);
    ui.day = b.dataset.day;
    saveUi();
    renderTrip();
  };
  const ntBtn = $('.next-todo', v);
  if (ntBtn) ntBtn.onclick = () => { switchView('info'); setTimeout(() => $('#sec-todo')?.scrollIntoView({ behavior: 'smooth' }), 60); };
  const active = $('.date-tab.active', v);
  if (active) active.scrollIntoView({ block: 'nearest', inline: 'center' });
  if (day) renderDay(day);
  else $('#dayView').innerHTML = '<div class="empty">還沒有任何一天，按 ＋ 新增</div>';
}

function renderDay(day) {
  const idx = sortedDays().findIndex(d => d.id === day.id);
  const loc = LOCS[day.loc] || LOCS.kobe;
  const br = day.branches ? (ui.branch[day.id] || 'A') : null;
  const rits = DAY_RITUALS[day.date] || [];
  const ritState = store.get(K.rit, {});
  const isFirst = day.date === TRIP_START;
  const isLast = day.date === TRIP_END;
  const hotelLine = isFirst ? HOTEL.firstNight : isLast ? HOTEL.lastDay : HOTEL.midStay;
  const dv = $('#dayView');
  dv.innerHTML = `
    <div class="day-wrap">
      <div class="day-vert">第${idx + 1}天</div>
      <div class="hero" id="hero">
        <div class="hero-art">${day.bg ? '' : HERO_ART[day.theme] || HERO_ART.kobe}</div>
        <div class="hero-text">
          <div class="hero-meta"><span class="hero-badge">DAY ${idx + 1}</span><span>${ic('place')} ${esc(day.city || loc.name)}</span></div>
          <div class="hero-title">${esc(day.title)}</div>
        </div>
      </div>
    </div>
    <div class="wx-head">
      <button class="wx-loc" data-act="wx-retry" aria-label="重新整理天氣">${ic('refresh')}<span>${esc(loc.en)}</span></button>
      <span class="vbar"></span>
      <button class="ic-btn" data-act="edit-day" aria-label="編輯這天">${ic('edit')}</button>
      <button class="ic-btn red" data-act="del-day" aria-label="刪除這天">${ic('trash')}</button>
      <span class="sp"></span>
      <button class="ic-btn ${ui.editing ? 'on' : ''}" data-act="toggle-edit" aria-label="編輯模式">${ic('gear')}</button>
    </div>
    <div id="wx"><div class="wx-meta">天氣載入中…</div></div>
    ${renderSunStrip(day, loc)}
    <div class="info-strip"><button class="hotel-bar" data-act="hotel"><span class="ico">${ic('hotel')}</span><span class="grow"><div class="nm">${esc(HOTEL.name)}</div><div class="muted small">${esc(hotelLine)}</div></span><span class="chev">›</span></button></div>
    ${rits.length ? `<div class="rit-chips">${rits.map(r => ritChip(r, ritState)).join('')}</div>` : ''}
    ${day.branches ? `<div class="branch"><span class="lbl">方案</span><div class="seg" id="branchSeg">
      <button data-b="A" class="${br === 'A' ? 'on' : ''}">A ${esc(day.branches.A)}</button>
      <button data-b="B" class="${br === 'B' ? 'on' : ''}">B ${esc(day.branches.B)}</button></div></div>` : ''}
    <div class="timeline ${ui.editing ? 'editing' : ''}" id="timeline">${renderTimelineHtml(day, br)}</div>
    <div class="add-ev"><button class="btn btn-ghost btn-sm" data-act="add-ev">＋ 新增行程</button></div>
    ${day.note ? `<div class="card day-note"><div class="card-title">備註</div><div style="white-space:pre-wrap;font-size:14px">${esc(day.note)}</div></div>` : ''}`;
  applyHeroImage(day);
  dv.onclick = async e => {
    const a = e.target.closest('[data-act],[data-ev],[data-rit],[data-b],[data-light]');
    if (!a) return;
    if (a.dataset.act === 'ev-edit') { e.stopPropagation(); return openEventEditor(day, findEvent(day, a.dataset.id)); }
    if (a.dataset.act === 'ev-del') { e.stopPropagation(); return deleteEvent(day, a.dataset.id); }
    if (a.dataset.ev) return openEventDetail(day, a.dataset.ev);
    if (a.dataset.b) { ui.branch[day.id] = a.dataset.b; saveUi(); return renderDay(day); }
    if (a.dataset.rit) { toggleRitual(a.dataset.rit); return renderDay(day); }
    if (a.dataset.light) return a.dataset.light === 'usj' ? openUsj() : openSunLights();
    const act = a.dataset.act;
    if (act === 'edit-day') openDayEditor(day);
    else if (act === 'del-day') deleteDay(day);
    else if (act === 'toggle-edit') { ui.editing = !ui.editing; saveUi(); renderDay(day); toast(ui.editing ? '編輯模式：每個行程下方可直接編輯／刪除' : '已關閉編輯模式'); }
    else if (act === 'hotel') openHotel();
    else if (act === 'add-ev') openEventEditor(day, null);
    else if (act === 'wx-retry') renderWeather(day, true);
  };
  renderWeather(day);
}

function ritChip(id, st) {
  const r = RITUALS[id];
  return `<button class="rit-chip ${st[id] ? 'on' : ''}" data-rit="${id}">${st[id] ? '✓' : r.icon} ${esc(r.label)}</button>`;
}
function toggleRitual(id) {
  const st = store.get(K.rit, {});
  if (st[id]) delete st[id]; else st[id] = Date.now();
  store.set(K.rit, st);
  toast(st[id] ? '✓ 已打卡' : '已取消打卡');
}

async function applyHeroImage(day) {
  const hero = $('#hero');
  if (!hero || !day.bg) return;
  let src = day.bg;
  if (src.startsWith('idb:')) {
    const f = await idb.get(src.slice(4)).catch(() => null);
    src = f && f.dataUrl;
  }
  const art = $('.hero-art', hero);
  if (!art || curDay().id !== day.id) return;
  if (src && !imgSrc(src) && !safeUrl(src)) src = '';
  if (!src) { art.innerHTML = HERO_ART[day.theme] || HERO_ART.kobe; return; }
  art.innerHTML = '';
  const img = document.createElement('img');
  img.className = 'hero-img';
  img.alt = '';
  img.src = src;
  img.onerror = () => { art.innerHTML = HERO_ART[day.theme] || HERO_ART.kobe; };
  art.appendChild(img);
}

function eventsFor(day, br) {
  return day.events
    .filter(e => !e.branch || !day.branches || e.branch === br)
    .sort((a, b) => toMin(a.time) - toMin(b.time));
}

function renderTimelineHtml(day, br) {
  const evs = eventsFor(day, br);
  if (!evs.length) return '<div class="empty">這天還沒有行程</div>';
  const n = jstTripNow();
  let nowIdx = -1;
  if (n.date === day.date) evs.forEach((e, i) => { if (toMin(e.time) <= n.min) nowIdx = i; });
  return evs.map((e, i) => {
    const t = TYPES[e.type] || TYPES.SIGHT;
    const cls = nowIdx < 0 ? '' : i < nowIdx ? 'past' : i === nowIdx ? 'now' : '';
    return `<div class="ev type-${esc(e.type)} ${cls}" role="button" tabindex="0" data-ev="${esc(e.id)}">
      <div class="ev-time">${esc(e.label || e.time)}${e.end ? `<small>–${esc(e.end)}</small>` : ''}${e.est ? '<span class="tag tag-est">預估</span>' : e.official ? '<span class="tag tag-off">官方</span>' : e.booked ? '<span class="tag tag-off">已訂</span>' : ''}</div>
      <div class="ev-rail"><span class="ev-dot"></span></div>
      <div class="ev-body">
        <div class="ev-title">${esc(e.title)}</div>
        <div class="ev-type">${ic(e.icon || t.icon)} ${esc(t.en)}${cls === 'now' ? ' <span class="now-badge">NOW</span>' : ''}</div>
        ${e.sub ? `<div class="ev-sub">${esc(e.sub)}</div>` : ''}
        ${e.warn ? `<div class="ev-warn">⚠️ ${esc(e.warn)}</div>` : ''}
        <div class="ev-tools"><button class="btn btn-sm btn-ghost" data-act="ev-edit" data-id="${esc(e.id)}">${ic('edit')} 編輯</button><button class="btn btn-sm btn-danger" data-act="ev-del" data-id="${esc(e.id)}">${ic('trash')} 刪除</button></div>
      </div></div>`;
  }).join('');
}

function refreshNowHighlight() {
  if (ui.view !== 'trip' || sheets.length) return;
  const day = curDay();
  const tl = $('#timeline');
  if (!day || !tl || jstTripNow().date !== day.date) return;
  tl.innerHTML = renderTimelineHtml(day, day.branches ? (ui.branch[day.id] || 'A') : null);

function renderSunStrip(day, loc) {
  const s = sunTimes(day.date, loc.lat, loc.lon);
  const dusk = sunTimes(day.date, loc.lat, loc.lon, -6).set;
  const lights = LIGHTS.filter(l => l.dates.includes(day.date));

  return `<div class="info-strip"><div class="strip-head"><b>日落・點燈</b><span class="muted small">日出日落為計算值</span></div>
    <div class="sun-row"><span>🌅 日出 <b>${s.rise}</b></span><span>🌇 日落 <b>${s.set}</b></span><span>🌃 天黑 <b>${dusk}</b></span></div>
    ${lights.map(l => `<button class="light-chip" data-light="${l.usj ? 'usj' : 'tbl'}"><div class="n">🎄 ${esc(l.name)}</div>
      <div class="small">${l.usj && shows.length ? esc(shows.map(x => x.time + ' ' + x.name).join('｜')) : esc(l.time)}</div>
      <div class="small muted">${esc(l.status)}</div></button>`).join('')}
  </div>`;
}

/* 天氣：16 天內顯示當天逐時預報；更早則顯示目前起 24 小時 */
function wxRequest(day) {
  const loc = LOCS[day.loc] || LOCS.kobe;
  const today = nowAt(9).date;
  const ahead = daysBetween(today, day.date);
  const inRange = ahead >= 0 && ahead <= 15;
  const base = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&timezone=Asia%2FTokyo&hourly=temperature_2m,precipitation_probability,weather_code`;
  const url = inRange
    ? `${base}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&start_date=${day.date}&end_date=${day.date}`
    : `${base}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=2`;
  return { loc, inRange, ahead, key: inRange ? `${day.loc}|${day.date}` : `${day.loc}|now`, url };
}

let wxToken = 0;
async function renderWeather(day, force = false) {
  const token = ++wxToken;
  const { loc, inRange, ahead, key, url } = wxRequest(day);
  const cache = store.get(K.wx, {});
  let data = null;
  let offline = false;
  const fresh = cache[key] && Date.now() - cache[key].ts < 30 * 60e3;
  if (fresh && !force) data = cache[key];
  else {
    try {
      data = { ts: Date.now(), json: await fetchJson(url) };
      cache[key] = data;
      store.set(K.wx, cache);
      if (force) toast('天氣已更新');
    } catch (e) {
      data = cache[key] || null;
      offline = true;
      if (force) toast('連不上天氣服務，顯示快取');
    }
  }
  if (token !== wxToken) return;
  const el = $('#wx');
  if (!el) return;
  if (!data) {
    el.innerHTML = `<div class="wx-meta">無法取得天氣（離線且沒有快取）。${esc(loc.normal)}</div>`;
    return;
  }
  const j = data.json;
  const stamp = `${offline ? '離線快取・' : ''}更新 ${fmtTs(data.ts)}`;
  let hours = (j.hourly.time || []).map((t, i) => ({ t, h: t.slice(11, 16), temp: j.hourly.temperature_2m[i], p: j.hourly.precipitation_probability[i], c: j.hourly.weather_code[i] }));
  let summary;
  if (inRange) {
    hours = hours.filter(x => +x.h.slice(0, 2) >= 6);
    const d = j.daily;
    summary = `<div class="wx-day"><b>${Math.round(d.temperature_2m_max[0])}° / ${Math.round(d.temperature_2m_min[0])}°</b><span>${WX_TEXT(d.weather_code[0])}・降雨 ${d.precipitation_probability_max[0] ?? '—'}%</span></div>
      <div class="wx-meta">${md(day.date)} ${esc(loc.name)} 逐時預報・${stamp}</div>`;
  } else {
    const nowKey = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 13);
    const start = Math.max(0, hours.findIndex(x => x.t.slice(0, 13) === nowKey));
    hours = hours.slice(start, start + 24);
    const c = j.current || {};
    summary = `<div class="wx-day"><b>${Math.round(c.temperature_2m)}°</b><span>現在${WX_TEXT(c.weather_code)}・今天 ${Math.round(j.daily.temperature_2m_max[0])}°/${Math.round(j.daily.temperature_2m_min[0])}°</span></div>
      <div class="wx-meta">目前${esc(loc.name)}・${ahead < 0 ? md(day.date) + ' 已過，顯示目前起 24 小時' : md(day.date) + ' 進入 16 天預報範圍後改成當天逐時預報・' + esc(loc.normal)}・${stamp}</div>`;
  }
  el.innerHTML = `<div class="wx-hours">${hours.map(x => `<div class="wx-h"><div>${x.h}</div>${wxSvg(x.c)}<div class="t">${Math.round(x.temp)}°</div><div class="p">${x.p ? x.p + '%' : ''}</div></div>`).join('')}</div>${summary}`;
}

/* ---------- 行程詳情與編輯 ---------- */
function findEvent(day, id) { return day.events.find(e => e.id === id); }

async function deleteEvent(day, id) {
  const e = findEvent(day, id);
  if (!e || !(await askConfirm(`刪除「${e.title}」？`, '刪除'))) return false;
  day.events = day.events.filter(x => x.id !== id);
  saveTrip();
  renderDay(day);
  toast('已刪除');
  return true;
}

async function deleteDay(day) {
  if (trip.days.length <= 1) return toast('至少保留一天');
  if (!(await askConfirm(`刪除 ${md(day.date)} 整天（含所有行程）？`, '刪除'))) return false;
  trip.days = trip.days.filter(d => d.id !== day.id);
  idb.del('hero:' + day.id).catch(() => {});
  saveTrip();
  ui.day = sortedDays()[0].id;
  saveUi();
  renderTrip();
  return true;
}

function openEventDetail(day, id) {
  const e = findEvent(day, id);
  if (!e) return;
  const t = TYPES[e.type] || TYPES.SIGHT;
  const resLocal = e.res ? (store.get(K.res, {})[e.res] || {}) : {};
  const isFood = ['FOOD', 'CAFE', 'RAMEN'].includes(e.type);
  const rows = [
    e.phone && `<div><span class="k">${ic('phone')}</span><a href="${telHref(e.phone)}" style="font-weight:700;color:var(--blue)">${esc(e.phone)}</a></div>`,
    e.hours && `<div><span class="k">${ic('clock')}</span><span>${esc(e.hours)}</span></div>`,
    e.addr && `<div><span class="k">${ic('place')}</span><span class="ja">${esc(e.addr)}</span></div>`,
    resLocal.conf && `<div><span class="k">${ic('ticket')}</span><span style="flex:1">預約號 <b>${esc(resLocal.conf)}</b></span><button class="btn btn-sm" data-copy="${esc(resLocal.conf)}">複製</button></div>`,
    resLocal.note && `<div><span class="k">🔒</span><span style="white-space:pre-wrap;font-size:13.5px">${esc(resLocal.note)}</span></div>`
  ].filter(Boolean);
  openSheet(t.zh, `
    <div class="det-head type-${esc(e.type)}"><span class="tm">${esc(e.label || e.time)}${e.end ? '–' + esc(e.end) : ''}</span>
      ${e.est ? '<span class="tag tag-est">預估</span>' : ''}${e.official ? '<span class="tag tag-off">官方時刻</span>' : ''}${e.booked ? '<span class="tag tag-off">已訂</span>' : ''}
      ${e.branch && day.branches ? `<span class="tag tag-draft">${esc(e.branch)} 案</span>` : ''}<span>${ic(e.icon || t.icon)} ${esc(t.en)}</span></div>
    <div class="det-title">${esc(e.title)}</div>
    ${e.sub ? `<div class="det-sub">${esc(e.sub)}</div>` : ''}
    ${e.warn ? `<div class="warn">⚠️ ${esc(e.warn)}</div>` : ''}
    ${rows.length ? `<div class="det-rows">${rows.join('')}</div>` : ''}
    ${e.desc ? `<div class="det-desc">${esc(e.desc)}</div>` : ''}
    <div class="btn-row">
      ${e.map || e.addr ? `<a class="btn btn-primary" href="${mapUrl(e.map || e.addr)}" target="_blank" rel="noopener">${ic('map')} Google Maps</a>` : ''}
      ${safeUrl(e.url) ? `<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">${ic('link')} 官網／預約</a>` : ''}
      ${isFood ? `<button class="btn btn-red" data-act="redline">${ic('block')} 紅線卡</button>` : ''}
    </div>
    <div class="btn-row"><button class="btn btn-ghost" data-act="edit">${ic('edit')} 編輯</button><button class="btn btn-danger" data-act="del">${ic('trash')} 刪除</button></div>`,
  (body, entry) => {
    body.onclick = async ev => {
      const c = ev.target.closest('[data-copy]');
      if (c) return copyText(c.dataset.copy);
      const a = ev.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'redline') openRedLine();
      else if (a.dataset.act === 'edit') { closeSheet(entry); openEventEditor(day, e); }
      else if (a.dataset.act === 'del') { if (await deleteEvent(day, e.id)) closeSheet(entry); }
    };

}

  </form>`, (body, entry) => {
    const f = $('#evForm', body);

   錢包：匯率（自動抓＋手動鎖定）＋記帳
   ========================================================= */
const RATE_FALLBACK = 0.21;
let convDir = 'JPY';

function getRate() { return store.get(K.rate, { rate: RATE_FALLBACK, src: '預設值', ts: 0, locked: false }); }

async function refreshRate(force = false) {
  const r = getRate();
  if (r.locked && !force) return r;
  if (!force && r.ts && Date.now() - r.ts < 6 * 3600e3) return r;
  const tries = [
    ['open.er-api.com', 'https://open.er-api.com/v6/latest/JPY', j => j.rates && j.rates.TWD],
    ['fawazahmed0', 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json', j => j.jpy && j.jpy.twd]
  ];
  for (const [src, url, pick] of tries) {
    try {
      const val = pick(await fetchJson(url));
      if (val > 0) {
        const nr = { rate: +val.toFixed(5), src, ts: Date.now(), locked: false };
        store.set(K.rate, nr);
        return nr;
      }
    } catch (e) { /* 換下一個來源 */ }
  }
  if (force) toast('抓不到匯率，沿用目前數值');
  return r;
}

function renderWallet() {
  const v = $('#view-wallet');
  const r = getRate();
  const exps = store.get(K.exp, []);
  const days = sortedDays();
  const todayJ = nowAt(9).date;
  const defDate = days.some(d => d.date === todayJ) ? todayJ : days[0]?.date || todayJ;
  const toJpy = e => e.cur === 'TWD' ? e.amt / r.rate : e.amt;
  const totalJ = exps.reduce((s, e) => s + toJpy(e), 0);
  const byDate = {};
  exps.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  const dates = Object.keys(byDate).sort();
  const byPayer = {};
  exps.forEach(e => { byPayer[e.payer || '共同'] = (byPayer[e.payer || '共同'] || 0) + toJpy(e); });
  v.innerHTML = `
    <div class="sec-title">WALLET</div>
    <div class="card rate-card">
      <div class="card-title">匯率換算<span class="sp"></span><span class="rate-meta">${r.locked ? '🔒 已鎖定' : esc(r.src)}${r.ts ? '・' + fmtTs(r.ts) : ''}</span></div>
      <div class="conv">
        <div class="conv-row"><span class="cur" id="curTop">${convDir}</span><input id="convTop" inputmode="decimal" placeholder="0"></div>
        <button class="swap" id="swapBtn" aria-label="交換幣別">⇅</button>
        <div class="conv-row"><span class="cur" id="curBot">${convDir === 'JPY' ? 'TWD' : 'JPY'}</span><input id="convBot" inputmode="decimal" placeholder="0"></div>
      </div>
      <div class="rate-line">1 JPY = <input id="rateInput" inputmode="decimal" value="${esc(r.rate)}"> TWD
        <button class="btn btn-sm ${r.locked ? 'on' : ''}" id="lockBtn">${r.locked ? '🔒 已鎖定' : '🔓 鎖定'}</button>
        <button class="btn btn-sm" id="rateRefresh">↻ 更新</button></div>
    </div>

    <div class="card">
      <div class="card-title">記一筆</div>
      <form id="expForm">
        <div class="row2">
          <label class="field"><span>日期</span><select name="date">${[...new Set([...days.map(d => d.date), todayJ])].sort().map(d => `<option value="${esc(d)}" ${d === defDate ? 'selected' : ''}>${md(d)}（${wd(d)}）</option>`).join('')}</select></label>
          <label class="field"><span>付款</span><select name="payer"><option>Aaron</option><option>Yvonne</option><option>共同</option></select></label>
        </div>
        <label class="field"><span>項目</span><input name="name" placeholder="例：一蘭、高速船" required></label>
        <div style="display:flex;gap:10px;align-items:flex-end">
          <label class="field" style="flex:1;margin-bottom:0"><span>金額</span><input name="amt" inputmode="decimal" placeholder="0" required></label>
          <div class="seg" id="curSeg" style="margin-bottom:4px"><button type="button" data-c="JPY" class="on">¥ JPY</button><button type="button" data-c="TWD">NT$</button></div>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:12px">＋ 加入</button>
      </form>
    </div>

    <div class="card">
      <div class="total-box"><div><div class="muted small">總支出</div><div class="big">${yen(totalJ)}</div></div><div class="muted" style="text-align:right">≈ ${twd(totalJ * r.rate)}<div class="small">${Object.entries(byPayer).map(([k, s]) => `${esc(k)} ${yen(s)}`).join('・')}</div></div></div>
      ${dates.length ? dates.map(d => {
        const sum = byDate[d].reduce((s, e) => s + toJpy(e), 0);
        return `<div class="exp-day"><span>${md(d)}（${wd(d)}）</span><span>${yen(sum)}</span></div>` +
          byDate[d].map(e => `<div class="exp-row"><div class="grow"><div style="font-weight:700">${esc(e.name)}</div><div class="small muted">${esc(e.payer || '')}</div></div>
            <div class="amt">${e.cur === 'TWD' ? twd(e.amt) : yen(e.amt)}<small>${e.cur === 'TWD' ? '≈ ' + yen(e.amt / r.rate) : '≈ ' + twd(e.amt * r.rate)}</small></div>
            <button class="x-btn" data-del="${esc(e.id)}" aria-label="刪除">✕</button></div>`).join('');
      }).join('') : '<div class="empty">還沒有記帳</div>'}
      <div class="btn-row"><button class="btn btn-ghost" id="expExport">⬇︎ 匯出 CSV</button><button class="btn btn-danger" id="expClear">清除全部</button></div>
    </div>`;

  const top = $('#convTop'), bot = $('#convBot');
  const rateNow = () => getRate().rate;
  const calc = from => {
    const rt = rateNow();
    const val = parseFloat((from === 'top' ? top : bot).value);
    const target = from === 'top' ? bot : top;
    if (isNaN(val)) { target.value = ''; return; }
    const fromJpy = (from === 'top') === (convDir === 'JPY');
    target.value = fromJpy ? (Math.round(val * rt * 10) / 10).toString() : Math.round(val / rt).toString();
  };
  top.oninput = () => calc('top');
  bot.oninput = () => calc('bot');
  $('#swapBtn').onclick = () => {
    convDir = convDir === 'JPY' ? 'TWD' : 'JPY';
    $('#curTop').textContent = convDir;
    $('#curBot').textContent = convDir === 'JPY' ? 'TWD' : 'JPY';
    top.value = bot.value;
    calc('top');
  };
  $('#rateInput').onchange = e => {
    const val = parseFloat(e.target.value);
    if (!(val > 0)) return toast('匯率格式不對');
    store.set(K.rate, { rate: val, src: '手動', ts: Date.now(), locked: true });
    toast('已改用手動匯率並鎖定');
    renderWallet();
  };
  $('#lockBtn').onclick = () => {
    const cur = getRate();
    cur.locked = !cur.locked;
    store.set(K.rate, cur);
    toast(cur.locked ? '匯率已鎖定，不再自動更新' : '已解鎖，會自動抓最新匯率');
    renderWallet();
  };
  $('#rateRefresh').onclick = async () => {
    const cur = getRate();
    if (cur.locked && !(await askConfirm('匯率目前鎖定中，要解鎖並抓最新匯率嗎？', '解鎖並更新', false))) return;
    cur.locked = false;
    store.set(K.rate, cur);
    await refreshRate(true);
    renderWallet();
  };
  let cur = 'JPY';
  $('#curSeg').onclick = e => {
    const b = e.target.closest('[data-c]');
    if (!b) return;
    cur = b.dataset.c;
    $$('#curSeg button').forEach(x => x.classList.toggle('on', x === b));
  };
  $('#expForm').onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const amt = parseFloat(String(fd.get('amt')).replace(/[,，]/g, ''));
    if (!(amt > 0)) return toast('金額要大於 0');
    const list = store.get(K.exp, []);
    list.push({ id: uid('x'), date: fd.get('date'), name: fd.get('name').trim(), amt, cur, payer: fd.get('payer'), ts: Date.now() });
    store.set(K.exp, list);
    toast('已記帳');
    renderWallet();
  };
  v.onclick = async e => {
    const d = e.target.closest('[data-del]');
    if (!d) return;
    if (!(await askConfirm('刪除這筆？', '刪除'))) return;
    store.set(K.exp, store.get(K.exp, []).filter(x => x.id !== d.dataset.del));
    renderWallet();
  };
  $('#expExport').onclick = () => {
    const list = store.get(K.exp, []);
    if (!list.length) return toast('沒有資料');
    const rt = rateNow();
    const rows = [['日期', '項目', '金額', '幣別', '付款', '約合 JPY', '約合 TWD']].concat(list.map(x => {
      const j = x.cur === 'TWD' ? x.amt / rt : x.amt;
      return [x.date, x.name, x.amt, x.cur, x.payer || '', Math.round(j), Math.round(j * rt)];
    }));
    const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    download(`kobe-xmas-expenses-${nowAt(8).date}.csv`, csv, 'text/csv');
  };
  $('#expClear').onclick = async () => {
    if (!store.get(K.exp, []).length) return toast('沒有資料');
    if (await askConfirm('清除全部記帳？建議先匯出 CSV。', '全部清除')) {
      store.set(K.exp, []);
      renderWallet();
    }
  };
  if (!r.locked && (!r.ts || Date.now() - r.ts > 6 * 3600e3)) {
    refreshRate().then(nr => {
      const typing = document.activeElement && document.activeElement.closest('#view-wallet input, #view-wallet select');
      if (nr.ts !== r.ts && ui.view === 'wallet' && !sheets.length && !typing) renderWallet();
    });
  }
}

/* 離線地圖截圖 */
function openMapShots() {
  const draw = async body => {
    const all = (await idb.all().catch(() => [])).filter(([k]) => k.startsWith('map:')).sort((a, b) => b[1].ts - a[1].ts);
    const days = sortedDays();
    body.innerHTML = `
      <div class="note small">把 Google Maps 的路線、站內地圖、餐廳位置先截圖存進來。圖片只存在這支手機，沒網路也能看。</div>
      <div class="row2" style="margin-top:12px;align-items:end">
        <label class="field" style="margin-bottom:0"><span>標記為</span><select id="shotTag"><option value="">一般</option>${days.map(d => `<option value="${esc(d.date)}">${md(d.date)} ${esc(d.title)}</option>`).join('')}</select></label>
        <button class="btn btn-primary" data-act="add" style="margin-bottom:0">📷 加入截圖</button>
      </div>
      <div class="sec-title">${all.length} 張</div>
      ${all.length ? `<div class="gallery">${all.map(([k, f]) => `<figure data-k="${esc(k)}"><img src="${imgSrc(f.dataUrl)}" alt="${esc(f.name || '')}"><figcaption>${f.tag ? md(f.tag) : '一般'}</figcaption></figure>`).join('')}</div>`
        : '<div class="empty">還沒有截圖</div>'}`;
  };
  openSheet('離線地圖截圖', '<div class="empty">載入中…</div>', body => {
    draw(body);
    body.onclick = async e => {
      if (e.target.closest('[data-act=add]')) {
        const tag = $('#shotTag', body).value;
        const files = await pickFile('image/*', true);
        if (!files.length) return;
        toast('處理中…');
        for (const f of files) {
          try {
            await idb.set('map:' + uid(''), { dataUrl: await readImage(f, 2000, 'image/jpeg', 0.85), name: f.name, tag, ts: Date.now() });
          } catch (err) { toast('有一張讀取失敗'); }
        }
        toast(`已存 ${files.length} 張`);
        return draw(body);
      }
      const fig = e.target.closest('figure[data-k]');
      if (!fig) return;
      const k = fig.dataset.k;
      const f = await idb.get(k);
      if (!f) return;
      openSheet(f.tag ? md(f.tag) : '截圖', `<img class="fc-img" src="${imgSrc(f.dataUrl)}" alt="" style="border-radius:12px;background:#fff">
        <div class="small muted" style="margin-top:6px">雙指可放大。</div>
        <div class="btn-row"><button class="btn" data-act="full">⛶ 全螢幕</button><button class="btn btn-danger" data-act="del">刪除</button></div>`, (b2, en2) => {
        b2.onclick = async ev => {
          const a = ev.target.closest('[data-act]');
          if (!a) return;
          if (a.dataset.act === 'full') openFullCard(() => `<img class="fc-img" src="${imgSrc(f.dataUrl)}" alt="">`);
          if (a.dataset.act === 'del' && await askConfirm('刪除這張截圖？', '刪除')) {
            await idb.del(k);
            closeSheet(en2);
            draw(body);
          }
        };
      });
    };
  });
}

        <button class="btn" data-act="offline-img">🖼️ 離線化主圖</button>
        <button class="btn btn-danger" data-act="reset">重置 APP</button>
      </div>
      <div class="small muted" style="margin-top:10px">備份含行程修改、記帳、確認號、QR 與截圖，可在另一支手機匯入（例如給 Yvonne 一份）。</div>
    </div>
    <div class="small muted" style="text-align:center;margin-top:8px">資料版本 v${DATA_VER}・${esc(DATA_LABEL)}</div>`;

  renderQr();
  renderOfflineStatus();

  v.onchange = e => {
    const s = e.target.closest('[data-status]');
    if (s) {
      const all = store.get(K.res, {});
      all[s.dataset.status] = Object.assign(all[s.dataset.status] || {}, { status: s.value });
      store.set(K.res, all);
      s.className = 'status st-' + s.value;
      toast('已更新狀態');
    }
  };
  v.oninput = e => {
    const c = e.target.closest('[data-conf],[data-note]');
    if (!c) return;
    const id = c.dataset.conf || c.dataset.note;
    const all = store.get(K.res, {});
    all[id] = Object.assign(all[id] || {}, c.dataset.conf ? { conf: c.value.trim() } : { note: c.value });
    store.set(K.res, all);
  };
  v.onclick = async e => {
    const cc = e.target.closest('[data-copyconf]');
    if (cc) {
      const val = (store.get(K.res, {})[cc.dataset.copyconf] || {}).conf;
      return val ? copyText(val) : toast('還沒有填確認號');
    }
    const td = e.target.closest('[data-todo]');
    if (td) {
      const all = store.get(K.todo, {});
      if (all[td.dataset.todo]) delete all[td.dataset.todo]; else all[td.dataset.todo] = Date.now();
      store.set(K.todo, all);
      return renderInfo();
    }
    const dc = e.target.closest('[data-delcontact]');
    if (dc) {
      if (await askConfirm('刪除這個聯絡人？', '刪除')) {
        store.set(K.contacts, store.get(K.contacts, []).filter(c => c.id !== dc.dataset.delcontact));
        renderInfo();
      }
      return;
    }
    const a = e.target.closest('[data-act]');
    if (!a) return;
    const act = a.dataset.act;
    if (act === 'redline') openRedLine();
    else if (act === 'hotel') openHotel();
    else if (act === 'help-card') openFullCard(() => `<span class="fc-badge ja">SOS</span><div class="fc-big ja">助けてください！</div>
      <div class="fc-sub ja">救急車を呼んでください。<br>警察を呼んでください。<br>中国語か英語を話せる人はいますか？</div>
      <p class="fc-zh">救命！請叫救護車／警察。有會說中文或英文的人嗎？</p>`);
    else if (act === 'add-contact') openContactEditor();
    else if (act === 'map-cfg') openMapCfg();
    else if (act === 'export') exportBackup();
    else if (act === 'import') importBackup();
    else if (act === 'paste-import') openPasteImport();
    else if (act === 'offline-img') offlineImages();
    else if (act === 'offline-prep') offlinePrep();
    else if (act === 'reset') resetApp();
    else if (act === 'apply-new') {
      if (await askConfirm('套用新版預設行程？你在 APP 裡改過的行程會被覆蓋（記帳、確認號、QR 不受影響）。', '套用')) {
        trip = structuredClone(TRIP_DEFAULT);
        saveTrip();
        toast('已套用新版行程');
        renderInfo();
      }
    }
  };
}

async function renderQr() {
  const grid = $('#qrGrid');
  if (!grid) return;
  const people = [['A', 'Aaron'], ['P', 'Yvonne']];
  const files = await Promise.all(people.map(([k]) => idb.get('vjw:' + k).catch(() => null)));
  grid.innerHTML = people.map(([k, name], i) => files[i]
    ? `<button class="qr-slot has" data-qr="${k}"><img src="${imgSrc(files[i].dataUrl)}" alt="${name} QR"><b>${name}</b></button>`
    : `<button class="qr-slot" data-qrup="${k}"><span style="font-size:26px">＋</span><span>上傳 ${name} 的 QR 截圖</span></button>`).join('');
  grid.onclick = async e => {
    const up = e.target.closest('[data-qrup]');
    const show = e.target.closest('[data-qr]');
    if (up) {
      const [file] = await pickFile('image/*');
      if (!file) return;
      await idb.set('vjw:' + up.dataset.qrup, { dataUrl: await readImage(file, 1400, 'image/png'), name: file.name, ts: Date.now() });
      toast('QR 已存');
      renderQr();
    } else if (show) {
      const k = show.dataset.qr;
      const f = await idb.get('vjw:' + k);
      const name = k === 'A' ? 'Aaron' : 'Yvonne';
      openSheet(`${name} 的 VJW QR`, `<img class="fc-img" src="${imgSrc(f.dataUrl)}" alt="" style="background:#fff;border-radius:12px">
        <div class="btn-row"><button class="btn btn-primary" data-act="full">⛶ 全螢幕給海關看</button><button class="btn" data-act="replace">換一張</button><button class="btn btn-danger" data-act="del">刪除</button></div>`, (body, entry) => {
        body.onclick = async ev => {
          const a = ev.target.closest('[data-act]');
          if (!a) return;
          if (a.dataset.act === 'full') openFullCard(() => `<div style="text-align:center;font-weight:800;font-size:18px;margin-bottom:10px">${name}・Visit Japan Web</div><img class="fc-img" src="${imgSrc(f.dataUrl)}" alt="">`);
          if (a.dataset.act === 'replace') {
            const [file] = await pickFile('image/*');
            if (!file) return;
            await idb.set('vjw:' + k, { dataUrl: await readImage(file, 1400, 'image/png'), name: file.name, ts: Date.now() });
            closeSheet(entry);
            renderQr();
          }
          if (a.dataset.act === 'del' && await askConfirm(`刪除 ${name} 的 QR？`, '刪除')) {
            await idb.del('vjw:' + k);
            closeSheet(entry);
            renderQr();
          }
        };
      });
    }
  };
}

function openContactEditor() {
  openSheet('個人聯絡人', `<form id="ctForm"><label class="field"><span>名稱</span><input name="name" required placeholder="例：信用卡掛失（國泰）"></label>
    <label class="field"><span>電話</span><input name="num" inputmode="tel" required placeholder="+886-2-…"></label>
    <div class="note small" style="margin-bottom:12px">🔒 只存在這支手機。</div>
    <button class="btn btn-primary btn-block">儲存</button></form>`, (body, entry) => {
    $('#ctForm', body).onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const list = store.get(K.contacts, []);
      list.push({ id: uid('c'), name: fd.get('name').trim(), num: fd.get('num').trim() });
      store.set(K.contacts, list);
      closeSheet(entry);
      renderInfo();
    };
  });
}

function openMapCfg() {
  const cfg = store.get(K.map, { link: '', embed: '' });
  openSheet('地圖設定', `<form id="mapForm">
    <label class="field"><span>Google Maps 清單分享連結</span><input name="link" type="url" value="${esc(cfg.link)}" placeholder="https://maps.app.goo.gl/…"></label>
    <label class="field"><span>內嵌地圖網址（My Maps「嵌入」的 src，可空）</span><input name="embed" type="url" value="${esc(cfg.embed)}" placeholder="https://www.google.com/maps/d/embed?mid=…"></label>
    <button class="btn btn-primary btn-block">儲存</button></form>`, (body, entry) => {
    $('#mapForm', body).onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const embed = fd.get('embed').trim();
      if (embed && !MAP_EMBED_RE.test(embed)) return toast('內嵌網址要是 Google Maps 的網址');
      store.set(K.map, { link: fd.get('link').trim(), embed });
      closeSheet(entry);
      renderInfo();
    };
  });
}

async function renderOfflineStatus() {
  const el = $('#offStatus');
  if (!el) return;
  const sw = 'serviceWorker' in navigator && navigator.serviceWorker.controller;
  const wx = store.get(K.wx, {});
  const wxTs = Math.max(0, ...Object.values(wx).map(x => x.ts));
  const r = getRate();
  const files = await idb.all().catch(() => []);
  const count = p => files.filter(([k]) => k.startsWith(p)).length;
  el.innerHTML = `
    <div><span>App 離線快取</span><span>${sw ? '✅ 已啟用' : '⏳ 重新開一次 APP 後生效'}</span></div>
    <div><span>天氣快取</span><span>${wxTs ? fmtTs(wxTs) + '（' + Object.keys(wx).length + ' 筆）' : '—'}</span></div>
    <div><span>匯率</span><span>${esc(r.rate)}${r.locked ? ' 🔒' : ''}${r.ts ? '・' + fmtTs(r.ts) : '（預設值）'}</span></div>
    <div><span>VJW QR／地圖截圖／主圖</span><span>${count('vjw:')}／${count('map:')}／${count('hero:')}</span></div>`;
}

async function offlinePrep() {
  toast('準備中…');
  const days = sortedDays();
  let ok = 0;
  const cache = store.get(K.wx, {});
  for (const d of days) {
    try {
      const { key, url } = wxRequest(d);
      cache[key] = { ts: Date.now(), json: await fetchJson(url) };
      ok++;
    } catch (e) { /* 單日失敗略過 */ }
  }
  store.set(K.wx, cache);
  await refreshRate(!getRate().locked);
  const img = await offlineImages(true);
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('precache');
  toast(`完成：天氣 ${ok}/${days.length} 天、主圖 ${img} 張`);
  renderOfflineStatus();
}

async function offlineImages(silent = false) {
  let n = 0, fail = 0;
  for (const d of trip.days) {
    if (!d.bg || d.bg.startsWith('idb:')) continue;
    try {
      const r = await fetch(d.bg, { mode: 'cors' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const blob = await r.blob();
      const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
      await idb.set('hero:' + d.id, { dataUrl, name: d.bg, ts: Date.now() });
      d.bg = 'idb:hero:' + d.id;
      n++;
    } catch (e) { fail++; }
  }
  if (n) saveTrip();
  if (!silent) toast(n || fail ? `離線化 ${n} 張${fail ? `，${fail} 張失敗（網站不允許，可改用相簿上傳）` : ''}` : '沒有需要離線化的網路圖片（插畫本來就離線可用）');
  if (!silent) renderOfflineStatus();
  return n;
}

/* 私人資料合併匯入：備份檔 mode=merge，或網址 #import=… */
async function mergeImport(data, label) {
  if (!data || typeof data !== 'object' || data.app !== APP_ID || data.mode !== 'merge') return toast('匯入資料格式不對');
  label = String(label || '私人預約資料').slice(0, 60);
  const ids = new Set(RESERVATIONS.map(r => r.id));
  const entries = Object.entries(data.res && typeof data.res === 'object' ? data.res : {})
    .filter(([k, v]) => ids.has(k) && v && typeof v === 'object');
  const contacts = Array.isArray(data.contacts) ? data.contacts.filter(c => c && typeof c.name === 'string' && typeof c.num === 'string') : [];
  if (!entries.length && !contacts.length) return toast('匯入資料裡沒有可用的內容');
  if (!(await askConfirm(`把「${label}」存進這支手機？\n共 ${entries.length} 筆預約的確認號與備註，只存在本機、不會上傳。`, '存進手機', false))) return;
  const all = store.get(K.res, {});
  for (const [k, v] of entries) {
    const o = {};
    if (typeof v.conf === 'string') o.conf = v.conf;
    if (typeof v.note === 'string') o.note = v.note;
    if (RES_STATUSES.includes(v.status)) o.status = v.status;
    all[k] = Object.assign(all[k] || {}, o);
  }
  store.set(K.res, all);
  if (contacts.length) {
    const list = store.get(K.contacts, []);
    contacts.forEach(c => { if (!list.some(x => x.num === c.num)) list.push({ id: uid('c'), name: c.name, num: c.num }); });
    store.set(K.contacts, list);
  }
  toast('已存進手機');
  RENDER[ui.view]();
}

/* 匯入碼＝網址 #import= 後面那段 base64url JSON；也接受整條網址 */
function decodeImportCode(text) {
  const m = /#import=([A-Za-z0-9_-]+)/.exec(text) || /^\s*([A-Za-z0-9_-]{20,})\s*$/.exec(text);
  if (!m) return null;
  try {
    const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))));
  } catch (e) { return null; }
}

function checkHashImport() {
  if (!location.hash.startsWith('#import=')) return;
  const data = decodeImportCode(location.hash);
  history.replaceState(null, '', location.pathname + location.search);
  if (!data) return toast('匯入連結格式不對');
  mergeImport(data, data.label || '私人預約資料');
}

/* 主畫面 APP 和 Safari 的資料分開存：在 APP 裡貼上匯入連結 */
function openPasteImport() {
  openSheet('貼上匯入碼', `<div class="note small">把私人匯入連結整條複製，貼在下面。加到主畫面的 APP 和 Safari 的資料是分開的，在哪裡用就在哪裡匯入。</div>
    <label class="field" style="margin-top:12px"><span>匯入連結或匯入碼</span><textarea id="importCode" rows="4" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></label>
    <button class="btn btn-primary btn-block" data-act="go">匯入</button>`, (body, entry) => {
    $('[data-act=go]', body).onclick = () => {
      const data = decodeImportCode($('#importCode', body).value);
      if (!data) return toast('看不懂這段匯入碼');
      closeSheet(entry);
      mergeImport(data, data.label || '私人預約資料');
    };
  });
}

async function exportBackup() {
  const ls = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('ox26.')) ls[k] = localStorage.getItem(k);
  }
  const files = await idb.all().catch(() => []);
  const data = { app: APP_ID, dataVer: DATA_VER, exportedAt: new Date().toISOString(), ls, files };
  download(`kobe-xmas-backup-${nowAt(8).date}.json`, JSON.stringify(data), 'application/json');
  toast('備份已下載');
}

async function importBackup() {
  const [file] = await pickFile('application/json,.json');
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { return toast('檔案格式不對'); }
  if (data.mode === 'merge') return mergeImport(data, data.label || file.name);
  if (data.app !== APP_ID || !data.ls) return toast('這不是本 APP 的備份檔');
  if (!(await askConfirm(`匯入 ${String(data.exportedAt || '').slice(0, 10)} 的備份？目前手機上的資料會被覆蓋。`, '匯入'))) return;
  Object.keys(localStorage).filter(k => k.startsWith('ox26.')).forEach(k => localStorage.removeItem(k));
  Object.entries(data.ls).forEach(([k, v]) => { if (k.startsWith('ox26.')) localStorage.setItem(k, v); });
  await idb.clear().catch(() => {});
  for (const [k, v] of data.files || []) await idb.set(k, v);
  toast('匯入完成');
  setTimeout(() => location.reload(), 600);
}

async function resetApp() {
  if (!(await askConfirm('重置會清掉這支手機上的所有資料：行程修改、記帳、確認號、QR、截圖。\n建議先匯出備份。', '全部重置'))) return;
  Object.keys(localStorage).filter(k => k.startsWith('ox26.')).forEach(k => localStorage.removeItem(k));
  await idb.clear().catch(() => {});
  location.reload();
}

/* =========================================================
   啟動
   ========================================================= */
function init() {
  const n = jstTripNow();
  const todayDay = trip.days.find(d => d.date === n.date);
  if (todayDay) ui.day = todayDay.id;
  if (!trip.days.some(d => d.id === ui.day)) ui.day = sortedDays()[0]?.id;
  $$('.tab').forEach(t => { t.onclick = () => { closeAllSheets(); switchView(t.dataset.view); }; });
  renderCountdown();
  switchView(RENDER[ui.view] ? ui.view : 'trip');
  checkHashImport();
  window.addEventListener('hashchange', checkHashImport);
  setInterval(() => { renderCountdown(); refreshNowHighlight(); }, 60e3);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    renderCountdown();
    refreshNowHighlight();
    if (wakeLock === null && $('.fullcard')) keepAwake(true);
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
init();
